name: security assessment

on:
  schedule:
    - cron: '23 2 * * 3'
  workflow_dispatch:

concurrency:
  group: scheduled-security-assessment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  safe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build and test the candidate
        run: ./mvnw -B verify
      - name: Qualify the local candidate image
        run: node tools/courtside.uat-smoke.mjs --confirm courtside-uat
      - id: candidate
        name: Resolve the immutable local image digest
        run: echo "digest=$(docker image inspect courtside:uat-local --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Prepare pinned assessment images
        run: |
          docker pull postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          docker pull caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          docker pull zaproxy/zap-stable:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
          docker pull schemathesis/schemathesis:4.25.0@sha256:980d159d1211ed2ef1f571aa8c6876955c6699dfd6463b8b5f28e788aa61e25e
      - name: Start the disposable security target
        env:
          RUN_ID: scheduled-${{ github.run_id }}-${{ github.run_attempt }}
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: node tools/courtside.mjs security "$RUN_ID" "$IMAGE_DIGEST"
      - name: Execute the bounded safe assessment
        env:
          RUN_ID: scheduled-${{ github.run_id }}-${{ github.run_attempt }}
        run: node tools/courtside.mjs security-run "$RUN_ID" safe --qualification build/uat-smoke/qualification.json
      - name: Capture the immutable first-attempt manifest
        if: always()
        env:
          RUN_ID: scheduled-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          umask 077
          mkdir -p build/security-gate
          node tools/courtside.mjs security-report "$RUN_ID" --attempt 1 > build/security-gate/manifest.json
      - name: Enforce the scheduled assessment gate
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: >
          node tools/security-assessment-gate.mjs
          --manifest build/security-gate/manifest.json
          --profile safe
          --subject "$IMAGE_DIGEST"
          --source-commit "${{ github.sha }}"
          --output build/security-gate/summary.json
      - name: Remove the disposable security target
        if: always()
        env:
          RUN_ID: scheduled-${{ github.run_id }}-${{ github.run_attempt }}
        run: node tools/courtside.mjs security-cleanup "$RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scheduled-security-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/security-gate/manifest.json
            build/security-gate/summary.json
          retention-days: 14
          if-no-files-found: error
