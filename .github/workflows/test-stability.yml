name: test stability

on:
  schedule:
    - cron: '17 2 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  varied-order:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        order: [reversealphabetical, random]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run integration suite in varied order
        env:
          TEST_ORDER: ${{ matrix.order }}
        run: |
          seed="$(date -u +%Y%m%d)"
          echo "Test order: ${TEST_ORDER}; random seed: ${seed}" | tee test-order.txt
          ./mvnw -B test -Dsurefire.runOrder="${TEST_ORDER}" -Dsurefire.runOrder.random.seed="${seed}"
      - name: Upload first-attempt evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: order-${{ matrix.order }}-${{ github.run_id }}
          path: |
            test-order.txt
            target/surefire-reports/*.xml
          if-no-files-found: error
          retention-days: 14

  browser-order:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project_order: [configured, reversed]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Package application
        timeout-minutes: 10
        run: |
          ./mvnw -B package -DskipTests
          cd frontend
          npm ci --ignore-scripts
      - name: Prove browser isolation under varied project order
        timeout-minutes: 27
        working-directory: frontend
        env:
          COURTSIDE_PROJECT_ORDER: ${{ matrix.project_order }}
          COURTSIDE_WEBKIT_AXE: 'true'
          COURTSIDE_WEBKIT_RELIABILITY: 'true'
        run: npm run reliability:webkit -- --order "${COURTSIDE_PROJECT_ORDER}"
      - name: Validate the closed first-attempt result
        id: validate-webkit-record
        if: always()
        working-directory: frontend
        run: |
          result="$(find test-results/webkit-reliability -type f -name '*.json' -print -quit)"
          test -n "${result}"
          npm run reliability:validate -- "${result}"
      - name: Upload first-attempt browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-order-${{ matrix.project_order }}-${{ github.run_id }}
          path: |
            frontend/test-results/visual-journeys
            frontend/test-results/**/trace.zip
            frontend/test-results/**/*.png
            frontend/test-results/**/error-context.md
            frontend/test-results/browser-diagnostics/*.json
            frontend/test-results/browser-gate-outcome.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload redacted WebKit reliability history
        if: ${{ always() && steps.validate-webkit-record.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webkit-reliability-${{ matrix.project_order }}-${{ github.run_id }}
          path: |
            frontend/test-results/webkit-reliability/*.json
            quality/webkit-reliability.schema.json
          if-no-files-found: error
          retention-days: 90

  browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Package application
        run: |
          ./mvnw -B package -DskipTests
          cd frontend
          npm ci --ignore-scripts
      - name: Qualify periodic browser and mobile projects
        working-directory: frontend
        env:
          COURTSIDE_PERIODIC_BROWSERS: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-compatibility.json
        run: >
          npx playwright test
          --reporter=line,json
          --project=firefox-periodic
          --project=iphone-periodic
          --project=android-periodic
      - name: Upload browser compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-compatibility-${{ github.run_id }}
          path: |
            frontend/test-results/browser-compatibility.json
            frontend/test-results/**/trace.zip
            frontend/test-results/**/*.png
            frontend/test-results/browser-diagnostics/*.json
          if-no-files-found: error
          retention-days: 14
