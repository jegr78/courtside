name: mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read

jobs:
  critical-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
          cache-read-only: true
      - name: Mutate critical decisions
        run: ./mvnw -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: target/pit-reports
          if-no-files-found: error
          retention-days: 30
