name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-profile-plan:
    name: test-profile-plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.selection.outputs.docs }}
      backend: ${{ steps.selection.outputs.backend }}
      frontend: ${{ steps.selection.outputs.frontend }}
      tooling: ${{ steps.selection.outputs.tooling }}
      security: ${{ steps.selection.outputs.security }}
      profiles: ${{ steps.selection.outputs.profiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: selection
        name: Select conservative test profiles
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          FORCE_FULL: ${{ vars.COURTSIDE_TEST_PROFILES != '' && vars.COURTSIDE_TEST_PROFILES != 'admitted' }}
        run: |
          CLASSIFIER_EXIT=0
          LABELS="$LABELS_JSON"
          if [[ "$FORCE_FULL" = "true" ]]; then
            LABELS='["ci:full"]'
            echo 'The repository variable forces the complete job set.' >> "$GITHUB_STEP_SUMMARY"
          fi
          PROFILE_ROOT="$RUNNER_TEMP/courtside-profile-base"
          git worktree add --detach "$PROFILE_ROOT" "$BASE_REF" || CLASSIFIER_EXIT=$?
          if [[ "$CLASSIFIER_EXIT" = 0 ]]; then
            node "$PROFILE_ROOT/tools/test-profile-classifier.mjs" \
              --base "$BASE_REF" \
              --head "$HEAD_REF" \
              --labels "$LABELS" \
              --run-id "$RUN_ID" \
              --attempt "$ATTEMPT" \
              --fallback-on-error \
              --output build/test-profile/plan.json \
              --summary build/test-profile/summary.md \
              || CLASSIFIER_EXIT=$?
          fi
          # shellcheck disable=SC2016
          if jq -e \
            --argjson runId "$RUN_ID" \
            --argjson attempt "$ATTEMPT" \
            --argjson classifierExit "$CLASSIFIER_EXIT" \
            --arg base "$BASE_REF" \
            --arg head "$HEAD_REF" \
            'type == "object" and .schemaVersion == 5 and .runId == $runId and
              .attempt == $attempt and .baseCommit == $base and .headCommit == $head and
              (.profiles | type == "array" and length >= 1 and length <= 5 and
                all(. == "docs" or . == "backend" or . == "frontend" or . == "tooling" or . == "full") and
                (unique | length) == length) and
              (.ciJobs | type == "array" and length >= 1 and (unique | length) == length and
                all(. == "docs" or . == "backend" or . == "frontend" or . == "tooling" or . == "security")) and
              (.isFull | type == "boolean") and .isFull == (.profiles == ["full"]) and
              (.plannerOutcome == "passed" or .plannerOutcome == "failed") and
              (.reasons | type == "array" and length >= 1) and
              (if .plannerOutcome == "failed" then .isFull and .profiles == ["full"]
                else $classifierExit == 0 end)' \
            build/test-profile/plan.json > /dev/null 2>&1; then
            PROFILES=$(jq -cer '.profiles' build/test-profile/plan.json)
            JOBS=$(jq -cer '.ciJobs' build/test-profile/plan.json)
          else
            PROFILES='["full"]'
            JOBS='["docs","backend","frontend","tooling","security"]'
            mkdir -p build/test-profile
            {
              echo '# Selected test profiles'
              echo
              echo 'Selected: `full`'
              echo
              echo 'The classifier did not produce a trustworthy plan, so every quality job is required.'
            } > build/test-profile/summary.md
          fi
          cat build/test-profile/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "profiles=$PROFILES" >> "$GITHUB_OUTPUT"
          for job in docs backend frontend tooling security; do
            SELECTED=$(jq -nr --argjson jobs "$JOBS" --arg job "$job" '($jobs | index($job)) != null')
            echo "$job=$SELECTED" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-profile-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-profile
          retention-days: 14
          if-no-files-found: error

  docs:
    needs: test-profile-plan
    if: always() && (github.event_name != 'pull_request' || needs.test-profile-plan.outputs.docs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify documentation
        run: node tools/docs-check.mjs --check

  tooling:
    needs: test-profile-plan
    if: always() && (github.event_name != 'pull_request' || needs.test-profile-plan.outputs.tooling == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: tooling-toolchain
        name: Read locked tooling versions
        run: node tools/node-toolchain.mjs --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.tooling-toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked npm
        env:
          NPM_VERSION: ${{ steps.tooling-toolchain.outputs.npm }}
        run: npm install --global "npm@$NPM_VERSION"
      - name: Verify locked toolchain
        env:
          NODE_VERSION: ${{ steps.tooling-toolchain.outputs.node }}
          NPM_VERSION: ${{ steps.tooling-toolchain.outputs.npm }}
        run: |
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Install locked tool dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify repository tooling
        working-directory: frontend
        run: npm run test:tools

  assessment-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.runtime.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: runtime
        name: Identify assessment-runtime changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p build/security-update
          node tools/security-update-report.mjs --base "$BASE_REF" \
            --output build/security-update/source.md \
            --identity-output build/security-update/identity.json
          REQUIRED=$(node -p "require('./build/security-update/identity.json').comparisonRequired")
          case "$REQUIRED" in
            true|false) ;;
            *) echo "the runtime decision was $REQUIRED, which is neither" >&2; exit 1 ;;
          esac
          echo "changed=$REQUIRED" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: security-runtime-identity-${{ github.run_id }}
          path: build/security-update/source.md
          retention-days: 14
          if-no-files-found: error

  tool-update-comparison:
    needs: assessment-runtime
    if: needs.assessment-runtime.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Prepare the protected-base assessment runtime
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/courtside-security-base" "$BASE_REF"
          "$RUNNER_TEMP/courtside-security-base/mvnw" -B \
            -f "$RUNNER_TEMP/courtside-security-base/pom.xml" \
            com.github.eirslett:frontend-maven-plugin:install-node-and-npm
      - name: Install protected-base assessment dependencies
        working-directory: ${{ runner.temp }}/courtside-security-base/frontend
        run: ./node/node ./node/node_modules/npm/bin/npm-cli.js ci --ignore-scripts
      - name: Install candidate assessment dependencies
        run: >
          ./mvnw -B
          com.github.eirslett:frontend-maven-plugin:install-node-and-npm
          com.github.eirslett:frontend-maven-plugin:npm@npm-ci
      - name: Build and qualify the target both runs assess
        run: |
          frontend/node/node tools/courtside.uat-smoke.mjs --confirm courtside-uat
          echo "TARGET_IMAGE=$(docker image inspect courtside:uat-local --format '{{.Id}}')" \
            >> "$GITHUB_ENV"
      - name: Pull pinned assessment images
        run: |
          # Both sides: the update under comparison can itself be one of these pins.
          set -o pipefail
          { node tools/security-image-inventory.mjs active
            node "$RUNNER_TEMP/courtside-security-base/tools/security-image-inventory.mjs" active
          } | sort -u | xargs -n1 docker pull
      - name: Verify the Schemathesis reason adapter
        run: |
          IMAGE=$(jq -r .image security/openapi-fuzz-policy.json)
          docker run --rm --entrypoint python \
            -e PYTHONPATH=/projection \
            -v "$PWD/security/schemathesis_reason.py:/projection/sitecustomize.py:ro" \
            -v "$PWD/security/schemathesis_reason_integration.py:/projection/integration.py:ro" \
            "$IMAGE" /projection/integration.py
      - name: Run paired active assessments
        env:
          BASE_RUN_ID: compare-base-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE_RUN_ID: compare-head-${{ github.run_id }}-${{ github.run_attempt }}
          COURTSIDE_SECURITY_API_DOCUMENT: ${{ github.workspace }}/src/main/resources/api/openapi.yaml
        run: |
          BASE_ROOT="$RUNNER_TEMP/courtside-security-base"
          QUALIFICATION="$GITHUB_WORKSPACE/build/uat-smoke/qualification.json"
          (
            cd "$BASE_ROOT"
            frontend/node/node tools/courtside.mjs security "$BASE_RUN_ID" "$TARGET_IMAGE"
            frontend/node/node tools/courtside.mjs security-run "$BASE_RUN_ID" active \
              --qualification "$QUALIFICATION" \
              --authorize "authorize-active-$BASE_RUN_ID" || true
          )
          frontend/node/node tools/courtside.mjs security "$CANDIDATE_RUN_ID" "$TARGET_IMAGE"
          frontend/node/node tools/courtside.mjs security-run "$CANDIDATE_RUN_ID" active \
            --qualification "$QUALIFICATION" \
            --authorize "authorize-active-$CANDIDATE_RUN_ID" || true
      - name: Compare immutable run evidence
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          BASE_RUN_ID: compare-base-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE_RUN_ID: compare-head-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p build/security-update
          BASE_ROOT="$RUNNER_TEMP/courtside-security-base"
          COMPARATOR_ROOT="$BASE_ROOT"
          if [[ ! -f "$COMPARATOR_ROOT/tools/security-tool-comparison.mjs" ]] \
              || ! cmp -s "$COMPARATOR_ROOT/tools/security-tool-comparison.mjs" tools/security-tool-comparison.mjs; then
            COMPARATOR_ROOT="$GITHUB_WORKSPACE"
          fi
          "$COMPARATOR_ROOT/frontend/node/node" "$COMPARATOR_ROOT/tools/security-tool-comparison.mjs" \
            --base-root "$BASE_ROOT" \
            --base-manifest "$BASE_ROOT/build/security/$BASE_RUN_ID/assessment/attempt-1/manifest.json" \
            --base-evidence "$BASE_ROOT/build/security/$BASE_RUN_ID/assessment/attempt-1/evidence" \
            --base-ref "$BASE_REF" \
            --base-contract "$BASE_ROOT/security/run-contract.json" \
            --base-catalog "$BASE_ROOT/security/assessment-catalog.json" \
            --candidate-root "$GITHUB_WORKSPACE" \
            --candidate-manifest "build/security/$CANDIDATE_RUN_ID/assessment/attempt-1/manifest.json" \
            --candidate-evidence "build/security/$CANDIDATE_RUN_ID/assessment/attempt-1/evidence" \
            --candidate-ref "$HEAD_REF" \
            --candidate-contract security/run-contract.json \
            --candidate-catalog security/assessment-catalog.json \
            --output build/security-update/runtime.json
      - name: Read what the comparison found
        env:
          BASE_RUN_ID: compare-base-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE_RUN_ID: compare-head-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          BASE_ROOT="$RUNNER_TEMP/courtside-security-base"
          frontend/node/node tools/security-tool-acknowledgement.mjs \
            --comparison build/security-update/runtime.json \
            --acknowledgement security/tool-update-acknowledgement.json \
            --summary build/security-update/summary.md \
            --candidate-evidence "build/security/$CANDIDATE_RUN_ID/assessment/attempt-1/evidence" \
            --base-evidence "$BASE_ROOT/build/security/$BASE_RUN_ID/assessment/attempt-1/evidence"
          cat build/security-update/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Remove comparison environments
        if: always()
        env:
          BASE_RUN_ID: compare-base-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE_RUN_ID: compare-head-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          BASE_ROOT="$RUNNER_TEMP/courtside-security-base"
          BASE_CLEANUP=0
          CANDIDATE_CLEANUP=0
          (
            cd "$BASE_ROOT"
            frontend/node/node tools/courtside.mjs security-cleanup "$BASE_RUN_ID"
          ) || BASE_CLEANUP=$?
          frontend/node/node tools/courtside.mjs security-cleanup "$CANDIDATE_RUN_ID" || CANDIDATE_CLEANUP=$?
          [[ "$BASE_CLEANUP" = 0 && "$CANDIDATE_CLEANUP" = 0 ]]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: security-tool-update-${{ github.run_id }}
          path: |
            build/security-update/runtime.json
            build/security-update/summary.md
          retention-days: 14
          if-no-files-found: error

  backend:
    needs: test-profile-plan
    if: always() && (github.event_name != 'pull_request' || needs.test-profile-plan.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify backend
        run: ./mvnw -B clean verify -Pjava-only
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-test-evidence-${{ github.run_id }}
          path: |
            target/surefire-reports/*.xml
            target/site/jacoco
          if-no-files-found: warn
          retention-days: 14

  frontend:
    needs: test-profile-plan
    if: always() && (github.event_name != 'pull_request' || needs.test-profile-plan.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install frontend toolchain
        run: >
          ./mvnw -B
          com.github.eirslett:frontend-maven-plugin:install-node-and-npm
          com.github.eirslett:frontend-maven-plugin:npm@npm-ci
      - name: Verify frontend
        working-directory: frontend
        run: |
          ./node/node ./node/node_modules/npm/bin/npm-cli.js run lint
          ./node/node ./node/node_modules/npm/bin/npm-cli.js run test:frontend
          ./node/node ./node/node_modules/npm/bin/npm-cli.js run build
          ./node/node ./node/node_modules/npm/bin/npm-cli.js audit --audit-level=high
      - name: Package the E2E application
        run: ./mvnw -B package -DskipTests -Pjava-only
      - name: Run browser journeys
        working-directory: frontend
        run: ./node/node ./node/node_modules/npm/bin/npm-cli.js run test:e2e
      - name: Upload frontend test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-test-evidence-${{ github.run_id }}
          path: |
            frontend/coverage
            frontend/test-results/visual-journeys
            frontend/test-results/browser-security/browser-storage-evidence.json
            frontend/test-results/browser-security/browser-csp-evidence.json
            frontend/test-results/**/trace.zip
            !frontend/test-results/browser-security-*/trace.zip
            frontend/test-results/**/*.png
            frontend/test-results/browser-diagnostics/*.json
            frontend/test-results/browser-gate-outcome.json
          if-no-files-found: warn
          # A tracker issue may not close before seven consecutive green nights, so the
          # diagnostics that opened it have to still be there when somebody looks.
          retention-days: ${{ github.event_name == 'schedule' && 30 || 14 }}

  security:
    needs: test-profile-plan
    if: always() && (github.event_name != 'pull_request' || needs.test-profile-plan.outputs.security == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: false
      - uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef
        with:
          languages: java-kotlin,javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install security toolchain
        run: >
          ./mvnw -B
          com.github.eirslett:frontend-maven-plugin:install-node-and-npm
          com.github.eirslett:frontend-maven-plugin:npm@npm-ci
      - name: Build security candidate
        run: ./mvnw -B clean package -DskipTests -Pjava-only
      - name: Compare security contracts and tool versions
        if: github.event_name == 'pull_request'
        run: >
          frontend/node/node tools/security-update-report.mjs
          --base ${{ github.event.pull_request.base.sha }}
          --output build/security-update.md
      - name: Prepare security evidence
        run: |
          mkdir -p build/security/codeql
          java -Djarmode=tools -jar target/courtside-*.jar extract --layers --launcher --destination build/security/runtime
      - id: trivy-runtime
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: rootfs
          scan-ref: build/security/runtime
          scanners: vuln
          format: json
          output: build/security/trivy-runtime.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
      - id: trivy-source
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: json
          output: build/security/trivy-source.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          skip-dirs: frontend/node_modules,frontend/node,target,build/layers,build/performance,build/restore-layers,build/uat-smoke,build/upgrade-review-layers
      - id: codeql
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef
        with:
          output: build/security/codeql
          upload: always
          upload-database: false
      - name: Enforce security finding policy
        run: >
          frontend/node/node tools/security-findings.mjs
          --trivy build/security/trivy-runtime.json
          --trivy build/security/trivy-source.json
          --codeql build/security/codeql
          --trivy-version "$(trivy --version | awk 'NR == 1 { print $2 }')"
          --exceptions security/exceptions.json
          --assessment-policy not-applicable
          --scope required-build
          --subject ${{ github.sha }}
          --output build/security/summary.json
      - name: Remove raw security reports
        if: always()
        run: rm -rf build/security/trivy-runtime.json build/security/trivy-source.json build/security/codeql build/security/runtime
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-evidence-${{ github.run_id }}
          path: |
            build/security/summary.json
            build/security-update.md
          if-no-files-found: warn
          retention-days: 14

  build:
    if: always()
    needs: [docs, backend, frontend, tooling, security, assessment-runtime, tool-update-comparison, test-profile-plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record nightly verification
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          mkdir -p build/nightly
          jq -n \
            --arg commit "${{ github.sha }}" \
            --argjson runId "${{ github.run_id }}" \
            --argjson attempt "${{ github.run_attempt }}" \
            --arg docs "$DOCS_RESULT" \
            --arg backend "$BACKEND_RESULT" \
            --arg frontend "$FRONTEND_RESULT" \
            --arg tooling "$TOOLING_RESULT" \
            --arg security "$SECURITY_RESULT" \
            '{schemaVersion: 1, commit: $commit, runId: $runId, attempt: $attempt,
              firstAttempt: ($attempt == 1), jobs: {docs: $docs, backend: $backend, frontend: $frontend, tooling: $tooling, security: $security},
              releaseReadiness: (if $attempt == 1 and $docs == "success" and $backend == "success" and $frontend == "success"
                and $tooling == "success" and $security == "success" then "complete" else "incomplete" end)}' \
            > build/nightly/verification.json
          jq -r '"Nightly release readiness: **\(.releaseReadiness)** (`\(.commit)`, attempt \(.attempt))"' \
            build/nightly/verification.json >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce required build results
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          IDENTITY_RESULT: ${{ needs.assessment-runtime.result }}
          COMPARISON_RESULT: ${{ needs.tool-update-comparison.result }}
          PROFILE_PLAN_RESULT: ${{ needs.test-profile-plan.result }}
          PROFILES: ${{ needs.test-profile-plan.outputs.profiles }}
          DOCS_SELECTED: ${{ needs.test-profile-plan.outputs.docs }}
          BACKEND_SELECTED: ${{ needs.test-profile-plan.outputs.backend }}
          FRONTEND_SELECTED: ${{ needs.test-profile-plan.outputs.frontend }}
          TOOLING_SELECTED: ${{ needs.test-profile-plan.outputs.tooling }}
          SECURITY_SELECTED: ${{ needs.test-profile-plan.outputs.security }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$IDENTITY_RESULT" = success || "$IDENTITY_RESULT" = skipped ]]
          [[ "$COMPARISON_RESULT" = success || "$COMPARISON_RESULT" = skipped ]]
          case "$EVENT_NAME" in
            pull_request)
              test "$PROFILE_PLAN_RESULT" = success
              for job in docs backend frontend tooling security; do
                result_variable="${job^^}_RESULT"
                selected_variable="${job^^}_SELECTED"
                result="${!result_variable}"
                selected="${!selected_variable}"
                if [[ "$selected" = true ]]; then
                  test "$result" = success
                else
                  test "$result" = skipped
                fi
              done
              ;;
            push|schedule|workflow_dispatch)
              test "$PROFILE_PLAN_RESULT" = skipped
              test "$DOCS_RESULT" = success
              test "$BACKEND_RESULT" = success
              test "$FRONTEND_RESULT" = success
              test "$TOOLING_RESULT" = success
              test "$SECURITY_RESULT" = success
              ;;
            *) exit 1 ;;
          esac
      - name: Summarize selected build results
        if: always() && github.event_name == 'pull_request'
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DOCS_SELECTED: ${{ needs.test-profile-plan.outputs.docs }}
          BACKEND_SELECTED: ${{ needs.test-profile-plan.outputs.backend }}
          FRONTEND_SELECTED: ${{ needs.test-profile-plan.outputs.frontend }}
          TOOLING_SELECTED: ${{ needs.test-profile-plan.outputs.tooling }}
          SECURITY_SELECTED: ${{ needs.test-profile-plan.outputs.security }}
          PROFILES: ${{ needs.test-profile-plan.outputs.profiles }}
        run: |
          {
            echo '# Required build result'
            echo
            echo "Profiles: \`$(jq -r 'join(" + ")' <<< "$PROFILES")\`"
            echo
            echo '| Job | Result | Reason |'
            echo '| --- | --- | --- |'
            for job in docs backend frontend tooling security; do
              result_variable="${job^^}_RESULT"
              selected_variable="${job^^}_SELECTED"
              result="${!result_variable}"
              selected="${!selected_variable}"
              if [[ "$selected" = true ]]; then
                reason='required by the conservative profile plan'
              else
                reason='not selected by the conservative profile plan'
              fi
              echo "| $job | $result | $reason |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload nightly verification
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nightly-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/nightly/verification.json
          retention-days: 90
          if-no-files-found: error
      - if: github.event_name == 'pull_request' && (needs.test-profile-plan.outputs.backend == 'true' || needs.test-profile-plan.outputs.frontend == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install coverage toolchain
        if: github.event_name == 'pull_request' && (needs.test-profile-plan.outputs.backend == 'true' || needs.test-profile-plan.outputs.frontend == 'true')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
      - if: github.event_name == 'pull_request' && needs.test-profile-plan.outputs.backend == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: backend-test-evidence-${{ github.run_id }}
          path: build/aggregate/backend
      - if: github.event_name == 'pull_request' && needs.test-profile-plan.outputs.frontend == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: frontend-test-evidence-${{ github.run_id }}
          path: build/aggregate/frontend
      - name: Summarize changed coverage
        if: github.event_name == 'pull_request' && (needs.test-profile-plan.outputs.backend == 'true' || needs.test-profile-plan.outputs.frontend == 'true')
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          BACKEND_SELECTED: ${{ needs.test-profile-plan.outputs.backend }}
          FRONTEND_SELECTED: ${{ needs.test-profile-plan.outputs.frontend }}
        run: |
          arguments=(--base "$BASE_REF" --output build/coverage/changed.md)
          if [[ "$BACKEND_SELECTED" = true ]]; then
            arguments+=(--java build/aggregate/backend/site/jacoco/jacoco.xml)
          fi
          if [[ "$FRONTEND_SELECTED" = true ]]; then
            arguments+=(--frontend build/aggregate/frontend/coverage/lcov.info)
          fi
          node tools/coverage-diff.mjs "${arguments[@]}"
      - name: Upload combined test evidence
        if: github.event_name == 'pull_request' && (needs.test-profile-plan.outputs.backend == 'true' || needs.test-profile-plan.outputs.frontend == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: combined-test-evidence-${{ github.run_id }}
          path: build/coverage/changed.md
          if-no-files-found: error
          retention-days: 14
