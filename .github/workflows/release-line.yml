name: release line

on:
  pull_request:
    branches: [main, 'release/*']
  workflow_dispatch:
    inputs:
      head:
        description: The release pull request head to check against this branch, as a full sha
        required: true
        type: string

permissions: {}

jobs:
  release-line:
    name: release line
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request head
        if: github.event_name == 'pull_request'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/$NUMBER/head:refs/remotes/pull/head"

      - name: Check the release line and its forward ports
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head }}
        run: |
          if [ ! -f tools/release-line.mjs ]; then
            echo "::notice::$BASE carries no release line check yet; the pull request that adds it cannot be judged by it"
            exit 0
          fi
          node tools/release-line.mjs pull-request --base "$BASE" --head "$HEAD" --summary "$GITHUB_STEP_SUMMARY"
