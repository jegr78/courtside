name: release plan sync

on:
  issues:
    types: [closed, edited, milestoned, demilestoned, reopened]
  release:
    types: [published, unpublished, edited, deleted]
  push:
    branches: [main]
    paths:
      - .github/workflows/release-plan-sync.yml
      - tools/release-plan-sync.mjs
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plan-sync
  cancel-in-progress: false

jobs:
  relevance:
    if: github.event_name != 'issues' || github.event.action != 'edited' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - if: github.event_name == 'issues'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          EVENT_MILESTONE: ${{ github.event.issue.milestone.number || github.event.changes.milestone.from.number || 0 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" != issues ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            relevant=$(node tools/release-plan-sync.mjs --repository "$GITHUB_REPOSITORY" \
              --issue 826 --relevant-issue "$EVENT_ISSUE" --event-milestone "$EVENT_MILESTONE")
            echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: relevance
    if: needs.relevance.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Synchronize the 0.1.0 release plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-plan-sync.mjs --repository "$GITHUB_REPOSITORY" --issue 826
