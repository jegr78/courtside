name: mail smoke

on:
  schedule:
    - cron: '41 4 * * 4'
  workflow_dispatch:

concurrency:
  group: mail-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure the shipped mail server and deliver through it
        run: node tools/courtside.mail-smoke.mjs
        env:
          COURTSIDE_MAIL_SMOKE_LOGS: build/mail-smoke

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mail-smoke-logs
          path: build/mail-smoke
          retention-days: 14
          if-no-files-found: warn
