name: performance smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: performance-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
      - name: Start disposable performance environment
        run: node tools/courtside.mjs perf --skip-verify --no-credential-output
      - name: Run bounded smoke profile
        run: node tools/courtside.mjs perf-run smoke
      - name: Capture container logs
        if: failure()
        run: |
          mkdir -p build/performance/smoke
          node tools/courtside.mjs perf-logs --no-follow > build/performance/smoke/container-logs.txt 2>&1 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-smoke-${{ github.run_id }}
          path: build/performance/smoke
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable environment
        if: always()
        run: node tools/courtside.mjs perf-reset courtside-perf
