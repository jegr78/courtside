name: CI timing

on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  record:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Read and record completed run evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          mkdir -p build/ci-timing
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}" > build/ci-timing/run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs?per_page=100" \
            --slurp | jq '{jobs: map(.jobs[]) }' > build/ci-timing/jobs.json
          RUN_HEAD=$(jq -er '.head_sha | select(test("^[a-f0-9]{40}$"))' build/ci-timing/run.json)
          HEAD_REPOSITORY=$(jq -er '.head_repository.full_name | select(test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))' build/ci-timing/run.json)
          HEAD_OWNER=${HEAD_REPOSITORY%%/*}
          HEAD_BRANCH=$(jq -er '.head_branch | select(length > 0 and length <= 255)' build/ci-timing/run.json)
          gh api --method GET --paginate "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=all -f "head=${HEAD_OWNER}:${HEAD_BRANCH}" -f per_page=100 \
            --slurp | jq 'add' > build/ci-timing/pulls.json
          node tools/ci-pull-request.mjs \
            --run build/ci-timing/run.json \
            --candidates build/ci-timing/pulls.json \
            --output build/ci-timing/pr.json
          BASE_REF=$(jq -er '.runBaseSha | select(test("^[a-f0-9]{40}$"))' build/ci-timing/pr.json)
          HEAD_REF=$(jq -er '.head.sha | select(test("^[a-f0-9]{40}$"))' build/ci-timing/pr.json)
          test "$HEAD_REF" = "$RUN_HEAD"
          git fetch --no-tags origin "$BASE_REF" "$HEAD_REF"
          git cat-file -e "${BASE_REF}^{commit}"
          git cat-file -e "${HEAD_REF}^{commit}"
          node tools/ci-base-provenance.mjs --base "$BASE_REF" --head "$HEAD_REF"
          PROFILE_PARENT=$(mktemp -d)
          PROFILE_ROOT="$PROFILE_PARENT/base"
          cleanup_profile() {
            git worktree remove --force "$PROFILE_ROOT" 2>/dev/null || true
            rmdir "$PROFILE_PARENT" 2>/dev/null || true
          }
          trap cleanup_profile EXIT
          git worktree add --detach "$PROFILE_ROOT" "$BASE_REF"
          mkdir -p build/ci-timing/profile-plan
          node "$PROFILE_ROOT/tools/test-profile-classifier.mjs" \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --labels '[]' \
            --run-id "$RUN_ID" \
            --attempt "$ATTEMPT" \
            --fallback-on-error \
            --output build/ci-timing/profile-plan/plan.json \
            --summary build/ci-timing/profile-plan/summary.md \
            || test "$(jq -r .plannerOutcome build/ci-timing/profile-plan/plan.json)" = failed
          test -f build/ci-timing/profile-plan/plan.json
          node "$PROFILE_ROOT/tools/ci-timing.mjs" \
            --run build/ci-timing/run.json \
            --jobs build/ci-timing/jobs.json \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$RUN_ID" \
            --expected-attempt "$ATTEMPT" \
            --output build/ci-timing/record.json \
            --summary build/ci-timing/summary.md
          node "$PROFILE_ROOT/tools/test-profile-observation.mjs" \
            --plan build/ci-timing/profile-plan/plan.json \
            --timing build/ci-timing/record.json \
            --output build/ci-timing/profile-observation.json \
            --summary build/ci-timing/profile-summary.md
          cp "$PROFILE_ROOT/ci/ci-timing.schema.json" build/ci-timing/ci-timing.schema.json
          cp "$PROFILE_ROOT/ci/test-profile-plan.schema.json" build/ci-timing/test-profile-plan.schema.json
          cp "$PROFILE_ROOT/ci/test-profile-observation.schema.json" build/ci-timing/test-profile-observation.schema.json
          cat build/ci-timing/summary.md build/ci-timing/profile-summary.md >> "$GITHUB_STEP_SUMMARY"
          rm build/ci-timing/run.json build/ci-timing/jobs.json \
            build/ci-timing/pulls.json build/ci-timing/pr.json \
            build/ci-timing/summary.md build/ci-timing/profile-summary.md \
            build/ci-timing/profile-plan/summary.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-timing-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: build/ci-timing
          retention-days: 90
          if-no-files-found: error
