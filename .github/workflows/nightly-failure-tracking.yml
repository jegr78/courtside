name: nightly failure tracking

on:
  workflow_run:
    workflows:
      - backup restore smoke
      - build
      - mail smoke
      - mutation testing
      - performance smoke
      - security assessment
      - test stability
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: nightly-failure-tracking-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  track:
    if: contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Read immutable first-attempt evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          mkdir -p build/nightly-tracker
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/1" \
            > build/nightly-tracker/run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/1/jobs?per_page=100" \
            --slurp | jq '{jobs: map(.jobs[]) }' > build/nightly-tracker/jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?event=schedule&status=completed&per_page=7" \
            > build/nightly-tracker/recent.json
      - name: Ensure the tracker owns a label of its own
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nightly --force \
            --color B60205 \
            --description "A scheduled run failed; the tracker owns this issue"

      - name: Create or update actionable failures
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >
          node tools/nightly-failure-tracker.mjs
          --repository "$GITHUB_REPOSITORY"
          --workflow-id "$WORKFLOW_ID"
          --assignee "$REPOSITORY_OWNER"
          --blocking-workflow build
          --run build/nightly-tracker/run.json
          --jobs build/nightly-tracker/jobs.json
          --recent build/nightly-tracker/recent.json
