name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      issues: read
      security-events: write
    outputs:
      upgrade-origins: ${{ steps.upgrade-origins.outputs.origins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag that does not sit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "::error::$GITHUB_REF_NAME does not point at a commit on main"; exit 1; }

      # Absence of a report is not evidence of a green night, so the verification is demanded
      # first and the open issues below only complement it.
      - name: Demand a nightly that verified this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?event=schedule&status=success&per_page=100" \
            --slurp | jq -r 'map(.workflow_runs[])[] | select(.run_attempt == 1) |
              select(.head_sha | test("^[a-f0-9]{40}$")) | "\(.id) \(.head_sha)"' > nightly-runs.txt
          verified=""
          while read -r id head; do
            git cat-file -e "${head}^{commit}" 2>/dev/null || continue
            git merge-base --is-ancestor "$head" "$GITHUB_SHA" || continue
            verified="$id"
            break
          done < nightly-runs.txt
          test -n "$verified" \
            || { echo "::error::no green first-attempt nightly verified a commit this tag builds on"; exit 1; }
          gh run download "$verified" --dir nightly-evidence \
            --name "nightly-verification-${verified}-1"
          jq -e '.releaseReadiness == "complete"' \
            nightly-evidence/verification.json > /dev/null \
            || { echo "::error::the nightly that verified this tag did not record a complete run"; exit 1; }
          rm -rf nightly-runs.txt nightly-evidence

      - name: Refuse unresolved nightly failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=bug&per_page=100" \
            --slurp | jq '[map(.[])[] | select(.pull_request == null) |
              select(.title | startswith("[nightly] ")) |
              select(.body | contains("courtside-nightly-fingerprint"))] | length')
          test "$count" = 0 || { echo "::error::$count nightly failure issue(s) remain open"; exit 1; }

      - name: Take the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # v4
        with:
          languages: java-kotlin,javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Stamp the version into the build
        run: >
          ./mvnw -B versions:set
          -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test
        env:
          COURTSIDE_WEBKIT_AXE: 'true'
        run: ./mvnw -B verify

      - name: Extract the layers
        run: >
          java -Djarmode=tools -jar "target/courtside-$VERSION.jar"
          extract --layers --launcher --destination build/layers

      - name: Capture npm audit evidence
        run: |
          mkdir -p build/security/codeql
          frontend/node/node frontend/node/node_modules/npm/bin/npm-cli.js --prefix frontend audit --json \
            > build/security/npm.json || true

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: build/layers
          scanners: vuln
          format: json
          output: build/security/trivy-runtime.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: json
          output: build/security/trivy-source.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          skip-dirs: frontend/node_modules,frontend/node,target,build/layers

      - uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # v4
        with:
          output: build/security/codeql
          upload: never
          upload-database: false

      - name: Enforce release-build security policy
        run: >
          node tools/security-findings.mjs
          --npm build/security/npm.json
          --trivy build/security/trivy-runtime.json
          --trivy build/security/trivy-source.json
          --codeql build/security/codeql
          --npm-version "$(frontend/node/node frontend/node/node_modules/npm/bin/npm-cli.js --version)"
          --trivy-version "$(trivy --version | awk 'NR == 1 { print $2 }')"
          --exceptions security/exceptions.json
          --assessment-policy not-applicable
          --scope release-build
          --subject ${{ github.sha }}
          --output build/security/release-build.json

      - name: Remove raw release-build security reports
        if: always()
        run: rm -rf build/security/npm.json build/security/trivy-runtime.json build/security/trivy-source.json build/security/codeql

      - name: Collect the upgrade notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          breaking=$(git log --no-merges --format='%s%n%b' "$range" \
            | grep -E '^BREAKING CHANGE:|^[a-z]+(\(.+\))?!:' || true)
          if [ -n "$breaking" ]; then
            fence='```'
            printf '## Upgrade notes\n\nThis release changes a published surface — the REST API or an environment variable.\n\n%s\n%s\n%s\n\n' "$fence" "$breaking" "$fence" > build/release-body.md
          else
            code='`'
            printf '## Upgrade notes\n\nNo published surface changed. Raise %sCOURTSIDE_VERSION%s and restart.\n\n' "$code" "$code" > build/release-body.md
          fi

      - name: Resolve supported database upgrade origins
        id: upgrade-origins
        run: |
          origins=$(node tools/courtside.upgrade-smoke.mjs --origins "$GITHUB_REF_NAME")
          echo "origins=$origins" >> "$GITHUB_OUTPUT"
          printf '\n## Supported database upgrade origins\n\n' >> build/release-body.md
          node -e 'for (const origin of JSON.parse(process.argv[1])) console.log("- " + origin)' "$origins" \
            >> build/release-body.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-input
          path: build
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-security-base
          path: build/security/release-build.json
          retention-days: 14
          if-no-files-found: error

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-input
          path: build

      - name: Restore the layer directory an empty artifact drops
        run: mkdir -p build/layers/snapshot-dependencies

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=release-candidate-${{ github.sha }}

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  qualify:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runs-on: ubuntu-latest
          - architecture: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      COURTSIDE_UAT_VERSION: release-candidate-${{ github.sha }}@${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the deployment model
        env:
          COURTSIDE_UAT_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          COURTSIDE_UAT_ADMIN_PASSWORD: compose-validation-only
        run: docker compose -f deploy/compose.uat.yaml config --quiet

      - name: Qualify the image through the reference deployment
        run: node tools/courtside.uat-smoke.mjs --confirm courtside-uat

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          format: json
          output: build/uat-smoke/trivy-${{ matrix.architecture }}.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Enforce candidate-image security policy
        run: >
          node tools/security-findings.mjs
          --trivy build/uat-smoke/trivy-${{ matrix.architecture }}.json
          --trivy-version "$(trivy --version | awk 'NR == 1 { print $2 }')"
          --exceptions security/exceptions.json
          --assessment-policy not-applicable
          --scope release-image-${{ matrix.architecture }}
          --subject ${{ needs.image.outputs.digest }}
          --output build/uat-smoke/security-summary-${{ matrix.architecture }}.json

      - name: Remove raw security report
        if: always()
        run: rm -f build/uat-smoke/trivy-${{ matrix.architecture }}.json

      - name: Capture deployment diagnostics
        if: failure()
        run: docker compose -p courtside-uat -f deploy/compose.uat.yaml logs --no-color > build/uat-smoke/container-logs.txt 2>&1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: image-qualification-${{ matrix.architecture }}
          path: build/uat-smoke
          retention-days: 14
          if-no-files-found: error

  security-record:
    needs: [build, image, qualify, active-security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-security-base
          path: build/security-input

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-qualification-*
          path: build/security-input
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-active-security
          path: build/security-input

      - name: Assemble the release security record
        run: >
          node tools/security-findings.mjs
          --summary build/security-input/release-build.json
          --summary build/security-input/security-summary-amd64.json
          --summary build/security-input/security-summary-arm64.json
          --assessment-gate build/security-input/active-security-summary.json
          --scope release
          --subject ${{ needs.image.outputs.digest }}
          --source-subject ${{ github.sha }}
          --output build/security-record.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-security-record-input
          path: build/security-record.json
          retention-days: 14
          if-no-files-found: error

  active-security:
    needs: [image, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-qualification-amd64
          path: build/uat-smoke
      - name: Start the digest-bound security target
        run: |
          set -o pipefail
          docker pull "$IMAGE"
          node tools/security-image-inventory.mjs active | xargs -n1 docker pull
          node tools/courtside.mjs security "$RUN_ID" "$IMAGE"
      - name: Execute the required active assessment
        run: >
          node tools/courtside.mjs security-run "$RUN_ID" active
          --qualification build/uat-smoke/qualification.json
          --authorize "authorize-active-$RUN_ID"
      - name: Capture the immutable first-attempt manifest
        if: always()
        run: |
          umask 077
          mkdir -p build/security-gate
          node tools/courtside.mjs security-report "$RUN_ID" --attempt 1 > build/security-gate/manifest.json
      - name: Enforce the release assessment gate
        if: always()
        run: >
          node tools/security-assessment-gate.mjs
          --manifest build/security-gate/manifest.json
          --profile active
          --subject "${IMAGE##*@}"
          --source-commit "${{ github.sha }}"
          --output build/security-gate/active-security-summary.json
      - name: Remove the disposable security target
        if: always()
        run: node tools/courtside.mjs security-cleanup "$RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-active-security
          path: |
            build/security-gate/manifest.json
            build/security-gate/active-security-summary.json
          retention-days: 14
          if-no-files-found: error

  upgrade:
    needs: [build, image]
    strategy:
      fail-fast: false
      matrix:
        origin: ${{ fromJSON(needs.build.outputs.upgrade-origins) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      COURTSIDE_UPGRADE_CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
      COURTSIDE_UPGRADE_ORIGIN: ${{ matrix.origin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove the database upgrade path
        run: node tools/courtside.upgrade-smoke.mjs --confirm courtside-upgrade

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: database-upgrade-${{ matrix.origin }}
          path: build/database-upgrade
          retention-days: 14
          if-no-files-found: error

  restore:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      COURTSIDE_RESTORE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove backup and restore
        run: node tools/courtside.restore-smoke.mjs --confirm courtside-restore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: database-restore
          path: |
            build/database-restore
            !build/database-restore/**/*.dump
            !build/database-restore/**/*.sql
            !build/database-restore/**/*.sql.gz
            !build/database-restore/**/*.backup
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [build, image, qualify, security-record, upgrade, restore]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-input
          path: build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-security-record-input
          path: build

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          artifact-name: courtside-${{ github.ref_name }}.spdx.json
          output-file: build/courtside.spdx.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: build/courtside.spdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Verify release supply-chain evidence
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --output json "$IMAGE" > build/signature-verification.json
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --predicate-type https://slsa.dev/provenance/v1 --format json \
            > build/provenance-verification.json
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --predicate-type https://spdx.dev/Document/v2.3 --format json \
            > build/sbom-verification.json
          node tools/security-supply-chain.mjs \
            --record build/security-record.json --image "$IMAGE" --sbom build/courtside.spdx.json \
            --signature-proof build/signature-verification.json \
            --provenance-proof build/provenance-verification.json \
            --sbom-proof build/sbom-verification.json --output build/security-record.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-security-record
          path: build/security-record.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish release tags without rebuilding
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do tag_args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "$IMAGE"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: build/release-body.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src/main/resources/api/openapi.yaml
            build/security-record.json
