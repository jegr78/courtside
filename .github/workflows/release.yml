name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
      image-digest: ${{ steps.verify.outputs.image-digest }}
      booking-seed-digest: ${{ steps.verify.outputs.booking-seed-digest }}
      archive-sha256: ${{ steps.verify.outputs.archive-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag that does not sit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "::error::$GITHUB_REF_NAME does not point at a commit on main"; exit 1; }

      # The tag is the only thing the release asks for its version, so a tag naming a release this
      # commit does not record would publish an image under a version nobody cut.
      - name: Refuse a tag the repository does not record as its release
        run: |
          recorded="$(jq -er '."."' .release-please-manifest.json)" \
            || { echo "::error::this commit records no released version"; exit 1; }
          [ "${GITHUB_REF_NAME#v}" = "$recorded" ] \
            || { echo "::error::$GITHUB_REF_NAME names ${GITHUB_REF_NAME#v}, but this commit records $recorded"; exit 1; }

      - id: find
        name: Find the release candidate that qualified this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          node tools/release-candidate-evidence.mjs --find --commit "$GITHUB_SHA" --mode release
          --download build/candidate --github-output "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deployment-archive
          path: build/archive
          run-id: ${{ steps.find.outputs.run-id }}
          github-token: ${{ github.token }}

      - id: verify
        name: Verify the candidate evidence and its archive
        env:
          RUN_ID: ${{ steps.find.outputs.run-id }}
        run: >
          node tools/release-candidate-evidence.mjs --verify --evidence build/candidate/evidence.json
          --commit "$GITHUB_SHA" --version "${GITHUB_REF_NAME#v}" --run-id "$RUN_ID" --mode release
          --archive "build/archive/courtside-deployment-${GITHUB_REF_NAME#v}.zip" --github-output "$GITHUB_OUTPUT"

  publish:
    needs: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: container-registry-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/tool-dependencies

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-input
          path: build
          run-id: ${{ needs.candidate.outputs.run-id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-security-record-input
          path: build
          run-id: ${{ needs.candidate.outputs.run-id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deployment-archive
          path: build
          run-id: ${{ needs.candidate.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Require the archive the candidate qualified
        env:
          ARCHIVE_SHA256: ${{ needs.candidate.outputs.archive-sha256 }}
        run: echo "$ARCHIVE_SHA256  build/courtside-deployment-${GITHUB_REF_NAME#v}.zip" | sha256sum -c -

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - id: image-sbom
        name: Generate the image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.candidate.outputs.image-digest }}
          artifact-name: courtside-${{ github.ref_name }}.spdx.json
          output-file: build/courtside.spdx.json

      - id: booking-seed-sbom
        name: Generate the booking-seed SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.candidate.outputs.booking-seed-digest }}
          artifact-name: courtside-booking-seed-${{ github.ref_name }}.spdx.json
          output-file: build/courtside-booking-seed.spdx.json

      - id: image-provenance
        name: Attest the image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.candidate.outputs.image-digest }}
          push-to-registry: true

      - id: booking-seed-provenance
        name: Attest the booking-seed provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.candidate.outputs.booking-seed-digest }}
          push-to-registry: true

      - id: image-sbom-attestation
        name: Attest the image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.candidate.outputs.image-digest }}
          sbom-path: build/courtside.spdx.json
          push-to-registry: true

      - id: booking-seed-sbom-attestation
        name: Attest the booking-seed SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.candidate.outputs.booking-seed-digest }}
          sbom-path: build/courtside-booking-seed.spdx.json
          push-to-registry: true

      - id: archive-provenance
        name: Attest the deployment archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/courtside-deployment-*.zip

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: sign
        name: Sign both images
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.candidate.outputs.image-digest }}
          BOOKING_SEED_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.candidate.outputs.booking-seed-digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign sign --yes "$BOOKING_SEED_IMAGE"

      - name: Verify release supply-chain evidence
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.candidate.outputs.image-digest }}
          BOOKING_SEED_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.candidate.outputs.booking-seed-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --output json "$IMAGE" > build/signature-verification.json
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --predicate-type https://slsa.dev/provenance/v1 --format json \
            > build/provenance-verification.json
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --predicate-type https://spdx.dev/Document/v2.3 --format json \
            > build/sbom-verification.json
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --output json "$BOOKING_SEED_IMAGE" > build/booking-seed-signature-verification.json
          gh attestation verify "oci://$BOOKING_SEED_IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --predicate-type https://slsa.dev/provenance/v1 --format json \
            > build/booking-seed-provenance-verification.json
          gh attestation verify "oci://$BOOKING_SEED_IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --predicate-type https://spdx.dev/Document/v2.3 --format json \
            > build/booking-seed-sbom-verification.json
          gh attestation verify "build/courtside-deployment-${GITHUB_REF_NAME#v}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          node tools/security-supply-chain.mjs \
            --record build/security-record.json --image "$IMAGE" --sbom build/courtside.spdx.json \
            --signature-proof build/signature-verification.json \
            --provenance-proof build/provenance-verification.json \
            --sbom-proof build/sbom-verification.json --output build/security-record.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-security-record
          path: build/security-record.json
          retention-days: 14
          if-no-files-found: error

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: build/release-body.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src/main/resources/api/openapi.yaml
            build/security-record.json
            build/courtside-deployment-*

      - name: Publish release tags without rebuilding
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.candidate.outputs.image-digest }}
          BOOKING_SEED_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.candidate.outputs.booking-seed-digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do tag_args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "$IMAGE"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:booking-seed-${GITHUB_REF_NAME#v}" \
            "$BOOKING_SEED_IMAGE"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Explain how to recover a failed publication
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key' <<< "$STEPS" | paste -sd, -)
          echo "::error::publish stopped in ${failed:-a step without an id} before the release was visible." \
            "If a signing or attestation step failed on a network error from the sigstore transparency log" \
            "(rekor.sigstore.dev), wait until it answers again and choose Re-run failed jobs on" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Nothing is rebuilt;" \
            "the candidate's digests are promoted again."

  plan-sync:
    needs: publish
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/release-plan-sync.yml
