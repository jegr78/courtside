name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag that does not sit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "::error::$GITHUB_REF_NAME does not point at a commit on main"; exit 1; }

      - name: Take the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Stamp the version into the build
        run: >
          ./mvnw -B versions:set
          -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test
        run: ./mvnw -B verify

      - name: Extract the layers
        run: >
          java -Djarmode=tools -jar "target/courtside-$VERSION.jar"
          extract --layers --launcher --destination build/layers

      - name: Collect the upgrade notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          breaking=$(git log --no-merges --format='%s%n%b' "$range" \
            | grep -E '^BREAKING CHANGE:|^[a-z]+(\(.+\))?!:' || true)
          if [ -n "$breaking" ]; then
            printf '## Upgrade notes\n\nThis release changes a published surface — the REST API or an environment variable.\n\n```\n%s\n```\n\n' "$breaking" > build/release-body.md
          else
            printf '## Upgrade notes\n\nNo published surface changed. Raise `COURTSIDE_VERSION` and restart.\n\n' > build/release-body.md
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-input
          path: build
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-input
          path: build

      - name: Restore the layer directory an empty artifact drops
        run: mkdir -p build/layers/snapshot-dependencies

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: build/release-body.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: src/main/resources/api/openapi.yaml
