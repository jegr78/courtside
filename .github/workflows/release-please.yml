name: release-please

# docs/security-risks.md records what RELEASE_PLEASE_TOKEN may do and what bounds it.

on:
  push:
    branches: [main, 'release/[0-9]*.[0-9]*']

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

# The action authenticates with the PAT for every call it makes, so the run needs nothing of its own.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A pull request opened with GITHUB_TOKEN starts no checks, so its release could never merge.
      - name: Refuse to open a release pull request without the token that starts its checks
        if: env.RELEASE_PLEASE_TOKEN == ''
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          echo "::error::RELEASE_PLEASE_TOKEN is not set. release-please would open a release" \
            "pull request whose checks never run. Add the fine-grained PAT that" \
            "docs/security-risks.md scopes."
          exit 1

      - name: Refuse a branch that is no release line
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          [[ "$BRANCH" == main || "$BRANCH" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::$BRANCH is neither main nor release/<major>.<minor>"; exit 1; }

      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      # The candidate tags this commit later, and GitHub refuses that once no branch names it.
      - name: Anchor a release commit while it heads its branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          node tools/release-anchor.mjs release-commit --commit "$GITHUB_SHA"

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Validate the release pull request branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          git check-ref-format --branch "$RELEASE_PR_BRANCH"
          case "$RELEASE_PR_BRANCH" in
            release-please--branches--*) ;;
            *) echo "::error::Unexpected release branch: $RELEASE_PR_BRANCH"; exit 1 ;;
          esac

      - name: Check out the trusted normalizer
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          path: trusted-source
          persist-credentials: false

      # Fold Release Please's candidate delta into the cumulative heading before review.
      - name: Check out the release pull request
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          path: release-pr
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve the cumulative release-line changelog
        if: steps.release.outputs.prs_created == 'true'
        run: node trusted-source/tools/prerelease-changelog.mjs --changelog release-pr/CHANGELOG.md

      - name: Commit the normalized changelog
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        working-directory: release-pr
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name "release-please[bot]"
          git config user.email "release-please[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md
          git commit -m "chore: preserve cumulative release-line changelog"
          trap 'git config --local --unset-all credential.helper || true' EXIT
          git config --local credential.helper \
            '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$RELEASE_PLEASE_TOKEN"; }; f'
          git push origin "HEAD:refs/heads/$RELEASE_PR_BRANCH"
