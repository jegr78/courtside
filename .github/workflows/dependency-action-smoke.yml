name: dependency action smoke

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  artifact-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tool-dependencies
      - name: Prepare evidence directory
        run: mkdir -p build/dependency-action-smoke
      - id: smoke-image
        name: Resolve the deployment image
        run: |
          node <<'JS'
          const { readFileSync, appendFileSync } = require("node:fs");
          const yaml = require("./frontend/node_modules/js-yaml");
          const image = yaml.load(readFileSync("deploy/compose.yaml", "utf8")).services.db.image;
          if (!/^postgres:[^\s@]+@sha256:[a-f0-9]{64}$/.test(image)) {
            throw new Error("The deployment database image must be digest-pinned");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `image=${image}\n`);
          JS
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ steps.smoke-image.outputs.image }}
          output-file: build/dependency-action-smoke/image.spdx.json
          upload-artifact: false
      - name: Verify generated SBOM
        run: |
          jq -e '.SPDXID == "SPDXRef-DOCUMENT" and .spdxVersion == "SPDX-2.3" and (.packages | length > 0)' \
            build/dependency-action-smoke/image.spdx.json
          cd build/dependency-action-smoke
          sha256sum image.spdx.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-action-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/dependency-action-smoke/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-action-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/dependency-action-roundtrip
      - name: Verify downloaded evidence
        working-directory: build/dependency-action-roundtrip
        run: sha256sum --check SHA256SUMS
