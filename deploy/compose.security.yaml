services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    pull_policy: never
    environment:
      POSTGRES_DB: courtside_security
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: ${COURTSIDE_SECURITY_SHARED_PASSWORD:?required}
    cpus: 1.0
    mem_limit: 1g
    tmpfs:
      - /var/lib/postgresql/data:size=512m,mode=0700
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside_security"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}

  app:
    image: ${COURTSIDE_SECURITY_IMAGE:?required}
    pull_policy: never
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.0
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: security
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/courtside_security
      SPRING_DATASOURCE_USERNAME: courtside
      SPRING_DATASOURCE_PASSWORD: ${COURTSIDE_SECURITY_SHARED_PASSWORD:?required}
      COURTSIDE_COOKIE_SECURE: "true"
      COURTSIDE_ENVIRONMENT: SECURITY
      COURTSIDE_SECURITY_CONFIRM_DISPOSABLE: "true"
      COURTSIDE_SECURITY_RUN_ID: ${COURTSIDE_SECURITY_RUN_ID:?required}
      COURTSIDE_SECURITY_SEED_FINGERPRINT: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      COURTSIDE_SECURITY_SHARED_PASSWORD: ${COURTSIDE_SECURITY_SHARED_PASSWORD:?required}
      COURTSIDE_BOOTSTRAP_ADMIN_USERNAME: security.bootstrap
      COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD: ${COURTSIDE_SECURITY_SHARED_PASSWORD:?required}
      COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME: Jane Doe
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,mappings
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 60
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}

  callback:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    pull_policy: never
    command: ["caddy", "respond", "--listen", ":8080", "--body", "callback-ok"]
    read_only: true
    tmpfs:
      - /config:size=1m
      - /data:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    cpus: 0.25
    mem_limit: 64m
    networks:
      - backend
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}

  proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    pull_policy: never
    read_only: true
    tmpfs:
      - /config:size=8m
      - /data:size=32m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    cpus: 0.25
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${COURTSIDE_SECURITY_HTTPS_PORT:?required}:443"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--output-document=-", "https://localhost/api/source"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./Caddyfile.security:/etc/caddy/Caddyfile:ro
    networks:
      - frontend
      - exposure
      - scanner-upstream
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}

  scanner-gateway:
    profiles: [assessment]
    image: zaproxy/zap-stable:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
    pull_policy: never
    command: ["python3", "/opt/courtside/security-request-gateway.py"]
    read_only: true
    tmpfs:
      - /tmp:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    environment:
      COURTSIDE_SECURITY_MAX_REQUESTS: ${COURTSIDE_SECURITY_MAX_REQUESTS:?required}
      COURTSIDE_SECURITY_MAX_CONCURRENCY: ${COURTSIDE_SECURITY_MAX_CONCURRENCY:?required}
      COURTSIDE_SECURITY_ALLOWED_METHODS: ${COURTSIDE_SECURITY_ALLOWED_METHODS:-GET,HEAD,POST,OPTIONS}
      COURTSIDE_SECURITY_ALLOWED_PATH_PREFIXES: ${COURTSIDE_SECURITY_ALLOWED_PATH_PREFIXES:-/}
      COURTSIDE_SECURITY_CANARY_ENABLED: ${COURTSIDE_SECURITY_CANARY_ENABLED:-false}
      COURTSIDE_SECURITY_MAX_TARGET_BYTES: ${COURTSIDE_SECURITY_MAX_TARGET_BYTES:-8192}
      COURTSIDE_SECURITY_MAX_GENERATED_BYTES: ${COURTSIDE_SECURITY_MAX_GENERATED_BYTES:-20971520}
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8090), 1).close()"]
      interval: 1s
      timeout: 2s
      retries: 10
    volumes:
      - ../tools/security-request-gateway.py:/opt/courtside/security-request-gateway.py:ro
    networks:
      - scanner-client
      - scanner-upstream
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}

  zap:
    profiles: [assessment]
    image: zaproxy/zap-stable:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
    pull_policy: never
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /home/zap:uid=1000,gid=1000,mode=0700,size=256m
      - /zap/wrk:uid=1000,gid=1000,mode=0700,size=25m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    networks:
      - scanner-client
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}

  schemathesis:
    profiles: [assessment]
    image: schemathesis/schemathesis:4.25.0@sha256:980d159d1211ed2ef1f571aa8c6876955c6699dfd6463b8b5f28e788aa61e25e
    pull_policy: never
    entrypoint: ["tail", "-f", "/dev/null"]
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,size=64m
      - /app/.schemathesis:uid=1000,gid=1000,mode=0700,size=4m
      - /app/.hypothesis:uid=1000,gid=1000,mode=0700,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    environment:
      SCHEMATHESIS_HOOKS: ""
    volumes:
      - ../src/main/resources/api/openapi.yaml:/schema/openapi.yaml:ro
    networks:
      - scanner-client
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}

  k6-abuse:
    profiles: [assessment]
    image: grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6
    pull_policy: never
    entrypoint: ["tail", "-f", "/dev/null"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,uid=12345,gid=12345,mode=0700
      - /results:size=16m,uid=12345,gid=12345,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - ../security/resource-abuse-policy.json:/scripts/policy.json:ro
      - ../security/resource-abuse.js:/scripts/resource-abuse.js:ro
    networks:
      - scanner-client
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}

networks:
  backend:
    internal: true
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}
  frontend:
    internal: true
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}
  exposure:
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}
  scanner-client:
    internal: true
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}
  scanner-upstream:
    internal: true
    labels:
      org.courtside.environment: SECURITY
      org.courtside.security.run-id: ${COURTSIDE_SECURITY_RUN_ID:?required}
      org.courtside.security.seed-fingerprint: ${COURTSIDE_SECURITY_SEED_FINGERPRINT:?required}
      org.courtside.security.instance-fingerprint: ${COURTSIDE_SECURITY_INSTANCE_FINGERPRINT:?required}
