x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    networks:
      ingress: {}

  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: udp://127.0.0.1:${COURTSIDE_OPERATIONAL_LOG_PORT:-1514}
        syslog-format: rfc5424micro
        tag: courtside-proxy
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
      log-collector:
        condition: service_healthy
    environment:
      COURTSIDE_DOMAIN: ${COURTSIDE_DOMAIN:?set COURTSIDE_DOMAIN in .env}
      COURTSIDE_TRUSTED_PROXIES: 127.0.0.1/32 ::1/128
    networks:
      ingress: {}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  ingress:
    internal: true

volumes:
  caddy-data:
  caddy-config:
