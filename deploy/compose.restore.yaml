name: courtside-restore

services:
  mail:
    image: axllent/mailpit:v1.31@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    user: ${COURTSIDE_RESTORE_MAIL_USER}
    command:
      - --smtp-tls-cert
      - /certs/cert.pem
      - --smtp-tls-key
      - /certs/key.pem
      - --smtp-require-starttls
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${COURTSIDE_RESTORE_MAIL_CERT_DIR}:/certs:ro

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: courtside-restore
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ${COURTSIDE_RESTORE_IMAGE}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/courtside
      SPRING_DATASOURCE_USERNAME: courtside
      SPRING_DATASOURCE_PASSWORD: courtside-restore
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      COURTSIDE_COOKIE_SECURE: "false"
      COURTSIDE_ENVIRONMENT: UAT
      COURTSIDE_BOOTSTRAP_ADMIN_USERNAME: admin
      COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD: ${COURTSIDE_RESTORE_ADMIN_PASSWORD}
      COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME: Jane Doe
      COURTSIDE_MAIL_RELAY_HOST: mail
      COURTSIDE_MAIL_RELAY_PORT: "1025"
      COURTSIDE_MAIL_TRUST_RELAY_CERTIFICATE: "true"
      COURTSIDE_MAIL_FROM: no-reply@example.org
      COURTSIDE_MAIL_REPLY_TO: board@example.org
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 3s
      retries: 45

volumes:
  db:
