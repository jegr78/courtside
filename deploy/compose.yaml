name: courtside

x-courtside-compose-version: ">=2.33.1"
x-courtside-production-overlays:
  - compose.database-identities.yaml
  - compose.external-database.yaml
  - compose.caddy.yaml
  - compose.caddy-public.yaml
  - compose.caddy-forwarded.yaml
  - compose.smtp-relay.yaml
  - compose.stalwart.yaml
  - compose.database-tls.yaml
  - compose.database-tls-local.yaml
  - compose.app-tls.yaml
  - compose.external-database-identities.yaml
  - compose.database-identities-custom-image.yaml
  - compose.custom-image.yaml
x-courtside-acceptance-components:
  - compose.mailpit.yaml

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: udp://127.0.0.1:${COURTSIDE_OPERATIONAL_LOG_PORT:-1514}
        syslog-format: rfc5424micro
        tag: courtside-database
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    depends_on:
      log-collector:
        condition: service_healthy
    networks:
      - database
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: ghcr.io/jegr78/courtside@sha256:${COURTSIDE_IMAGE_DIGEST:?set COURTSIDE_IMAGE_DIGEST in .env}
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: udp://127.0.0.1:${COURTSIDE_OPERATIONAL_LOG_PORT:-1514}
        syslog-format: rfc5424micro
        tag: courtside-application
    mem_limit: ${COURTSIDE_MEMORY:-1g}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/courtside
      SPRING_DATASOURCE_USERNAME: courtside
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-}
      COURTSIDE_DB_LOCK_TIMEOUT: ${COURTSIDE_DB_LOCK_TIMEOUT:-5s}
      COURTSIDE_DB_TLS_MODE: ${COURTSIDE_DB_TLS_MODE:-prefer}
      COURTSIDE_COOKIE_SECURE: ${COURTSIDE_COOKIE_SECURE:-true}
      COURTSIDE_SOURCE_URL: ${COURTSIDE_SOURCE_URL:?set COURTSIDE_SOURCE_URL in .env}
      COURTSIDE_ENVIRONMENT: ${COURTSIDE_ENVIRONMENT:-PRODUCTION}
      COURTSIDE_BOOTSTRAP_ADMIN_USERNAME: ${COURTSIDE_BOOTSTRAP_ADMIN_USERNAME:-}
      COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD: ${COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD:-}
      COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      COURTSIDE_LOGIN_ADDRESS_MAX_FAILURES: ${COURTSIDE_LOGIN_ADDRESS_MAX_FAILURES:-20}
      COURTSIDE_LOGIN_ADDRESS_WINDOW: ${COURTSIDE_LOGIN_ADDRESS_WINDOW:-1m}
      COURTSIDE_LOGIN_ADDRESS_BLOCK: ${COURTSIDE_LOGIN_ADDRESS_BLOCK:-1m}
      COURTSIDE_LOGIN_VERIFICATION_CONCURRENCY: ${COURTSIDE_LOGIN_VERIFICATION_CONCURRENCY:-2}
      COURTSIDE_LOGIN_GLOBAL_THRESHOLD: ${COURTSIDE_LOGIN_GLOBAL_THRESHOLD:-100}
      COURTSIDE_LOGIN_GLOBAL_WINDOW: ${COURTSIDE_LOGIN_GLOBAL_WINDOW:-1m}
      COURTSIDE_CREDENTIAL_ISSUE_MAX_PER_WINDOW: ${COURTSIDE_CREDENTIAL_ISSUE_MAX_PER_WINDOW:-5}
      COURTSIDE_CREDENTIAL_ISSUE_WINDOW: ${COURTSIDE_CREDENTIAL_ISSUE_WINDOW:-1h}
      COURTSIDE_CREDENTIAL_ISSUE_RETENTION: ${COURTSIDE_CREDENTIAL_ISSUE_RETENTION:-24h}
      COURTSIDE_PASSWORD_RESET_MAIL_MAX_PER_WINDOW: ${COURTSIDE_PASSWORD_RESET_MAIL_MAX_PER_WINDOW:-5}
      COURTSIDE_PASSWORD_RESET_MAIL_WINDOW: ${COURTSIDE_PASSWORD_RESET_MAIL_WINDOW:-1h}
      COURTSIDE_PASSWORD_RESET_MAIL_RETENTION: ${COURTSIDE_PASSWORD_RESET_MAIL_RETENTION:-24h}
      COURTSIDE_OTLP_ENABLED: ${COURTSIDE_OTLP_ENABLED:-false}
      COURTSIDE_OTLP_TRACES_ENDPOINT: ${COURTSIDE_OTLP_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}
      COURTSIDE_OTLP_METRICS_ENDPOINT: ${COURTSIDE_OTLP_METRICS_ENDPOINT:-http://localhost:4318/v1/metrics}
      COURTSIDE_TRACING_SAMPLING_PROBABILITY: ${COURTSIDE_TRACING_SAMPLING_PROBABILITY:-0.1}
      COURTSIDE_SESSION_CLEANUP_CRON: ${COURTSIDE_SESSION_CLEANUP_CRON:-0 * * * * *}
      COURTSIDE_SESSION_INACTIVITY_TIMEOUT: ${COURTSIDE_SESSION_INACTIVITY_TIMEOUT:-30m}
      COURTSIDE_SESSION_ABSOLUTE_LIFETIME: ${COURTSIDE_SESSION_ABSOLUTE_LIFETIME:-24h}
      COURTSIDE_SESSION_MAX_CONCURRENT: ${COURTSIDE_SESSION_MAX_CONCURRENT:-5}
      COURTSIDE_SESSION_REAUTHENTICATION_WINDOW: ${COURTSIDE_SESSION_REAUTHENTICATION_WINDOW:-5m}
      COURTSIDE_PASSWORD_BREACH_TIMEOUT: ${COURTSIDE_PASSWORD_BREACH_TIMEOUT:-3s}
      COURTSIDE_PASSWORD_BREACH_CACHE_ENTRIES: ${COURTSIDE_PASSWORD_BREACH_CACHE_ENTRIES:-128}
      COURTSIDE_PASSWORD_BREACH_CACHE_LIFETIME: ${COURTSIDE_PASSWORD_BREACH_CACHE_LIFETIME:-24h}
      COURTSIDE_PASSWORD_TERMS_FILE: ${COURTSIDE_PASSWORD_TERMS_FILE:-}
      COURTSIDE_IMPORT_MAX_FILE_SIZE: ${COURTSIDE_IMPORT_MAX_FILE_SIZE:-8MB}
      COURTSIDE_IMPORT_PREVIEW_RETENTION: ${COURTSIDE_IMPORT_PREVIEW_RETENTION:-7d}
      COURTSIDE_IMPORT_SWEEP_INTERVAL: ${COURTSIDE_IMPORT_SWEEP_INTERVAL:-1h}
      COURTSIDE_SLOW_QUERY_THRESHOLD_MS: ${COURTSIDE_SLOW_QUERY_THRESHOLD_MS:-500}
      COURTSIDE_OPERATIONAL_LOG_PATH: /var/lib/courtside/operational-logs
      COURTSIDE_MAIL_RELAY_PORT: ${COURTSIDE_MAIL_RELAY_PORT:-587}
      COURTSIDE_MAIL_TRUST_RELAY_CERTIFICATE: ${COURTSIDE_MAIL_TRUST_RELAY_CERTIFICATE:-false}
      LOGGING_LEVEL_ORG_COURTSIDE: ${COURTSIDE_LOG_LEVEL:-INFO}
    networks:
      app-egress:
        gw_priority: 1
      database: {}
    volumes:
      - operational-logs:/var/lib/courtside/operational-logs:ro

  log-collector:
    image: ghcr.io/jegr78/courtside@sha256:${COURTSIDE_IMAGE_DIGEST:?set COURTSIDE_IMAGE_DIGEST in .env}
    command: ["--collect-operational-logs"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      COURTSIDE_OPERATIONAL_LOG_PATH: /var/lib/courtside/operational-logs
      COURTSIDE_OPERATIONAL_LOG_PORT: ${COURTSIDE_OPERATIONAL_LOG_PORT:-1514}
      COURTSIDE_OPERATIONAL_LOG_FILE_SIZE: ${COURTSIDE_OPERATIONAL_LOG_FILE_SIZE:-2097152}
      COURTSIDE_OPERATIONAL_LOG_FILES: ${COURTSIDE_OPERATIONAL_LOG_FILES:-5}
    ports:
      - 127.0.0.1:${COURTSIDE_OPERATIONAL_LOG_PORT:-1514}:${COURTSIDE_OPERATIONAL_LOG_PORT:-1514}/udp
    networks:
      - log-collection
    volumes:
      - operational-logs:/var/lib/courtside/operational-logs
    healthcheck:
      test: ["CMD-SHELL", "find /var/lib/courtside/operational-logs/collector-status.json -mmin -1 -size +0c -print -quit | grep -q ."]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
networks:
  app-egress:
  database:
    internal: true
  log-collection:

volumes:
  db:
  operational-logs:
