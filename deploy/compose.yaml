name: courtside

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: ghcr.io/jegr78/courtside:${COURTSIDE_VERSION:?set COURTSIDE_VERSION in .env}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${COURTSIDE_MEMORY:-1g}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/courtside
      SPRING_DATASOURCE_USERNAME: courtside
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      COURTSIDE_COOKIE_SECURE: ${COURTSIDE_COOKIE_SECURE:-true}
      COURTSIDE_SOURCE_URL: ${COURTSIDE_SOURCE_URL:-https://github.com/jegr78/courtside}
      COURTSIDE_ENVIRONMENT: ${COURTSIDE_ENVIRONMENT:-PRODUCTION}
      COURTSIDE_BOOTSTRAP_ADMIN_USERNAME: ${COURTSIDE_BOOTSTRAP_ADMIN_USERNAME:-}
      COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD: ${COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD:-}
      COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      COURTSIDE_LOGIN_ADDRESS_MAX_FAILURES: ${COURTSIDE_LOGIN_ADDRESS_MAX_FAILURES:-20}
      COURTSIDE_LOGIN_ADDRESS_WINDOW: ${COURTSIDE_LOGIN_ADDRESS_WINDOW:-1m}
      COURTSIDE_LOGIN_ADDRESS_BLOCK: ${COURTSIDE_LOGIN_ADDRESS_BLOCK:-1m}
      COURTSIDE_LOGIN_GLOBAL_MAX_FAILURES: ${COURTSIDE_LOGIN_GLOBAL_MAX_FAILURES:-100}
      COURTSIDE_LOGIN_GLOBAL_WINDOW: ${COURTSIDE_LOGIN_GLOBAL_WINDOW:-1m}
      COURTSIDE_LOGIN_GLOBAL_BLOCK: ${COURTSIDE_LOGIN_GLOBAL_BLOCK:-1m}
    ports:
      - "127.0.0.1:${COURTSIDE_PORT:-8080}:8080"

  proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles: [proxy]
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    environment:
      COURTSIDE_DOMAIN: ${COURTSIDE_DOMAIN:?set COURTSIDE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db:
  caddy-data:
  caddy-config:
