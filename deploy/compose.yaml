name: courtside

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: ghcr.io/jegr78/courtside:${COURTSIDE_VERSION:?set COURTSIDE_VERSION in .env}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${COURTSIDE_MEMORY:-1g}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/courtside
      SPRING_DATASOURCE_USERNAME: courtside
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      COURTSIDE_DB_LOCK_TIMEOUT: ${COURTSIDE_DB_LOCK_TIMEOUT:-5s}
      COURTSIDE_COOKIE_SECURE: ${COURTSIDE_COOKIE_SECURE:-true}
      COURTSIDE_SOURCE_URL: ${COURTSIDE_SOURCE_URL:-https://github.com/jegr78/courtside}
      COURTSIDE_ENVIRONMENT: ${COURTSIDE_ENVIRONMENT:-PRODUCTION}
      COURTSIDE_BOOTSTRAP_ADMIN_USERNAME: ${COURTSIDE_BOOTSTRAP_ADMIN_USERNAME:-}
      COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD: ${COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD:-}
      COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      COURTSIDE_LOGIN_ADDRESS_MAX_FAILURES: ${COURTSIDE_LOGIN_ADDRESS_MAX_FAILURES:-20}
      COURTSIDE_LOGIN_ADDRESS_WINDOW: ${COURTSIDE_LOGIN_ADDRESS_WINDOW:-1m}
      COURTSIDE_LOGIN_ADDRESS_BLOCK: ${COURTSIDE_LOGIN_ADDRESS_BLOCK:-1m}
      COURTSIDE_LOGIN_GLOBAL_MAX_FAILURES: ${COURTSIDE_LOGIN_GLOBAL_MAX_FAILURES:-100}
      COURTSIDE_LOGIN_GLOBAL_WINDOW: ${COURTSIDE_LOGIN_GLOBAL_WINDOW:-1m}
      COURTSIDE_LOGIN_GLOBAL_BLOCK: ${COURTSIDE_LOGIN_GLOBAL_BLOCK:-1m}
      COURTSIDE_CREDENTIAL_ISSUE_MAX_PER_WINDOW: ${COURTSIDE_CREDENTIAL_ISSUE_MAX_PER_WINDOW:-5}
      COURTSIDE_CREDENTIAL_ISSUE_WINDOW: ${COURTSIDE_CREDENTIAL_ISSUE_WINDOW:-1h}
      COURTSIDE_CREDENTIAL_ISSUE_RETENTION: ${COURTSIDE_CREDENTIAL_ISSUE_RETENTION:-24h}
      COURTSIDE_OTLP_ENABLED: ${COURTSIDE_OTLP_ENABLED:-false}
      COURTSIDE_OTLP_TRACES_ENDPOINT: ${COURTSIDE_OTLP_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}
      COURTSIDE_OTLP_METRICS_ENDPOINT: ${COURTSIDE_OTLP_METRICS_ENDPOINT:-http://localhost:4318/v1/metrics}
      COURTSIDE_TRACING_SAMPLING_PROBABILITY: ${COURTSIDE_TRACING_SAMPLING_PROBABILITY:-0.1}
      COURTSIDE_SESSION_CLEANUP_CRON: ${COURTSIDE_SESSION_CLEANUP_CRON:-0 * * * * *}
      COURTSIDE_IMPORT_MAX_FILE_SIZE: ${COURTSIDE_IMPORT_MAX_FILE_SIZE:-8MB}
      COURTSIDE_IMPORT_PREVIEW_RETENTION: ${COURTSIDE_IMPORT_PREVIEW_RETENTION:-7d}
      COURTSIDE_IMPORT_SWEEP_INTERVAL: ${COURTSIDE_IMPORT_SWEEP_INTERVAL:-1h}
      COURTSIDE_SLOW_QUERY_THRESHOLD_MS: ${COURTSIDE_SLOW_QUERY_THRESHOLD_MS:-500}
      COURTSIDE_MAIL_RELAY_HOST: ${COURTSIDE_MAIL_RELAY_HOST:-mail}
      COURTSIDE_MAIL_RELAY_PORT: ${COURTSIDE_MAIL_RELAY_PORT:-587}
      COURTSIDE_MAIL_FROM: ${COURTSIDE_MAIL_SENDER_USERNAME:-courtside}@${COURTSIDE_MAIL_DOMAIN:?set COURTSIDE_MAIL_DOMAIN in .env}
      COURTSIDE_MAIL_REPLY_TO: ${COURTSIDE_MAIL_REPLY_TO:?set COURTSIDE_MAIL_REPLY_TO in .env}
      COURTSIDE_MAIL_USERNAME: ${COURTSIDE_MAIL_SENDER_USERNAME:-courtside}@${COURTSIDE_MAIL_DOMAIN}
      COURTSIDE_MAIL_PASSWORD: ${COURTSIDE_MAIL_PASSWORD:?set COURTSIDE_MAIL_PASSWORD in .env}
      # Caddy issues for COURTSIDE_DOMAIN and not for the mail server, so the submission listener on
      # this private network presents a self-signed certificate. Clear it when the relay is foreign.
      COURTSIDE_MAIL_TRUST_RELAY_CERTIFICATE: ${COURTSIDE_MAIL_TRUST_RELAY_CERTIFICATE:-true}
      LOGGING_LEVEL_ORG_COURTSIDE: ${COURTSIDE_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${COURTSIDE_PORT:-8080}:8080"

  mail:
    image: stalwartlabs/stalwart:v0.16.20@sha256:74ca4f7f6885fe302f38a99381f36a208547afce1033d8734d9e6d8d3eba7446
    profiles: [mail]
    restart: unless-stopped
    logging: *logging
    mem_limit: ${COURTSIDE_MAIL_MEMORY:-512m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      STALWART_RECOVERY_ADMIN: ${COURTSIDE_MAIL_RECOVERY_ADMIN:-}
      STALWART_RECOVERY_MODE: ${COURTSIDE_MAIL_RECOVERY_MODE:-}
    volumes:
      - mail-config:/etc/stalwart
      - mail-data:/var/lib/stalwart
    ports:
      - "25:25"
      - "127.0.0.1:${COURTSIDE_MAIL_ADMIN_PORT:-8081}:8080"

  mail-plan:
    image: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    profiles: [mail-setup]
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      COURTSIDE_MAIL_HOSTNAME: ${COURTSIDE_MAIL_HOSTNAME:?set COURTSIDE_MAIL_HOSTNAME in .env}
      COURTSIDE_MAIL_DOMAIN: ${COURTSIDE_MAIL_DOMAIN:?set COURTSIDE_MAIL_DOMAIN in .env}
      COURTSIDE_MAIL_ADMIN_USERNAME: ${COURTSIDE_MAIL_ADMIN_USERNAME:-postmaster}
      COURTSIDE_MAIL_ADMIN_PASSWORD: ${COURTSIDE_MAIL_ADMIN_PASSWORD:?set COURTSIDE_MAIL_ADMIN_PASSWORD in .env}
      COURTSIDE_MAIL_SENDER_USERNAME: ${COURTSIDE_MAIL_SENDER_USERNAME:-courtside}
      COURTSIDE_MAIL_PASSWORD: ${COURTSIDE_MAIL_PASSWORD:?set COURTSIDE_MAIL_PASSWORD in .env}
    volumes:
      - ./mail:/mail:ro
      - mail-plan:/plan
    entrypoint: ["sh", "/mail/render.sh", "bootstrap", "base"]

  mail-bootstrap:
    image: stalwartlabs/cli:1.0.12@sha256:fe199affac1d120a8c200ef39ae629765a2976270e0453575c1caf906ee15b52
    profiles: [mail-setup]
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mail-plan:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
      STALWART_URL: http://mail:8080
      STALWART_USER: admin
      STALWART_PASSWORD: ${COURTSIDE_MAIL_SETUP_PASSWORD:?set COURTSIDE_MAIL_SETUP_PASSWORD in .env}
    volumes:
      - mail-plan:/plan:ro
    command: ["apply", "--file", "/plan/bootstrap.ndjson"]

  mail-configure:
    image: stalwartlabs/cli:1.0.12@sha256:fe199affac1d120a8c200ef39ae629765a2976270e0453575c1caf906ee15b52
    profiles: [mail-setup]
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mail-plan:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
      STALWART_URL: http://mail:8080
      STALWART_USER: admin
      STALWART_PASSWORD: ${COURTSIDE_MAIL_SETUP_PASSWORD:?set COURTSIDE_MAIL_SETUP_PASSWORD in .env}
    volumes:
      - mail-plan:/plan:ro
    command: ["apply", "--file", "/plan/base.ndjson"]

  mail-check:
    image: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    profiles: [mail-check]
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      COURTSIDE_MAIL_DOMAIN: ${COURTSIDE_MAIL_DOMAIN:?set COURTSIDE_MAIL_DOMAIN in .env}
      COURTSIDE_MAIL_HOSTNAME: ${COURTSIDE_MAIL_HOSTNAME:?set COURTSIDE_MAIL_HOSTNAME in .env}
      COURTSIDE_MAIL_DKIM_SELECTOR: ${COURTSIDE_MAIL_DKIM_SELECTOR:?set COURTSIDE_MAIL_DKIM_SELECTOR in .env}
      COURTSIDE_MAIL_OUTBOUND_PROBE: ${COURTSIDE_MAIL_OUTBOUND_PROBE:-gmail-smtp-in.l.google.com}
      COURTSIDE_MAIL_RELAY_PROBE: ${COURTSIDE_MAIL_RELAY_PROBE:-relay-probe.example.com}
      COURTSIDE_MAIL_RELAY_TARGET: ${COURTSIDE_MAIL_RELAY_TARGET:-mail}
    volumes:
      - ./mail-check.sh:/mail-check.sh:ro
    entrypoint: ["sh", "/mail-check.sh"]

  proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles: [proxy]
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    environment:
      COURTSIDE_DOMAIN: ${COURTSIDE_DOMAIN:?set COURTSIDE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db:
  mail-config:
  mail-data:
  mail-plan:
  caddy-data:
  caddy-config:
