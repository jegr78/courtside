services:
  app:
    environment:
      COURTSIDE_PERF_TELEMETRY_ENABLED: "true"
    networks:
      - telemetry

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATA_SOURCE_NAME: postgresql://courtside:${COURTSIDE_PERF_SHARED_PASSWORD:-}@db:5432/courtside_perf?sslmode=disable
    command:
      - --extend.query-path=/etc/postgres_exporter/queries.yaml
    volumes:
      - ./postgres-exporter.perf.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - telemetry

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.perf.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
    networks:
      - telemetry

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/courtside.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/courtside.yaml:ro
      - ./grafana/performance-dashboard.json:/var/lib/grafana/dashboards/courtside-performance.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - telemetry

volumes:
  prometheus-data:
  grafana-data:

networks:
  telemetry:
