name: courtside-database-upgrade

services:
  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U courtside -d courtside"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db:
    name: ${COURTSIDE_DATABASE_VOLUME:?set COURTSIDE_DATABASE_VOLUME}
