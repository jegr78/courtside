name: courtside-database-upgrade

services:
  db:
    image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U courtside -d courtside"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db:
    name: ${COURTSIDE_DATABASE_VOLUME:?set COURTSIDE_DATABASE_VOLUME}
