name: courtside-database-upgrade

services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U courtside -d courtside"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db:
    name: ${COURTSIDE_DATABASE_VOLUME:?set COURTSIDE_DATABASE_VOLUME}
