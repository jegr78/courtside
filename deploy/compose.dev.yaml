name: courtside-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: courtside_dev
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: courtside-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db:
