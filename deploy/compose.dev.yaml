name: courtside-dev

services:
  db:
    image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    restart: unless-stopped
    environment:
      POSTGRES_DB: courtside_dev
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: courtside-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U courtside -d courtside_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

  api-ui:
    image: swaggerapi/swagger-ui:v5.36.0@sha256:a6c9dae9b7bf7aa691ad8cf76574d0a9c3c8ce6e0d3946d6bb55acc36f24c4e5
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BASE_URL: /api-ui
      SWAGGER_JSON_URL: /api/openapi.yaml
    networks:
      - frontend

  api-proxy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on:
      - api-ui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks:
      - frontend

volumes:
  db:

networks:
  backend:
  frontend:
