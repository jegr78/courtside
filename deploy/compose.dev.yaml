name: courtside-dev

services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: courtside_dev
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: courtside-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

  api-ui:
    image: swaggerapi/swagger-ui:v5.33.0@sha256:f9b8432be04e320406157e26c3ff52a7e9a4bea7eabe5477e9636791737eb119
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BASE_URL: /api-ui
      SWAGGER_JSON_URL: /api/openapi.yaml
    networks:
      - frontend

  api-proxy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    depends_on:
      - api-ui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks:
      - frontend

volumes:
  db:

networks:
  backend:
  frontend:
