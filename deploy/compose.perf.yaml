name: courtside-perf

services:
  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: courtside_perf
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: ${COURTSIDE_PERF_SHARED_PASSWORD:-}
    cpus: 2.0
    mem_limit: 2g
    volumes:
      - db:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U courtside -d courtside_perf"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A booking hands its message over on an executor that makes the caller wait once the queue fills.
  mail:
    image: axllent/mailpit:v1.32@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    user: ${COURTSIDE_PERF_MAIL_USER:?run node tools/courtside.mjs perf}
    command:
      - --smtp-tls-cert
      - /certs/cert.pem
      - --smtp-tls-key
      - /certs/key.pem
      - --smtp-require-starttls
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - ${COURTSIDE_PERF_MAIL_CERT_DIR:?run node tools/courtside.mjs perf}:/certs:ro
    networks:
      - backend

  app:
    image: courtside:perf-local
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 3.0
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
    environment:
      COURTSIDE_MFA_KEY_ROOT: /var/lib/courtside/mfa-keys
      SPRING_PROFILES_ACTIVE: perf
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/courtside_perf
      SPRING_DATASOURCE_USERNAME: courtside
      SPRING_DATASOURCE_PASSWORD: ${COURTSIDE_PERF_SHARED_PASSWORD:-}
      COURTSIDE_COOKIE_SECURE: "true"
      COURTSIDE_ENVIRONMENT: PERFORMANCE
      COURTSIDE_PERF_CONFIRM_DISPOSABLE: "true"
      COURTSIDE_PERF_SHARED_PASSWORD: ${COURTSIDE_PERF_SHARED_PASSWORD:-}
      COURTSIDE_LOGIN_VERIFICATION_CONCURRENCY: ${COURTSIDE_LOGIN_VERIFICATION_CONCURRENCY:-2}
      COURTSIDE_BOOTSTRAP_ADMIN_USERNAME: admin
      COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD: ${COURTSIDE_PERF_SHARED_PASSWORD:-}
      COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME: Jane Doe
      COURTSIDE_MAIL_RELAY_HOST: mail
      COURTSIDE_MAIL_RELAY_PORT: "1025"
      COURTSIDE_MAIL_TRUST_RELAY_CERTIFICATE: "true"
      COURTSIDE_MAIL_FROM: no-reply@example.org
      COURTSIDE_MAIL_REPLY_TO: board@example.org
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 120

    volumes:
      - mfa-keys:/var/lib/courtside/mfa-keys

  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:9080:80"
      - "127.0.0.1:9443:443"
    volumes:
      - ./Caddyfile.perf:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
      - load

volumes:
  mfa-keys:
  db:
  caddy-data:
  caddy-config:

networks:
  backend:
  frontend:
  load:
