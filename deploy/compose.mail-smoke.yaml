name: courtside-mail-smoke

services:
  mail:
    image: stalwartlabs/stalwart:v0.16.21@sha256:93c574e52249c1ebf90061da2c4c0756a7b72abfcc1fec34506a03c2e38b5977
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      STALWART_RECOVERY_ADMIN: ${COURTSIDE_MAIL_RECOVERY_ADMIN:-}
    networks:
      default: {}
      relay:
        aliases:
          # As in `compose.yaml`: the name on the certificate this server serves, on its own network.
          - ${COURTSIDE_MAIL_HOSTNAME:?set COURTSIDE_MAIL_HOSTNAME in .env}
    volumes:
      - mail-config:/etc/stalwart
      - mail-data:/var/lib/stalwart
      - mail-tls:/etc/stalwart/tls:ro
    ports:
      # 25 is published for the same reason the deployment publishes it, and so that the smoke can
      # offer this server somebody else's mail on it and watch it refuse.
      - "127.0.0.1::25"
      - "127.0.0.1::587"
      - "127.0.0.1::8080"

  proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    security_opt:
      - no-new-privileges:true
    environment:
      COURTSIDE_DOMAIN: ${COURTSIDE_MAIL_DOMAIN}
      COURTSIDE_MAIL_HOSTNAME: ${COURTSIDE_MAIL_HOSTNAME}
    volumes:
      - ./Caddyfile.mail-smoke:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  mail-certificate:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    user: "0:2000"
    environment:
      COURTSIDE_MAIL_HOSTNAME: ${COURTSIDE_MAIL_HOSTNAME}
    volumes:
      - ./mail-certificate.sh:/mail-certificate.sh:ro
      - caddy-data:/caddy:ro
      - mail-tls:/tls
    entrypoint: ["sh", "/mail-certificate.sh"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^ok' /tmp/health"]
      interval: 5s
      timeout: 5s
      retries: 2

  mail-reload:
    image: node:26-alpine@sha256:2d984a15c9b54fd0aeb608b8e0d0d83529eb34d2966db27a1fb4f1edc3d298a3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    user: "1500:1500"
    environment:
      COURTSIDE_MAIL_HOSTNAME: ${COURTSIDE_MAIL_HOSTNAME}
      COURTSIDE_MAIL_DOMAIN: ${COURTSIDE_MAIL_DOMAIN}
      COURTSIDE_MAIL_RELOAD_USERNAME: ${COURTSIDE_MAIL_RELOAD_USERNAME:-certificate-reload}
      COURTSIDE_MAIL_RELOAD_PASSWORD: ${COURTSIDE_MAIL_RELOAD_PASSWORD}
      COURTSIDE_MAIL_CERTIFICATE_REMAINING_SHARE: ${COURTSIDE_MAIL_CERTIFICATE_REMAINING_SHARE:-6}
      COURTSIDE_MAIL_CERTIFICATE_MAXIMUM_LIFETIME: ${COURTSIDE_MAIL_CERTIFICATE_MAXIMUM_LIFETIME:-34560000}
      COURTSIDE_MAIL_RELOAD_CA_FILE: /trust/ca.crt
    volumes:
      - ./mail-certificate-peer.mjs:/mail-certificate-peer.mjs:ro
      - ./mail-reload.sh:/mail-reload.sh:ro
      - mail-tls:/tls:ro
      - ${COURTSIDE_MAIL_RELOAD_CA_SOURCE}:/trust/ca.crt:ro
    entrypoint: ["sh", "/mail-reload.sh"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^ok' /tmp/health"]
      interval: 5s
      timeout: 5s
      retries: 2

  sink:
    image: axllent/mailpit:v1.31@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1::8025"

  plan:
    image: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      COURTSIDE_MAIL_HOSTNAME: ${COURTSIDE_MAIL_HOSTNAME}
      COURTSIDE_MAIL_DOMAIN: ${COURTSIDE_MAIL_DOMAIN}
      COURTSIDE_MAIL_ADMIN_PASSWORD: ${COURTSIDE_MAIL_ADMIN_PASSWORD}
      COURTSIDE_MAIL_PASSWORD: ${COURTSIDE_MAIL_PASSWORD}
      COURTSIDE_MAIL_RELOAD_USERNAME: ${COURTSIDE_MAIL_RELOAD_USERNAME:-certificate-reload}
      COURTSIDE_MAIL_RELOAD_PASSWORD: ${COURTSIDE_MAIL_RELOAD_PASSWORD}
      COURTSIDE_MAIL_SINK: sink
    volumes:
      - ./mail:/mail:ro
      - plan:/plan
    entrypoint: ["sh", "/mail/render.sh", "bootstrap", "base", "journey"]

  apply:
    image: stalwartlabs/cli:1.0.12@sha256:fe199affac1d120a8c200ef39ae629765a2976270e0453575c1caf906ee15b52
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
      STALWART_URL: http://mail:8080
      STALWART_USER: admin
      STALWART_PASSWORD: ${COURTSIDE_MAIL_SETUP_PASSWORD}
    volumes:
      - plan:/plan:ro

networks:
  default:
  relay:

volumes:
  mail-config:
  mail-data:
  mail-tls:
  caddy-data:
  caddy-config:
  plan:
