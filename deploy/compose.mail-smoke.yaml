name: courtside-mail-smoke

services:
  mail:
    image: stalwartlabs/stalwart:v0.16.25@sha256:74e5a7d55303ba525d939c6bf97ed4e010df7521f52d80afc22a815b66bd53f3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      STALWART_RECOVERY_ADMIN: ${COURTSIDE_MAIL_RECOVERY_ADMIN:-}
    networks:
      default: {}
      relay:
        aliases:
          # As in `compose.stalwart.yaml`: the name on the certificate this server serves, on its own network.
          - ${COURTSIDE_MAIL_HOSTNAME:?set COURTSIDE_MAIL_HOSTNAME in .env}
    volumes:
      - mail-config:/etc/stalwart
      - mail-data:/var/lib/stalwart
      - mail-tls:/etc/stalwart/tls:ro
    ports:
      # 25 is published for the same reason the deployment publishes it, and so that the smoke can
      # offer this server somebody else's mail on it and watch it refuse.
      - "127.0.0.1::25"
      - "127.0.0.1::587"
      - "127.0.0.1::8080"

  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    security_opt:
      - no-new-privileges:true
    environment:
      COURTSIDE_DOMAIN: ${COURTSIDE_MAIL_DOMAIN}
      COURTSIDE_MAIL_HOSTNAME: ${COURTSIDE_MAIL_HOSTNAME}
    volumes:
      - ./Caddyfile.mail-smoke:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  mail-certificate:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    user: "0:2000"
    environment:
      COURTSIDE_MAIL_HOSTNAME: ${COURTSIDE_MAIL_HOSTNAME}
    volumes:
      - ./mail-certificate.sh:/mail-certificate.sh:ro
      - caddy-data:/caddy:ro
      - mail-tls:/tls
    entrypoint: ["sh", "/mail-certificate.sh"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^ok' /tmp/health"]
      interval: 5s
      timeout: 5s
      retries: 2

  mail-reload:
    image: node:26-alpine@sha256:0b36e8c136b94cd4fcf02188228e76c31ad5872eef3fec8cbd2eee500cfd9e80
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    user: "1500:1500"
    environment:
      COURTSIDE_MAIL_HOSTNAME: ${COURTSIDE_MAIL_HOSTNAME}
      COURTSIDE_MAIL_DOMAIN: ${COURTSIDE_MAIL_DOMAIN}
      COURTSIDE_MAIL_RELOAD_USERNAME: ${COURTSIDE_MAIL_RELOAD_USERNAME:-certificate-reload}
      COURTSIDE_MAIL_RELOAD_PASSWORD: ${COURTSIDE_MAIL_RELOAD_PASSWORD}
      COURTSIDE_MAIL_CERTIFICATE_REMAINING_SHARE: ${COURTSIDE_MAIL_CERTIFICATE_REMAINING_SHARE:-6}
      COURTSIDE_MAIL_CERTIFICATE_MAXIMUM_LIFETIME: ${COURTSIDE_MAIL_CERTIFICATE_MAXIMUM_LIFETIME:-34560000}
      COURTSIDE_MAIL_RELOAD_CA_FILE: /trust/ca.crt
    volumes:
      - ./mail-certificate-peer.mjs:/mail-certificate-peer.mjs:ro
      - ./mail-reload.sh:/mail-reload.sh:ro
      - mail-tls:/tls:ro
      - ${COURTSIDE_MAIL_RELOAD_CA_SOURCE}:/trust/ca.crt:ro
    entrypoint: ["sh", "/mail-reload.sh"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^ok' /tmp/health"]
      interval: 5s
      timeout: 5s
      retries: 2

  sink:
    image: axllent/mailpit:v1.31@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1::8025"

  plan:
    image: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      COURTSIDE_MAIL_HOSTNAME: ${COURTSIDE_MAIL_HOSTNAME}
      COURTSIDE_MAIL_DOMAIN: ${COURTSIDE_MAIL_DOMAIN}
      COURTSIDE_MAIL_ADMIN_PASSWORD: ${COURTSIDE_MAIL_ADMIN_PASSWORD}
      COURTSIDE_MAIL_PASSWORD: ${COURTSIDE_MAIL_PASSWORD}
      COURTSIDE_MAIL_RELOAD_USERNAME: ${COURTSIDE_MAIL_RELOAD_USERNAME:-certificate-reload}
      COURTSIDE_MAIL_RELOAD_PASSWORD: ${COURTSIDE_MAIL_RELOAD_PASSWORD}
      COURTSIDE_MAIL_SINK: sink
    volumes:
      - ./mail:/mail:ro
      - plan:/plan
    entrypoint: ["sh", "/mail/render.sh", "bootstrap", "base", "journey"]

  apply:
    image: stalwartlabs/cli:1.0.13@sha256:9a1e07307d6f890a193322c4b737fc0868405f0f8486a19922cbf362f43884fd
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
      STALWART_URL: http://mail:8080
      STALWART_USER: admin
      STALWART_PASSWORD: ${COURTSIDE_MAIL_SETUP_PASSWORD}
    volumes:
      - plan:/plan:ro

networks:
  default:
  relay:

volumes:
  mail-config:
  mail-data:
  mail-tls:
  caddy-data:
  caddy-config:
  plan:
