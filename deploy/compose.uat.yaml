name: courtside-uat

services:
  db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: courtside-uat
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${COURTSIDE_UAT_IMAGE:-courtside:uat-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/courtside
      SPRING_DATASOURCE_USERNAME: courtside
      SPRING_DATASOURCE_PASSWORD: courtside-uat
      COURTSIDE_COOKIE_SECURE: "true"
      COURTSIDE_ENVIRONMENT: UAT
      COURTSIDE_BOOTSTRAP_ADMIN_USERNAME: admin
      COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD: ${COURTSIDE_UAT_ADMIN_PASSWORD:-}
      COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME: Jane Doe
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  api-ui:
    image: swaggerapi/swagger-ui:v5.32.11@sha256:e43eb34b978af58d8cb78e5da9c12d605cf43d113ad3a96b18f9b028d6479d68
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BASE_URL: /api-ui
      SWAGGER_JSON_URL: /api/openapi.yaml
    networks:
      - frontend

  proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      api-ui:
        condition: service_started
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8083:8083"
    volumes:
      - ./Caddyfile.uat:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend

volumes:
  db:
  caddy-data:
  caddy-config:

networks:
  backend:
  frontend:
