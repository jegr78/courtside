name: courtside-upgrade

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: courtside-upgrade
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ${COURTSIDE_UPGRADE_IMAGE}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/courtside
      SPRING_DATASOURCE_USERNAME: courtside
      SPRING_DATASOURCE_PASSWORD: courtside-upgrade
      SPRING_FLYWAY_TARGET: ${COURTSIDE_UPGRADE_FLYWAY_TARGET:-latest}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${COURTSIDE_UPGRADE_DDL_MODE:-validate}
      COURTSIDE_COOKIE_SECURE: "false"
      COURTSIDE_ENVIRONMENT: UAT
      COURTSIDE_BOOTSTRAP_ADMIN_USERNAME: admin
      COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD: ${COURTSIDE_UPGRADE_ADMIN_PASSWORD}
      COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME: Jane Doe
      COURTSIDE_MAIL_RELAY_HOST: mail.invalid
      COURTSIDE_MAIL_FROM: no-reply@example.org
      COURTSIDE_MAIL_REPLY_TO: board@example.org
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 3s
      retries: 45

volumes:
  db:
