spring:
  application:
    name: courtside
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: de
    locale-resolver: accept-header
  mvc:
    problemdetails:
      enabled: true

server:
  forward-headers-strategy: framework
  error:
    include-message: never
  servlet:
    session:
      cookie:
        secure: ${COURTSIDE_COOKIE_SECURE:true}

courtside:
  source-url: ${COURTSIDE_SOURCE_URL:@project.url@}
  environment: ${COURTSIDE_ENVIRONMENT:PRODUCTION}
  bootstrap-admin:
    username: ${COURTSIDE_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
  login-protection:
    address:
      max-failures: ${COURTSIDE_LOGIN_ADDRESS_MAX_FAILURES:20}
      window: ${COURTSIDE_LOGIN_ADDRESS_WINDOW:1m}
      block: ${COURTSIDE_LOGIN_ADDRESS_BLOCK:1m}
    global:
      max-failures: ${COURTSIDE_LOGIN_GLOBAL_MAX_FAILURES:100}
      window: ${COURTSIDE_LOGIN_GLOBAL_WINDOW:1m}
      block: ${COURTSIDE_LOGIN_GLOBAL_BLOCK:1m}
  booking:
    slot-minutes: 30
    time-zone: ${COURTSIDE_TIME_ZONE:Europe/Berlin}
    series-horizon-months: 12

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
