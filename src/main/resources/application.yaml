spring:
  application:
    name: courtside
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: ${COURTSIDE_SLOW_QUERY_THRESHOLD_MS:500}
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: always
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: de
    locale-resolver: accept-header
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${COURTSIDE_IMPORT_MAX_FILE_SIZE:8MB}
      max-request-size: ${COURTSIDE_IMPORT_MAX_FILE_SIZE:8MB}

server:
  forward-headers-strategy: framework
  error:
    include-message: never
  servlet:
    session:
      cookie:
        secure: ${COURTSIDE_COOKIE_SECURE:true}

courtside:
  source-url: ${COURTSIDE_SOURCE_URL:@project.url@}
  environment: ${COURTSIDE_ENVIRONMENT:PRODUCTION}
  clock:
    fixed-instant: ${COURTSIDE_CLOCK_FIXED_INSTANT:}
  bootstrap-admin:
    username: ${COURTSIDE_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${COURTSIDE_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${COURTSIDE_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
  login-protection:
    address:
      max-failures: ${COURTSIDE_LOGIN_ADDRESS_MAX_FAILURES:20}
      window: ${COURTSIDE_LOGIN_ADDRESS_WINDOW:1m}
      block: ${COURTSIDE_LOGIN_ADDRESS_BLOCK:1m}
    global:
      max-failures: ${COURTSIDE_LOGIN_GLOBAL_MAX_FAILURES:100}
      window: ${COURTSIDE_LOGIN_GLOBAL_WINDOW:1m}
      block: ${COURTSIDE_LOGIN_GLOBAL_BLOCK:1m}
  booking:
    series-horizon-months: 12
  import:
    preview-retention: ${COURTSIDE_IMPORT_PREVIEW_RETENTION:7d}

management:
  tracing:
    sampling:
      probability: ${COURTSIDE_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${COURTSIDE_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${COURTSIDE_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: ${COURTSIDE_OTLP_ENABLED:false}
        url: ${COURTSIDE_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  prometheus:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
