openapi: 3.1.0

info:
  title: Courtside
  version: 0.1.0
  summary: Court booking for a single sports club.
  description: |
    Courtside is single-tenant: this document describes the API of one club's own instance.
    There is no tenant identifier anywhere in it, and there never will be.

    This document is the source of truth for the API, not a description generated from an
    implementation. An operation that is not here is not part of the API, and a change here is a
    change to a published contract.

    ## Errors

    Every failure is an RFC 9457 problem detail. `type` is always a `urn:courtside:error:<slug>`
    URN: a stable identifier, not a fetchable page. A club runs its instance under its own domain,
    so an `https://` type would name a host nobody operates.

    Two arrays carry everything a client has to show a member, and both hold the same kind of
    entry:

    - `violations` — a rule the request broke. Always an array, even where only one entry is ever
      possible, so a client has one shape to render rather than two.
    - `fieldErrors` — the same, plus the name of the input it came from.

    Neither carries rendered text. Each entry has a `code` naming a message and `params` holding
    the values that message interpolates, and the client resolves the pair against its own message
    catalogue. This is what makes the API usable in a language the server does not ship.

    Most codes belong to the field they name and are listed with it. Six are written by the error
    handling itself, so no field declares them. Four describe how a **JSON** body is read — the
    form-encoded login and the multipart import upload are parsed by neither of them, and an extra
    field there is ignored rather than refused:

    - `validation.NotNull` — a field this operation requires was left out.
    - `validation.TypeMismatch` — a field holds no value of the type it declares.
    - `validation.NoDuplicates` — an array whose entries must be distinct holds one of them twice.
      `field` names the array.
    - `validation.UnknownField` — the body names a field this operation does not define. An
      unknown field is refused rather than ignored, so a misspelt name is answered instead of
      silently taking effect as the omission of the field that was meant. `field` repeats the
      name the request sent, shortened if it was long: it is the caller's own text and no client
      should render it as anything else.

    Two more can arrive from any request the server validates, whatever it is encoded as:

    - `validation.SizeAtLeast` — a list is shorter than its lower bound, and it has no upper one.
    - `validation.rejected` — a check refused the field without a code of its own. A client that
      cannot do better than a generic message has one here.

    All six arrive as `400` with type `urn:courtside:error:validation-failed`.

    A name carries one value. No parameter here is an array, so a request that states the same
    query parameter, form field or multipart part twice is refused with `400` and type
    `urn:courtside:error:ambiguous-parameter` before the operation runs: two values and no rule
    saying which wins is a request nobody can answer. A query parameter and a form field of the
    same name are the same name. This refusal precedes dispatch, so it can answer any operation
    here, including one that declares no `400` of its own.

    ## Authentication

    Anonymous callers may read the public court plan and its anonymised occupancy. Creating,
    changing or cancelling a booking always requires a server-side session belonging to the
    acting account. Booking and participant cards describe permissions and participant slots;
    they are never credentials and carry no shared secret. State-changing requests also require
    the CSRF token declared below.

    Future paid bookings by people without a club membership use verified external accounts, not
    anonymous writes. Those accounts retain their booking and payment history and may later gain
    an active membership without changing identity. They may use only cards that explicitly allow
    the future `EXTERNAL_BOOKER` permission; an empty card role list never grants external access.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /
    description: The club's own instance.

tags:
  - name: session
    description: Logging in and out.
  - name: documentation
    description: The contract this instance answers to.
  - name: source
    description: Where this instance's own source can be had.
  - name: courts
    description: The club's courts, as anyone may see them.
  - name: opening-hours
    description: When the facility is open, as anyone may see it.
  - name: club-config
    description: The club's name and branding, as anyone may see it.
  - name: cards
    description: The booking and participant cards a member may use.
  - name: bookings
    description: Booking a court, and cancelling.
  - name: participants
    description: Finding members who can participate in a booking.
  - name: booking-series
    description: Recurring bookings — previewing, creating, moving and cancelling.
  - name: waitlist
    description: Queueing for a taken slot and taking it when it frees.
  - name: partner-search
    description: Offering the open place of a booking to other members and taking one.
  - name: attendance
    description: Checking in for one's own booking where the club records attendance.
  - name: emergency-codes
    description: Asking for the emergency code of a booking's door when its own code is missing.
  - name: admin-courts
    description: Administering courts.
  - name: door-codes
    description: The codes of the doors open to every member.
  - name: admin-access-points
    description: Administering the doors and gates that lead to the courts.
  - name: occupancy
    description: Whether each court is occupied, for the club's building automation to poll.
  - name: admin-occupancy-key
    description: The key building automation presents when it polls the occupancy signal.
  - name: admin-access-grants
    description: Watching and retrying the access grants an access-control system installs per booking.
  - name: admin-opening-hours
    description: Administering opening hours.
  - name: admin-booking-cards
    description: Administering booking cards.
  - name: admin-participant-cards
    description: Administering participant cards.
  - name: admin-membership-types
    description: Administering membership types.
  - name: admin-roster
    description: The club's people, and the accounts they hold.
  - name: admin-rule-sets
    description: Administering rule sets and their rules.
  - name: admin-config
    description: Administering the club's own name and branding.
  - name: admin-attendance
    description: Recording attendance and no-shows, and lifting no-shows.
  - name: admin-impact
    description: What a configuration change would affect, before it is made.
  - name: admin-import-references
    description: Which member number of a source stands for which person.
  - name: admin-import-previews
    description: What an uploaded roster snapshot would change, before anything is written.
  - name: admin-import-runs
    description: Executing a reviewed snapshot, and the log of what was executed.
  - name: admin-retention
    description: How long the club keeps personal records, and the reviewed runs that apply it.
  - name: admin-audit
    description: The changes this instance recorded.
  - name: admin-messages
    description: What became of the messages this instance sent.
  - name: admin-message-templates
    description: The club's own wording of the messages it sends.
  - name: admin-operational-logs
    description: Recent bounded diagnostics from the reference deployment.
  - name: admin-operator-health
    description: Which application-controlled checks pass and which operator evidence is missing.
  - name: admin-subject-access
    description: Answering what this instance holds about one named person.
  - name: admin-statistics
    description: How the club is doing over a period, as aggregates that name nobody.
  - name: admin-usage-reports
    description: How the courts were used, cancelled, missed and refused over a period, as counts that name nobody.

security:
  - sessionCookie: []

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-SESSION
      description: |
        A server-side session, established by `POST /api/session`. Deliberately not a JWT: the
        club's own frontend and the API share an origin, and an admin must be able to end a
        session immediately, which a self-contained token cannot offer. HTTPS uses the
        host-bound `__Host-SESSION` name. The explicit local HTTP development policy uses
        `SESSION`, because browsers reject `__Host-` cookies without `Secure`.
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        Required on every state-changing request. Over HTTPS, `GET /api/session` issues a readable
        `__Host-XSRF-TOKEN` cookie; echo its value in this header. The explicit local HTTP
        development policy uses the unprefixed `XSRF-TOKEN` name because browsers reject
        `__Host-` cookies without `Secure`. Modelled as a security scheme rather than as a header
        parameter because it is consumed before the operation runs and is never part of its input.

        A write without it answers `403` carrying `urn:courtside:error:access-denied`, the same
        problem an authorization refusal carries. The token is checked before the request reaches
        an operation, so the refusal says nothing about the caller's session or rights.

  parameters:
    PageCursor:
      name: cursor
      in: query
      required: false
      description: |
        The opaque `nextCursor` returned by the preceding page. This is the plain variant: a paging
        endpoint whose cursor needs prose of its own declares that cursor inline instead of sharing
        this one, so not every paging endpoint refers to it.
      schema: { type: string, format: uuid }
    DependantPersonId:
      name: personId
      in: path
      required: true
      description: The dependant the caller acts for as a guardian.
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    RetentionCategory:
      name: category
      in: path
      required: true
      schema: { $ref: "#/components/schemas/RetentionCategory" }
    MessageTemplateKind:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/MessageKind" }
    MessageTemplateLanguage:
      name: language
      in: path
      required: true
      schema: { $ref: "#/components/schemas/MessageTemplateLanguage" }
    StatisticsFrom:
      name: from
      in: query
      required: false
      description: |
        The first day of the period, inclusive, in the club time zone. Given together with `to` or
        not at all; without both the period is the last full calendar month. Both dates lie in the
        years 0001 to 9999 and the period spans at most 36,525 days, a hundred years.
      schema: { type: string, format: date }
    StatisticsTo:
      name: to
      in: query
      required: false
      description: The last day of the period, inclusive, in the club time zone.
      schema: { type: string, format: date }

  schemas:

    DayOfWeek:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    Role:
      type: string
      description: A permission bundle. One person often holds several.
      enum: [MEMBER, TRAINER, SPORT_DIRECTOR, YOUTH_DIRECTOR, GROUNDSKEEPER, TREASURER, ADMIN]

    InitialPasswordChangeRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 256

    ReauthenticationRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: An unused TOTP step or recovery code, required when the account has MFA enabled.
        credential:
          $ref: "#/components/schemas/WebAuthnAssertionCredential"

    MfaCodeProof:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128

    MfaStatus:
      type: object
      required: [enabled, totpEnabled, recoveryCodesRemaining]
      properties:
        enabled: { type: boolean }
        totpEnabled: { type: boolean }
        recoveryCodesRemaining: { type: integer, minimum: 0, maximum: 10 }
        webauthnAvailable: { type: boolean }
        devices:
          type: array
          items: { $ref: "#/components/schemas/WebAuthnDevice" }

    TotpEnrollment:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, pattern: "^[A-Z2-7]{32}$" }
        uri: { type: string, format: uri }

    MfaRecoveryCodeSet:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          maxItems: 10
          items: { type: string }
          description: Plaintext codes appear only in the response that generates them. Save them before signing in again.

    PasswordResetRequest:
      type: object
      description: |
        The name the member signs in with. Its shape is the one `UsernameRequest` states, so a
        name this instance could never have issued is refused on its shape rather than answered
        as though it had been looked up.
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 60
          pattern: "^[a-z0-9._-]+$"

    MfaAdministrativeStatus:
      type: object
      required: [enabled, recoveryPending]
      properties:
        enabled: { type: boolean }
        recoveryPending: { type: boolean }
    MfaRecoveryInitiation:
      type: object
      required: [identityChecked]
      properties:
        identityChecked:
          type: boolean
          description: The administrator verified the holder's identity outside this request.
    MfaRecoveryRedemption:
      type: object
      required: [username, code, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        code: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 12, maxLength: 256 }

    PasswordResetRedemptionRequest:
      type: object
      description: |
        The code from the message and the password to set with it. The code's alphabet leaves out
        every glyph that can be read as another one, so a member retyping it from a mail cannot
        produce a different code by choosing wrongly between them; the separator and the case are
        optional because neither carries meaning.
      required: [code, password]
      properties:
        code:
          type: string
          pattern: "^[2-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}[- ]?[2-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}$"
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256

    UsernameReminderRequest:
      type: object
      description: |
        The address the member gave the club. It names no single account, which is why this
        request can only produce a reminder.
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 120

    BrowserFamily:
      type: string
      enum: [CHROME, EDGE, FIREFOX, SAFARI, OTHER]

    AccountSession:
      type: object
      required: [handle, createdAt, lastActivityAt, current, browserFamily]
      properties:
        handle:
          type: string
          pattern: "^[A-Za-z0-9_-]{22}$"
          description: An opaque revocation handle. It is not the session cookie or a reusable credential.
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        current: { type: boolean }
        browserFamily: { $ref: "#/components/schemas/BrowserFamily" }

    SessionStatus:
      type: object
      required: [authenticated, roles, passwordChangeRequired]
      properties:
        authenticated:
          type: boolean
        mfaRequired:
          type: boolean
          description: A password was accepted but no account privileges exist until MFA succeeds.
        mfaEnabled:
          type: boolean
          description: Whether this authenticated holder needs a second factor for fresh sensitive-action proof.
        totpAvailable:
          type: boolean
        webauthnAvailable:
          type: boolean
        username:
          type: string
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        locale:
          type: string
          pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        passwordChangeRequired:
          type: boolean
        managesAppointments:
          type: boolean
          description: |
            Whether an active booking card names one of the account's roles among its managing
            roles, so the club appointments list has something to show. Always true for an
            administrator, false without a session. A client that lacks the field treats it as false.
        createsSeries:
          type: boolean
          description: |
            Whether an active booking card that tracks no players lets one of the account's roles
            book it, which is what creating a series requires. A card without booking roles counts
            for every role. Always true for an administrator, false without a session. A client
            that lacks the field treats it as false.

    WebAuthnRp:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 253
        name:
          type: string
          minLength: 1
          maxLength: 200
    WebAuthnUser:
      type: object
      required:
      - id
      - name
      - displayName
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 86
          pattern: ^[A-Za-z0-9_-]+$
        name:
          type: string
          minLength: 1
          maxLength: 60
        displayName:
          type: string
          minLength: 1
          maxLength: 200
    WebAuthnCredentialDescriptor:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1500
          pattern: ^[A-Za-z0-9_-]+$
        type:
          type: string
          enum:
          - public-key
        transports:
          type: array
          items:
            type: string
            enum:
            - usb
            - nfc
            - ble
            - internal
            - hybrid
            - smart-card
    WebAuthnCreationOptions:
      type: object
      required:
      - rp
      - user
      - challenge
      - pubKeyCredParams
      - authenticatorSelection
      properties:
        rp:
          $ref: '#/components/schemas/WebAuthnRp'
        user:
          $ref: '#/components/schemas/WebAuthnUser'
        challenge:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
        pubKeyCredParams:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - type
            - alg
            properties:
              type:
                type: string
                enum:
                - public-key
              alg:
                type: integer
        timeout:
          type: integer
          format: int64
          minimum: 1
        excludeCredentials:
          type: array
          items:
            $ref: '#/components/schemas/WebAuthnCredentialDescriptor'
        authenticatorSelection:
          type: object
          required:
          - userVerification
          properties:
            residentKey:
              type: string
              enum:
              - discouraged
              - preferred
              - required
            requireResidentKey:
              type: boolean
            userVerification:
              type: string
              enum:
              - discouraged
              - preferred
              - required
        attestation:
          type: string
          enum:
          - none
          - indirect
          - direct
          - enterprise
        extensions:
          type: object
          additionalProperties: true
    WebAuthnRequestOptions:
      type: object
      required:
      - challenge
      - rpId
      - allowCredentials
      - userVerification
      properties:
        challenge:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
        timeout:
          type: integer
          format: int64
          minimum: 1
        rpId:
          type: string
          minLength: 1
          maxLength: 253
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/WebAuthnCredentialDescriptor'
        userVerification:
          type: string
          enum:
          - discouraged
          - preferred
          - required
        extensions:
          type: object
          additionalProperties: true
    WebAuthnAttestationResponse:
      type: object
      required:
      - attestationObject
      - clientDataJSON
      properties:
        attestationObject:
          type: string
          minLength: 1
          maxLength: 131072
          pattern: ^[A-Za-z0-9_-]+$
        clientDataJSON:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: ^[A-Za-z0-9_-]+$
        transports:
          type: array
          items:
            type: string
            enum:
            - usb
            - nfc
            - ble
            - internal
            - hybrid
            - smart-card
    WebAuthnAssertionResponse:
      type: object
      required:
      - authenticatorData
      - clientDataJSON
      - signature
      properties:
        authenticatorData:
          type: string
          minLength: 1
          maxLength: 131072
          pattern: ^[A-Za-z0-9_-]+$
        clientDataJSON:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: ^[A-Za-z0-9_-]+$
        signature:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^[A-Za-z0-9_-]+$
        userHandle:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 86
          pattern: ^[A-Za-z0-9_-]+$
    WebAuthnDevice:
      type: object
      required:
      - id
      - label
      - createdAt
      - lastUsedAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1500
          pattern: ^[A-Za-z0-9_-]+$
        label:
          type: string
          minLength: 1
          maxLength: 100
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    WebAuthnRegistrationCredential:
      type: object
      required:
      - id
      - rawId
      - type
      - response
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1500
          pattern: ^[A-Za-z0-9_-]+$
        rawId:
          type: string
          minLength: 1
          maxLength: 1500
          pattern: ^[A-Za-z0-9_-]+$
        type:
          type: string
          enum:
          - public-key
        response:
          $ref: '#/components/schemas/WebAuthnAttestationResponse'
        clientExtensionResults:
          type: object
          additionalProperties: true
        authenticatorAttachment:
          type:
          - string
          - 'null'
          enum:
          - platform
          - cross-platform
          - null
    WebAuthnAssertionCredential:
      type: object
      required:
      - id
      - rawId
      - type
      - response
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1500
          pattern: ^[A-Za-z0-9_-]+$
        rawId:
          type: string
          minLength: 1
          maxLength: 1500
          pattern: ^[A-Za-z0-9_-]+$
        type:
          type: string
          enum:
          - public-key
        response:
          $ref: '#/components/schemas/WebAuthnAssertionResponse'
        clientExtensionResults:
          type: object
          additionalProperties: true
        authenticatorAttachment:
          type:
          - string
          - 'null'
          enum:
          - platform
          - cross-platform
          - null
    WebAuthnEnrollmentRequest:
      type: object
      required:
      - label
      - credential
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^(?=.*\S)[^\p{Cc}]+$
        credential:
          $ref: '#/components/schemas/WebAuthnRegistrationCredential'
    WebAuthnLabelRequest:
      type: object
      required:
      - label
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^(?=.*\S)[^\p{Cc}]+$

    RuleType:
      type: string
      enum: [OPENING_HOURS, SLOT_GRID, ADVANCE_WINDOW, MAX_OPEN_BOOKINGS, MAX_BOOKING_DURATION,
             CANCELLATION_DEADLINE, NO_COURT_BOOKING, BOOKING_HOURS, WEEKLY_BOOKED_HOURS,
             MIN_BOOKING_DURATION, NO_SHOW_LIMIT]

    CancelScope:
      type: string
      description: Which occurrences of a series an operation applies to.
      enum: [THIS, THIS_AND_FOLLOWING, WHOLE_SERIES]

    CancellationReason:
      type: string
      description: |
        Why somebody other than the holder cancelled a booking, as a code the client and the
        messages translate. There is no free text, so a reason names nobody. It is fixed with the
        cancellation, because the message that names it has already gone out.
      enum: [COURT_CONDITION, WEATHER, CLUB_EVENT, MAINTENANCE, OTHER]

    BookingStatus:
      type: string
      enum: [CONFIRMED, CANCELLED]

    Violation:
      type: object
      description: |
        A rule the request broke, named rather than rendered. The client resolves `code` against
        its own message catalogue and interpolates `params`.
      required: [code, params]
      properties:
        code:
          type: string
          examples: ["booking.rule.advanceWindow.exceeded"]
        params:
          type: object
          additionalProperties: true
          examples: [{ maxDays: 14 }]

    BookingEligibility:
      type: object
      description: |
        Standing rule violations that prevent the signed-in account from booking a court, and the
        bounds its rule set puts on one booking's length, on the hours of the day it may book and on
        the hours it may book in a week.
      required: [violations]
      properties:
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
        maxBookingMinutes:
          type: [integer, "null"]
          description: |
            The longest single booking this account may take, in minutes, or absent where nothing
            bounds it. A client offers no longer period than this; the server refuses one anyway
            with `booking.rule.maxBookingDuration.exceeded`, so the field shortens a list rather
            than deciding anything.
        minBookingMinutes:
          type: [integer, "null"]
          description: |
            The shortest single booking this account may take, in minutes, or absent where nothing
            bounds it. The server refuses a shorter one with
            `booking.rule.minBookingDuration.notReached`.
        maxWeeklyBookedHours:
          type: [integer, "null"]
          description: |
            The hours this account may have booked in one club-local week, Monday to Sunday, or
            absent where nothing limits it. Its confirmed bookings on cards that count against limits
            count by the week they start in. The server refuses a booking past the limit with
            `booking.rule.weeklyBookedHours.exceeded`.
        bookingHours:
          oneOf:
            - $ref: "#/components/schemas/BookingHours"
            - type: "null"
          description: |
            The hours of the day inside which this account's rule set lets it book, or absent where
            nothing narrows the opening hours. The server refuses a booking outside them with
            `booking.rule.bookingHours.outside`.

    BookingHours:
      type: object
      description: |
        A window of club-local wall-clock time. A booking starts no earlier than `earliestStart`
        and ends no later than `latestEnd` on the same day.
      required: [earliestStart, latestEnd]
      properties:
        earliestStart: { $ref: "#/components/schemas/LocalTime" }
        latestEnd: { $ref: "#/components/schemas/LocalTime" }

    FieldError:
      type: object
      description: A violation that also names the input it came from.
      required: [field, code, params]
      properties:
        field:
          type: string
          examples: ["endsAt"]
        code:
          type: string
          examples: ["validation.ChronologicalSlot"]
        params:
          type: object
          additionalProperties: true

    Problem:
      type: object
      description: RFC 9457 problem detail.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: A `urn:courtside:error:<slug>` URN. Stable, and not a fetchable page.
          examples: ["urn:courtside:error:court-not-bookable"]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: |
            English, for a developer reading a log. Never shown to a member, and never built from
            a caller's input — the translatable part is in `violations`.
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Trace identifier shared with structured logs and tracing backends.
        spanId:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Server span identifier that selects the same request within the trace.
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
        fieldErrors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    PublicCourt:
      type: object
      required: [id, number, name]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        name: { type: [string, "null"] }

    Court:
      type: object
      required: [id, number, name, active]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        name: { type: [string, "null"] }
        active: { type: boolean }

    CourtRequest:
      type: object
      required: [number]
      properties:
        number: { type: integer, minimum: 1, maximum: 999 }
        name:
          type: string
          pattern: '^(?:[\u0009-\u000D\u001C-\u001F\u0020\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000]*|[\s\S]{0,60})$'
          description: Non-blank names contain at most 60 characters. Blank values are stored as no name.

    AccessPoint:
      type: object
      description: |
        A door or gate on the way to the courts. The board names the courts it serves and may keep
        a static access code for its keypad, or an emergency code when the access-control system
        issues the codes.
      required: [id, name, courtIds, staticCode, emergencyCode, openToMembers, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        courtIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        staticCode:
          type: [string, "null"]
          description: The code the keypad accepts, or `null` when the board keeps none.
        emergencyCode:
          type: [string, "null"]
          description: |
            The code the board keeps on the keypad of an access point without a static code, or
            `null`. It is never sent with a booking; a participant asks for it during the booking.
        openToMembers:
          type: boolean
          description: Every current member sees the static code, with or without a booking.
        active: { type: boolean }

    AccessPointRequest:
      type: object
      required: [name, courtIds]
      properties:
        name: { type: string, maxLength: 60, pattern: ".*\\S.*" }
        courtIds:
          type: array
          uniqueItems: true
          maxItems: 999
          description: Every court this access point leads to; the request replaces the stored list.
          items: { type: string, format: uuid }
        staticCode:
          type: [string, "null"]
          pattern: "^[0-9]{4,8}$"
          description: |
            Digits only. A new or changed code has exactly as many digits as the club's access code
            length; a stored code keeps working after that length changes. Absent or `null` removes it.
        openToMembers:
          type: boolean
          default: false
          description: |
            Shows the static code to every current member. Requires a static code; absent means
            `false`.
        emergencyCode:
          type: [string, "null"]
          pattern: "^[0-9]{4,8}$"
          description: |
            Only without a static code. A new or changed code follows the static code's length rule
            and differs from every static code. Absent or `null` removes it.

    AdminAccessGrantStatus:
      type: string
      description: |
        `FAILING` was refused or failed five counted attempts in a row and waits for a retry or a change of
        its booking; `REMOVING` is no longer wanted but may still be installed; `INSTALLED` is held by the
        access-control system as wanted; `WAITING` is wanted and not yet installed as wanted; `DONE` is
        neither wanted nor installed.
      enum: [FAILING, REMOVING, INSTALLED, WAITING, DONE]

    AdminAccessGrantCourt:
      type: object
      required: [number, name]
      properties:
        number: { type: integer, format: int32 }
        name: { type: string }

    AdminAccessGrant:
      type: object
      description: One booking's access grant and what the access-control system last answered. It never carries the code.
      required: [id, bookingId, status, validFrom, validUntil, startsAt, endsAt, courts, accessPoints, attempts,
                 lastFailure, nextAttemptAt]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/AdminAccessGrantStatus" }
        validFrom:
          type: [string, "null"]
          format: date-time
          description: When the code starts opening the doors, or `null` once the booking no longer asks for access.
        validUntil:
          type: [string, "null"]
          format: date-time
          description: When the code stops opening the doors, or `null` once the booking no longer asks for access.
        startsAt:
          type: [string, "null"]
          format: date-time
          description: The booking's start, or `null` when the booking cannot be read any more.
        endsAt:
          type: [string, "null"]
          format: date-time
          description: The booking's end, or `null` when the booking cannot be read any more.
        courts:
          type: array
          items: { $ref: "#/components/schemas/AdminAccessGrantCourt" }
        accessPoints:
          type: array
          description: The names of the access points the grant opens or opened last, in alphabetical order.
          items: { type: string }
        attempts:
          type: integer
          format: int32
          minimum: 0
          description: Counted attempts since the last success, change or manual retry.
        lastFailure:
          type: [string, "null"]
          description: What the access-control system answered the last time a call failed, or `null`.
        nextAttemptAt:
          type: [string, "null"]
          format: date-time
          description: When Courtside sends the grant again, or `null` when nothing is outstanding.

    AccessControlProbe:
      type: object
      description: |
        What the access-control system answered when Courtside last checked that it is reachable and lets
        Courtside manage users. Only the background pass asks; reading the overview never does.
      required: [reachable, outcome, detail, checkedAt]
      properties:
        reachable: { type: boolean }
        outcome: { $ref: '#/components/schemas/AccessControlProbeOutcome' }
        detail:
          type: string
          description: |
            The connector's own reason when it reported the system unreachable or refusing, empty otherwise.
            Digit runs shaped like an access code are masked.
        checkedAt: { type: string, format: date-time }

    AccessControlProbeOutcome:
      type: string
      description: |
        `ANSWERED` reached the system with the rights Courtside needs; `UNREACHABLE` did not reach it or the
        call failed; `TIMEOUT` got no answer within the call deadline; `CALL_THREAD_OCCUPIED` was not sent
        because an abandoned call still holds the call thread; `REFUSED` reached it without those rights.
      enum: [ANSWERED, UNREACHABLE, TIMEOUT, CALL_THREAD_OCCUPIED, REFUSED]

    AccessGrantOverview:
      type: object
      required: [connector, connected, probe, grants, total]
      properties:
        connector:
          type: string
          description: The access-control system this instance is configured for, `none` without one.
        connected:
          type: boolean
          description: Whether an access-control system installs grants at all.
        probe:
          description: The latest check of the access-control system, or `null` before the first one.
          oneOf:
            - $ref: "#/components/schemas/AccessControlProbe"
            - type: "null"
        grants:
          type: array
          description: |
            At most 100 grants that are not done, failing ones first, then by the start of their validity window.
          items: { $ref: "#/components/schemas/AdminAccessGrant" }
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many grants are not done, shown or not.

    LocalTime:
      type: string
      format: local-time
      pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9](?:\.[0-9]{1,9})?)?$'
      x-courtside-skip-pattern-annotation: true
      description: A club-local wall-clock time without an offset or time zone.

    NullableLocalTime:
      type: [string, "null"]
      format: local-time
      pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9](?:\.[0-9]{1,9})?)?$'
      x-courtside-skip-pattern-annotation: true
      description: A club-local wall-clock time without an offset or time zone, or null.

    OpeningHours:
      type: object
      description: |
        A day with no window is closed. Opening hours bind everyone, including an admin: the grid
        can only offer slots they permit, so a booking outside them is one the interface cannot
        render back.
      required: [dayOfWeek]
      properties:
        dayOfWeek: { $ref: "#/components/schemas/DayOfWeek" }
        opensAt: { $ref: "#/components/schemas/NullableLocalTime" }
        closesAt: { $ref: "#/components/schemas/NullableLocalTime" }

    BookingGrid:
      type: object
      required: [timeZone, slotMinutes, openingHours, openingWeeks, openingPeriods, courtClosures]
      properties:
        timeZone: { type: string, example: Europe/Berlin }
        slotMinutes: { type: integer, minimum: 5, maximum: 120, multipleOf: 5 }
        openingHours:
          type: array
          description: The week in force today, one entry per weekday.
          items: { $ref: "#/components/schemas/OpeningHours" }
        openingWeeks:
          type: array
          description: |
            Every version of the weekly hours in the order they take effect. A day is governed by
            the last version that has started on it, so a past week keeps the hours it had.
          items: { $ref: "#/components/schemas/OpeningWeek" }
        openingPeriods:
          type: array
          description: |
            Seasons and holidays that overlap the requested days, in the order they start. On the
            days a holiday covers its hours govern, then a season's, then the weekly hours.
          items: { $ref: "#/components/schemas/OpeningPeriod" }
        courtClosures:
          type: array
          description: Court closures that overlap the requested days; on them one court is closed while the others keep the hours of the day.
          items: { $ref: "#/components/schemas/PublicCourtClosure" }

    OpeningWeek:
      type: object
      required: [id, effectiveFrom, days]
      properties:
        id: { type: string, format: uuid }
        effectiveFrom:
          type: [string, "null"]
          format: date
          description: The first day in the club's time zone this week governs; null since the beginning.
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/OpeningHours" }

    OpeningPeriodKind:
      type: string
      enum: [SEASON, HOLIDAY]
      description: A season replaces the weekly hours for its dates; a holiday replaces a season too.

    OpeningPeriod:
      type: object
      required: [id, kind, name, startsOn, endsOn, days]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/OpeningPeriodKind" }
        name: { type: string, minLength: 1, maxLength: 80 }
        startsOn:
          type: string
          format: date
          description: The first day it governs, in the club's time zone.
        endsOn:
          type: string
          format: date
          description: The last day it governs, in the club's time zone.
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/OpeningHours" }

    OpeningPeriodRequest:
      type: object
      description: |
        The dates and hours of a season or holiday. A weekday with no window is closed on the days
        it covers, and a holiday holds the same window, or none, on every weekday. It starts today or
        later, and seasons and holidays each do not overlap another of their kind.
      required: [name, startsOn, endsOn, days]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/OpeningHours" }

    CreateOpeningPeriodRequest:
      allOf:
        - $ref: "#/components/schemas/OpeningPeriodRequest"
        - type: object
          required: [kind]
          properties:
            kind: { $ref: "#/components/schemas/OpeningPeriodKind" }

    OpeningPeriodImpactRequest:
      type: object
      description: |
        A season or holiday as it would be stored, without its name, and the stored one it would
        replace.
      required: [kind, startsOn, endsOn, days]
      properties:
        periodId: { type: [string, "null"], format: uuid }
        kind: { $ref: "#/components/schemas/OpeningPeriodKind" }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/OpeningHours" }

    CourtClosureImpactRequest:
      type: object
      description: A court closure as it would be stored, without its name, and the stored one it would replace.
      required: [courtId, startsOn, endsOn]
      properties:
        closureId: { type: [string, "null"], format: uuid }
        courtId: { type: string, format: uuid }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }

    CourtClosure:
      type: object
      required: [id, courtId, name, startsOn, endsOn]
      properties:
        id: { type: string, format: uuid }
        courtId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }

    PublicCourtClosure:
      type: object
      description: A court closure as anyone may read it, without the reason the board entered.
      required: [id, courtId, startsOn, endsOn]
      properties:
        id: { type: string, format: uuid }
        courtId: { type: string, format: uuid }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }

    CourtClosureRequest:
      type: object
      description: |
        The days one court is closed, both inclusive. It starts today or later, and the closures of
        one court do not overlap.
      required: [name, startsOn, endsOn]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }

    CreateCourtClosureRequest:
      allOf:
        - $ref: "#/components/schemas/CourtClosureRequest"
        - type: object
          required: [courtId]
          properties:
            courtId: { type: string, format: uuid }

    SetWeeklyOpeningHoursRequest:
      type: object
      description: |
        The whole week, one entry per weekday. A day with no window is closed; a day carrying one
        of the two times is rejected. The week travels as one body because seven requests behind
        one button is a save that can half-succeed.
      required: [days]
      properties:
        effectiveFrom:
          type: [string, "null"]
          format: date
          description: |
            The first day in the club's time zone the week governs, today when omitted. It cannot
            lie in the past; a week already starting on that day is replaced.
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/OpeningHours" }

    ClubConfig:
      type: object
      required: [clubName, primaryColor, accentColor, defaultLocale, supportedLocales, slotMinutes,
                 timeZone]
      properties:
        clubName: { type: string }
        installedAppName:
          type: string
          minLength: 1
          maxLength: 12
          description: |
            The name an installed Courtside shows under its icon, the same as the manifest's
            `short_name`: the club's own short name, or one derived from the club name when it set none.
        primaryColor: { type: string }
        accentColor: { type: string }
        logoUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^(https://\\S+|/[^/\\\\\\s]\\S*|/)$"
          description: |
            A same-origin path or an HTTPS image URL. A remote image discloses the visitor's IP
            address and the Courtside origin to its operator.
        imprintUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^(https?://\\S+|/[^/\\\\\\s]\\S*|/)$"
        privacyUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^(https?://\\S+|/[^/\\\\\\s]\\S*|/)$"
          description: |
            Where this club publishes its privacy policy, beside the imprint. Both are navigation
            targets rather than subresources, so unlike the logo they also accept plain HTTP: a club
            that serves Courtside without TLS still has to be able to link them.
        documentationUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^(https?://\\S+|/[^/\\\\\\s]\\S*|/)$"
          description: |
            A club-specific documentation target. The frontend uses the published Courtside
            documentation when this override is absent. This projection answers without
            authentication, so whatever a club enters here is readable by anybody.
        defaultLocale: { type: string }
        supportedLocales:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$" }
          description: |
            The languages this instance carries translations for, derived from the message bundles
            in the image rather than declared anywhere. A client offers a choice from this and never
            from a list of its own: an instance that ships a third language starts answering with it
            here, and nothing else has to be released for that to be true. Every language-valued
            field in this document is refused with `urn:courtside:error:language-unsupported` unless
            it names one of these.
        slotMinutes: { type: integer, minimum: 5, maximum: 120, multipleOf: 5 }
        timeZone: { type: string, example: Europe/Berlin }

    AdminClubConfig:
      description: |
        What an administrator sees. It carries the settings the public configuration deliberately
        leaves out, so a visitor is never told how long an issued credential stays usable.
      allOf:
        - $ref: "#/components/schemas/ClubConfig"
        - type: object
          required: [newAccountCredentialHours, passwordResetCredentialHours,
                     passwordResetTokenMinutes, bookingReminderHours, waitlistOfferMinutes,
                     accessLeadMinutes, accessLagMinutes, accessCodeLength, logoUploaded]
          properties:
            logoUploaded:
              type: boolean
              description: Whether the effective logo is stored by this Courtside instance.
            logoFallbackUrl:
              type: [string, "null"]
              maxLength: 500
              pattern: "^(https://\\S+|/[^/\\\\\\s]\\S*|/)$"
              description: The configured URL used again after an uploaded logo is removed.
            newAccountCredentialHours: { type: integer, minimum: 1, maximum: 168 }
            passwordResetCredentialHours: { type: integer, minimum: 1, maximum: 168 }
            passwordResetTokenMinutes: { type: integer, minimum: 15, maximum: 1440 }
            bookingReminderHours: { type: integer, minimum: 0, maximum: 168 }
            waitlistOfferMinutes: { type: integer, minimum: 1, maximum: 1440 }
            accessLeadMinutes: { type: integer, minimum: 0, maximum: 240 }
            accessLagMinutes: { type: integer, minimum: 0, maximum: 240 }
            accessCodeLength: { type: integer, minimum: 4, maximum: 8 }
            shortName:
              type: [string, "null"]
              maxLength: 12
              pattern: ".*\\S.*"
              description: |
                The name the club chose for the installed app's icon. `null` means the manifest
                derives one from the club name.
            noMembershipTypeRuleSetId:
              type: [string, "null"]
              format: uuid
              description: |
                The rule set measured against a person who holds no current membership type. `null`
                leaves such a person bound by no membership-scoped rule, which is the most permissive
                state the booking rules know — the facility-wide rules still apply. It is deliberately
                not on the public configuration: a visitor learns nothing about how a club is run.

    ClubConfigRequest:
      type: object
      required: [clubName, primaryColor, accentColor, defaultLocale, slotMinutes, timeZone,
                 newAccountCredentialHours, passwordResetCredentialHours,
                 passwordResetTokenMinutes, bookingReminderHours]
      properties:
        clubName: { type: string, maxLength: 100, pattern: ".*\\S.*" }
        primaryColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        accentColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        logoUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^(https://\\S+|/[^/\\\\\\s]\\S*|/)$"
          description: |
            A same-origin path or an HTTPS image URL. A remote image discloses the visitor's IP
            address and the Courtside origin to its operator, so clubs should prefer a path they
            serve from their own instance.
        imprintUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^(https?://\\S+|/[^/\\\\\\s]\\S*|/)$"
        privacyUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^(https?://\\S+|/[^/\\\\\\s]\\S*|/)$"
          description: |
            Where this club publishes its privacy policy: a same-origin path or an absolute URL.
            Unlike the logo it is a navigation target rather than a subresource, so plain HTTP is
            accepted — a club that serves Courtside without TLS still has to be able to link it.
            Tab, newline and carriage return are refused throughout: a browser strips them before
            parsing, so `/<TAB>/host` would otherwise reach the same off-origin target as `//host`.
        documentationUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^(https?://\\S+|/[^/\\\\\\s]\\S*|/)$"
          description: |
            A same-origin path or absolute URL that replaces the published Courtside documentation
            target. `null` restores the frontend default.
        shortName:
          type: [string, "null"]
          maxLength: 12
          pattern: ".*\\S.*"
          description: |
            The name shown under the installed app's icon, where about twelve characters fit.
            `null` lets the manifest derive it from the club name: the whole name when it fits,
            otherwise its leading words.
        defaultLocale: { type: string, pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$" }
        slotMinutes: { type: integer, minimum: 5, maximum: 120, multipleOf: 5 }
        timeZone:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z][A-Za-z0-9+_-]*(/[A-Za-z0-9+._-]+)*$"
          description: |
            An IANA time zone identifier such as `Europe/Berlin`. A fixed-offset identifier is
            refused: the club grid has to follow daylight saving. It can only be changed while
            no confirmed future booking exists.
          example: Europe/Berlin
        bookingReminderHours:
          type: integer
          minimum: 0
          maximum: 168
          description: |
            How long before a booking starts its people are reminded of it. `0` switches reminders
            off; the club decides, because a day's notice serves one club and an hour serves another.
        waitlistOfferMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: |
            How long a freed slot stays reserved for the member whose turn it is on its waitlist.
            The offer ends at the slot's start at the latest. Leaving it out keeps the current value.
          example: 15
        accessLeadMinutes:
          type: integer
          minimum: 0
          maximum: 240
          description: |
            How long before a booking starts its access code opens the doors. Leaving it out keeps the
            current value.
          example: 15
        accessLagMinutes:
          type: integer
          minimum: 0
          maximum: 240
          description: |
            How long after a booking ends its access code still opens the doors. Leaving it out keeps
            the current value.
          example: 15
        accessCodeLength:
          type: integer
          minimum: 4
          maximum: 8
          description: |
            How many digits a new or changed static access code has. Codes stored before a change keep
            working. Leaving it out keeps the current value.
          example: 6
        newAccountCredentialHours:
          type: integer
          minimum: 1
          maximum: 168
          description: |
            How long the one-time password in a new member's invitation stays usable. The message
            names the date, and sign-in enforces it. A week is the ceiling: a credential this
            instance generated and mailed is not a password the member chose, so it expires
            whether or not it was ever used.
          example: 168
        passwordResetTokenMinutes:
          type: integer
          minimum: 15
          maximum: 1440
          description: |
            How long a self-service reset code stays redeemable. Minutes rather than hours,
            because the code is not access — it is permission to replace a password, and the
            shorter that permission lies in a mailbox the better. A club whose mail takes its time
            raises it; a day is the ceiling.
          example: 60
        passwordResetCredentialHours:
          type: integer
          minimum: 1
          maximum: 168
          description: |
            How long a password a board hands out after a reset stays usable. It shares the
            one-week ceiling with a new account's credential, for the same reason.
          example: 24
        noMembershipTypeRuleSetId:
          type: [string, "null"]
          format: uuid
          description: |
            The rule set to measure a person against while they hold no current membership type.
            It must name a rule set that exists and is active; `null` clears the assignment and
            restores the state in which no membership-scoped rule binds such a person.

    WebManifest:
      type: object
      additionalProperties: false
      required: [id, name, short_name, description, lang, start_url, display, background_color,
                 theme_color, icons, shortcuts]
      properties:
        id: { type: string }
        name: { type: string }
        short_name: { type: string, maxLength: 12 }
        description: { type: string }
        lang:
          type: string
          description: The club's default language, which the description and shortcuts are written in.
        start_url: { type: string }
        display: { type: string, enum: [standalone] }
        background_color:
          type: string
          description: The page colour the application paints, so the splash screen does not flash.
        theme_color: { type: string }
        icons:
          type: array
          items: { $ref: "#/components/schemas/WebManifestIcon" }
        shortcuts:
          type: array
          items: { $ref: "#/components/schemas/WebManifestShortcut" }

    WebManifestIcon:
      type: object
      additionalProperties: false
      required: [src, sizes, purpose]
      properties:
        src: { type: string }
        sizes: { type: string }
        type: { type: string }
        purpose: { type: string, enum: [any, maskable] }

    WebManifestShortcut:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }

    PublicBookingCard:
      type: object
      required: [id, label, color, allowedPlayerCounts, guestAllowed]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        color: { type: string }
        allowedPlayerCounts:
          type: array
          items: { type: integer }
        guestAllowed: { type: boolean }

    BookingCardLegendEntry:
      type: object
      additionalProperties: false
      required: [id, label, color, showGenericOccupancy]
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: Present for a named card; null on the combined generic-occupancy entry.
        label: { type: string }
        color: { type: string }
        showGenericOccupancy:
          type: boolean
          description: Whether the card is deliberately represented as neutral occupancy to other viewers.

    PublicParticipantCard:
      type: object
      required: [id, label]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        capacity: { type: [integer, "null"] }

    ParticipantMemberSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 60
          description: Matched case-insensitively anywhere in a member's full name.

    PublicParticipantMember:
      type: object
      required: [personId, displayName]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }

    BookingCard:
      type: object
      description: |
        What kind of occupancy a booking is. Member booking, training, league match and court
        closure differ only by their card, so a new kind is a row rather than a deployment.
      required: [id, label, color, allowedRoles, managingRoles, allowedPlayerCounts, tracksPlayers, countsAgainstLimits, guestAllowed, showGenericOccupancy, grantsAccess, signalsOccupancy, active]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        color: { type: string }
        allowedRoles:
          type: array
          uniqueItems: true
          description: |
            Roles allowed to create a booking with this card. Holding any listed role is
            sufficient. Empty permits every authenticated member account. Future external
            accounts may book only when this list explicitly includes `EXTERNAL_BOOKER`.
            Administrators may always book.
          items: { $ref: "#/components/schemas/Role" }
        managingRoles:
          type: array
          uniqueItems: true
          description: |
            The roles that may open, read and cancel every booking made on this card,
            independently of who may book with it. Empty means only an admin may.
          items: { $ref: "#/components/schemas/Role" }
        allowedPlayerCounts:
          type: array
          items: { type: integer }
        tracksPlayers: { type: boolean }
        countsAgainstLimits: { type: boolean }
        guestAllowed: { type: boolean }
        showGenericOccupancy:
          type: boolean
          description: Show a neutral booked label in the member-facing court plan instead of the card label.
        grantsAccess:
          type: boolean
          description: Whether bookings made with this card receive the access codes of their courts. Never true for the closure card.
        signalsOccupancy:
          type: boolean
          description: Whether bookings made with this card count as occupied in the court occupancy signal. Never true for the closure card.
        active: { type: boolean }

    BookingCardRequest:
      type: object
      required: [label, color, allowedRoles, allowedPlayerCounts, countsAgainstLimits, guestAllowed]
      properties:
        label: { type: string, maxLength: 60, pattern: ".*\\S.*" }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        allowedRoles:
          type: array
          uniqueItems: true
          description: |
            Roles allowed to create a booking with this card. Holding any listed role is
            sufficient. Empty permits every authenticated member account. Future external
            accounts may book only when this list explicitly includes `EXTERNAL_BOOKER`.
            Administrators may always book.
          items: { $ref: "#/components/schemas/Role" }
        managingRoles:
          type: array
          uniqueItems: true
          description: |
            The roles that may open, read and cancel every booking made on this card,
            independently of who may book with it. Absent or empty means only an admin may.
          items: { $ref: "#/components/schemas/Role" }
        allowedPlayerCounts:
          type: array
          description: |
            The exact player counts this card permits — `[2, 4]` for a member card, empty for a
            card that does not record players at all, such as training or a closure.
          maxItems: 20
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 20 }
        countsAgainstLimits: { type: boolean }
        guestAllowed: { type: boolean }
        showGenericOccupancy:
          type: boolean
          default: false
        grantsAccess:
          type: boolean
          default: false
          description: The closure card refuses `true`.
        signalsOccupancy:
          type: boolean
          default: true
          description: The closure card refuses `true`, so a change to it states `false`.

    ParticipantCard:
      type: object
      required: [id, label, active]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        capacity: { type: [integer, "null"] }
        active: { type: boolean }

    ParticipantCardRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, maxLength: 60, pattern: ".*\\S.*" }
        capacity:
          type: [integer, "null"]
          minimum: 1
          maximum: 99
          description: How many of this card the club owns. Absent means unlimited.

    ActiveRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }

    MembershipRequest:
      type: object
      description: |
        Writes one period of the person's membership: the period valid today, else the next one
        scheduled, else the latest that ended. When that one has ended and the request starts on or
        after its end, names no start, or leaves the person a member after today, a new period is
        added instead, from the requested start when it lies on or after the old end and from today
        otherwise, so a rejoin keeps the gap. A
        new type for a period that began before today and keeps its start ends that period today
        and opens the new type from today. A write that ends the period or moves its end earlier
        withdraws the periods starting on or after the new end and after today, each recorded in
        the audit log. `/api/admin/roster/{personId}/membership-periods` addresses each period by
        id.
      required: [membershipTypeId]
      properties:
        membershipTypeId:
          type: string
          format: uuid
          description: |
            A membership type the club still offers; `GET /api/admin/membership-types` lists them
            with their `active` flag. The club has to still offer it only when the write leaves the
            person a member of a type they did not already hold, so correcting the dates of a
            period on a type retired since is not refused.
        startedOn:
          type: [string, "null"]
          format: date
          description: |
            The first day of the period. Omitted, it is today for a period being added and leaves
            the start of an existing one where it is. It may lie in the future: such a period grants
            nothing until it begins.
        endedOn:
          type: [string, "null"]
          format: date
          description: |
            The first day the period no longer holds. Omitted, it runs without an end. It may lie in
            the future and must lie after `startedOn`. A period that would overlap another of the
            same person is answered `409` with `urn:courtside:error:membership-periods-overlap`.

    MembershipPeriodRequest:
      type: object
      required: [membershipTypeId, startedOn]
      properties:
        membershipTypeId:
          type: string
          format: uuid
          description: |
            A type the club still offers when the write gives the person a type the period did not
            already carry; keeping a retired type while correcting the dates is not refused.
        startedOn:
          type: string
          format: date
          description: The first day of the period. It may lie in the future.
        endedOn:
          type: [string, "null"]
          format: date
          description: |
            The first day the period no longer holds; omitted or `null`, it runs without an end. It
            must lie after `startedOn`, or the period would cover no day.

    MembershipPeriodState:
      type: string
      enum: [RUNNING, SCHEDULED, ENDED]
      description: |
        Where a period stands on the club's today, in the club's time zone: `RUNNING` holds today,
        `SCHEDULED` begins later, `ENDED` no longer holds.

    MembershipPeriod:
      type: object
      required: [id, membershipTypeId, startedOn, endedOn, state]
      properties:
        id: { type: string, format: uuid }
        membershipTypeId: { type: string, format: uuid }
        startedOn: { type: string, format: date }
        endedOn:
          type: [string, "null"]
          format: date
          description: The first day the period no longer holds, `null` while it runs without an end.
        state: { $ref: "#/components/schemas/MembershipPeriodState" }

    GuardianGrant:
      type: string
      enum: [VIEW_BOOKINGS, BOOK, CANCEL_BOOKINGS, READ_MESSAGES, ACCOUNT_TASKS]
      description: |
        One action a guardian may take for a dependant: read the dependant's bookings, book for
        them, cancel their bookings, read their messages, or account tasks such as requesting new
        credentials for the dependant's account. A guardian may take no action the relationship
        does not grant.

    GuardianRelationshipState:
      type: string
      enum: [RUNNING, ENDED]
      description: |
        Where a relationship stands on the club's today: `RUNNING` grants its actions today,
        `ENDED` grants nothing.

    Dependant:
      type: object
      required: [personId, firstName, lastName, grants, endedOn]
      properties:
        personId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        grants:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/GuardianGrant" }
        endedOn:
          type: [string, "null"]
          format: date
          description: The first day the relationship no longer holds, `null` while it runs without an end.

    GuardianParty:
      type: object
      required: [personId, firstName, lastName]
      properties:
        personId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }

    GuardianRelationship:
      type: object
      required: [id, guardian, dependant, grants, startedOn, endedOn, state]
      properties:
        id: { type: string, format: uuid }
        guardian: { $ref: "#/components/schemas/GuardianParty" }
        dependant: { $ref: "#/components/schemas/GuardianParty" }
        grants:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/GuardianGrant" }
        startedOn:
          type: string
          format: date
          description: The day the board created the relationship.
        endedOn:
          type: [string, "null"]
          format: date
          description: The first day the relationship no longer holds, `null` while it runs without an end.
        state: { $ref: "#/components/schemas/GuardianRelationshipState" }

    GuardianRelationshipRequest:
      type: object
      required: [guardianPersonId, dependantPersonId, grants]
      properties:
        guardianPersonId:
          type: string
          format: uuid
          description: The person who acts. Either this or `dependantPersonId` is the person in the path.
        dependantPersonId:
          type: string
          format: uuid
          description: The person acted for. A person cannot be their own guardian.
        grants:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/GuardianGrant" }
        endedOn:
          type: [string, "null"]
          format: date
          description: |
            The first day the relationship no longer holds; omitted or `null`, it lasts until the
            board ends it. It may be any day from today on.

    GuardianRelationshipChange:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/GuardianGrant" }
        endedOn:
          type: [string, "null"]
          format: date
          description: |
            The first day the relationship no longer holds; omitted or `null`, it lasts until the
            board ends it. It may be any day from the relationship's start on, also one already
            passed.

    MembershipType:
      type: object
      required: [id, name, active, grantsAccount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ruleSetId: { type: [string, "null"], format: uuid }
        active: { type: boolean }
        grantsAccount:
          type: boolean
          description: |
            Whether a roster synchronisation gives an account to the people it finds holding this
            type. It answers a different question from the rule set: a member may be entitled to
            read their own record without being entitled to book a court.

    CanonicalField:
      type: string
      description: |
        A field of the roster a snapshot can carry. `EXTERNAL_ID` is the member number the source
        system holds and is what a record is matched by; the other four are the person's data.
      enum: [EXTERNAL_ID, FIRST_NAME, LAST_NAME, EMAIL, MEMBERSHIP_TYPE]

    ImportColumnMode:
      type: string
      description: |
        How a source finds its fields in a file. `HEADER` reads the first row as column names and
        finds each field by the name mapped to it, wherever the column stands. `POSITION` reads a
        file without a header row and takes each field from the numbered column mapped to it, so
        every file must keep the same number of columns in the same order. `HEADER` is the safer
        default: a reordered export still reads correctly, where a reordered headerless one would
        put values into the wrong fields, which is why a changed column count refuses the file.
      enum: [HEADER, POSITION]

    ImportColumnPosition:
      type: object
      required: [position, field]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 200
          description: The column, counted from 1 at the left of the file.
        field: { $ref: "#/components/schemas/CanonicalField" }

    ImportSource:
      type: object
      required: [id, sourceKey, displayName, separator, encoding, columnMode, columns, positions,
                 columnCount, membershipTypes, defaultMembershipTypeId, ownedFields,
                 removalWarningPercent]
      properties:
        id: { type: string, format: uuid }
        sourceKey: { type: string }
        displayName: { type: string }
        separator:
          type: string
          minLength: 1
          maxLength: 1
          description: |
            The character between two cells of this source's export, given rather than detected.
            Counting columns in a header row guesses well until it does not: an export need not
            carry a header at all, a single-column file settles nothing, and a club whose file was
            read with the wrong character sees one enormous column and no way to tell why. Which
            character its own system writes is something a club can look at and answer, so it does.

        encoding:
          type: string
          minLength: 1
          maxLength: 60
          description: |
            The character set this source's export is written in, by the name
            `GET /api/admin/import/encodings` reports. It sits beside the separator because both
            are properties of the same export tool and a club should answer them once, not on
            every upload. A single file may still deviate: the upload carries its own `encoding`
            and overrides this one for that file alone.

            A byte order mark and valid UTF-8 remain facts about the content and outrank both.

        columnMode: { $ref: "#/components/schemas/ImportColumnMode" }
        columns:
          type: object
          description: The header mapping; empty for a source read by position.
          additionalProperties: { $ref: "#/components/schemas/CanonicalField" }
        positions:
          type: array
          description: The position mapping, ordered by position; empty for a source read by header.
          items: { $ref: "#/components/schemas/ImportColumnPosition" }
        columnCount:
          type: [integer, "null"]
          description: |
            The number of columns every file of a source read by position must have; `null` for a
            source read by header, whose files may carry columns it does not map.
        membershipTypes:
          type: object
          additionalProperties: { type: string, format: uuid }
        defaultMembershipTypeId: { type: string, format: uuid }
        ownedFields:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CanonicalField" }
        removalWarningPercent: { type: integer }

    ImportSourceRequest:
      type: object
      description: |
        Every part of a source is given here and every part may be given again — this request is
        what a correction uses as much as a first description.

        `membershipTypes` and `ownedFields` may be omitted, and the source then holds neither: no
        exported category maps to a type, and the source owns no field. `ImportSource` reports both
        as empty rather than absent, which is why it requires what this does not.

        `columnMode` omitted means `HEADER`. A source read by header gives `columns` and leaves
        `positions` and `columnCount` out; a source read by position gives `positions` and
        `columnCount` and leaves `columns` out or empty. Either side given for the other mode is
        refused rather than ignored, so nothing a club sent is silently dropped.
      required: [sourceKey, displayName, separator, encoding, defaultMembershipTypeId,
                 removalWarningPercent]
      properties:
        columnMode: { $ref: "#/components/schemas/ImportColumnMode" }
        positions:
          type: array
          maxItems: 200
          description: |
            For a source read by position, the column each field comes from. `EXTERNAL_ID`,
            `FIRST_NAME` and `LAST_NAME` are required for the same reason they are required as
            headers; no two entries may name the same position or the same field, and every
            position must lie within `columnCount`.
          items: { $ref: "#/components/schemas/ImportColumnPosition" }
        columnCount:
          type: integer
          minimum: 1
          maximum: 200
          description: |
            For a source read by position, the number of columns its files have. The browser
            counts them from a local sample of the export, so describing a source uploads no
            personal data. A file with a different count in its first row is refused before any
            preview exists, because its columns can no longer be trusted to mean what they did.
        confirmColumnModeChange:
          type: boolean
          description: |
            Must be `true` when a change switches the source between `HEADER` and `POSITION`. The
            next snapshot is then read the other way: by position, a header row in the file would
            be read as a member; by header, a file without one is refused. A switch sent without
            this is refused and nothing changes. It is ignored when the mode stays the same.
        sourceKey:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: |
            Names the system, not the file: `roster-system`, `club-registry`. It is half of the identity of every
            record the source brings, so changing it makes the next snapshot look like a different
            system's — which is the point when a club really does migrate, and a mistake otherwise.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ".*\\S.*"
          description: |
            Surrounding whitespace is removed before the name is stored, so a name pasted with
            padding is accepted; `maxLength` is measured on what was sent, and the stored name is
            never longer than it.
        separator:
          type: string
          minLength: 1
          maxLength: 1
          description: |
            The character between two cells of this source's export, given rather than detected.
            Counting columns in a header row guesses well until it does not: an export need not
            carry a header at all, a single-column file settles nothing, and a club whose file was
            read with the wrong character sees one enormous column and no way to tell why. Which
            character its own system writes is something a club can look at and answer, so it does.

        encoding:
          type: string
          minLength: 1
          maxLength: 60
          description: |
            The character set this source's export is written in, by the name
            `GET /api/admin/import/encodings` reports. It sits beside the separator because both
            are properties of the same export tool and a club should answer them once, not on
            every upload. A single file may still deviate: the upload carries its own `encoding`
            and overrides this one for that file alone.

            A byte order mark and valid UTF-8 remain facts about the content and outrank both.

        columns:
          type: object
          description: |
            For a source read by header, the header in the club's export, mapped to the field it
            holds. `EXTERNAL_ID`,
            `FIRST_NAME` and `LAST_NAME` are required — a snapshot creates people, and a record
            with no name, or without the number that identifies it, describes nobody this product
            could create. `EMAIL` and `MEMBERSHIP_TYPE` are optional, because a club's own member
            list carries people it holds no address for, and may not export a category at all. Two
            headers may not name the same field.

            Requiring the column is not the same as requiring every cell: a row whose name is empty
            fails on its own and the rest of the file resolves.

            A header is stored without its surrounding whitespace, because that is how it arrives
            from the file: a mapping kept with padding would name a column that never matches. Two
            headers that differ only in that whitespace name the same column and are refused. A
            header holding a control character is refused too — it could never match a real file.
          propertyNames: { minLength: 1, maxLength: 120, pattern: ".*\\S.*" }
          additionalProperties: { $ref: "#/components/schemas/CanonicalField" }
        membershipTypes:
          type: object
          description: |
            The value the export writes in its category column, mapped to a membership type of this
            club. Free text never creates a type: a value with no mapping stops the snapshot rather
            than inventing one. A type deactivated later is accepted here and refused by the run,
            which is where a club is told about it.

            A value is stored without its surrounding whitespace, for the same reason a header is.
            Two values that differ only in that whitespace name the same category and are refused,
            because keeping one of them would drop a mapping that was sent. At most 200 entries.
          propertyNames: { minLength: 1, maxLength: 120, pattern: ".*\\S.*" }
          maxProperties: 200
          additionalProperties: { type: string, format: uuid }
        defaultMembershipTypeId:
          type: string
          format: uuid
          description: |
            What somebody created from this source becomes when the file does not say. A snapshot
            creates people, and a person in this club holds exactly one kind of membership, so a
            source with nothing to fall back on could create nobody. Where the export does carry a
            category, its mapping wins and this fills the blanks.
        ownedFields:
          type: array
          uniqueItems: true
          description: |
            The fields this source owns. An owned field is overwritten by every later snapshot,
            except by an empty cell, which says nothing rather than clearing the value. A field
            left out is the club's own on people who already exist, and no synchronisation touches
            it there, however different the file is. A creation is the exception: it has nothing of
            the club's to leave alone, so it writes every mapped column whether the source owns it
            or not. `EXTERNAL_ID` cannot be owned — it identifies the record rather than describing
            anybody.
          items: { $ref: "#/components/schemas/CanonicalField" }
        removalWarningPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Above this share of the roster disappearing at once, an execution needs explicit
            confirmation. A truncated export is the ordinary accident this guards against.

    ExternalReference:
      type: object
      required: [referenceId, sourceId, externalId, personId, personName, linkedAt]
      properties:
        referenceId: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        externalId: { type: string, minLength: 1, maxLength: 120 }
        personId: { type: string, format: uuid }
        personName:
          type: string
          description: |
            The name that person carries today, resolved when the reference is read rather than
            stored with it. A link is a row identified by two ids, and a board asked to confirm one
            has to see who it is about; a renamed person would otherwise keep the name they had when
            somebody linked them.
        linkedAt: { type: string, format: date-time }

    ExternalReferencePage:
      type: object
      required: [references]
      properties:
        references:
          type: array
          items: { $ref: "#/components/schemas/ExternalReference" }
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: Pass this reference id as `cursor` to continue after the current page.

    ExternalReferenceRequest:
      type: object
      required: [externalId, personId]
      properties:
        externalId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ".*\\S.*"
          description: |
            The member number the source system holds for this person. Surrounding whitespace is
            removed before it is stored, so a value pasted with padding is accepted.
        personId:
          type: string
          format: uuid
          description: The person in this club's roster that the record stands for.

    SnapshotMode:
      type: string
      description: |
        `FULL_SNAPSHOT` means the file is the whole truth about this source: a member it does not
        carry has left, and their membership ends. `UPDATE_ONLY` means the file is a partial
        delivery — absence says nothing, and no membership ends because of it. The difference is
        the difference between a club's yearly export and a correction of forty rows.
      enum: [FULL_SNAPSHOT, UPDATE_ONLY]

    ImportChangeKind:
      type: string
      description: |
        `CREATE` adds a person this source has not seen before, `UPDATE` writes the owned fields
        that differ, and `END_MEMBERSHIP` records that somebody the file no longer carries has left.
      enum: [CREATE, UPDATE, END_MEMBERSHIP]

    ImportAccountOutcome:
      type: string
      description: |
        What the execution would do about this row's account. `CREATE` means one is opened and the
        one-time password is mailed to the member. Every other value means none is, and names the
        reason: the membership type grants none, the row has no address to send a credential to,
        the row looks like somebody the roster already holds, the person already signs in, or the
        row ends a membership and was never asked.
      enum: [CREATE, MEMBERSHIP_TYPE_GRANTS_NONE, NO_ADDRESS, POSSIBLE_DUPLICATE, ALREADY_HELD,
             NOT_ASKED]

    ImportPersonChange:
      type: object
      required: [kind, rowNumber, externalId, values, account]
      properties:
        kind: { $ref: "#/components/schemas/ImportChangeKind" }
        rowNumber:
          type: integer
          description: |
            The nth data row of the file, counting the header as row zero. An `END_MEMBERSHIP` has
            no row of its own — it follows from an absence — and reports `0`.
        externalId: { type: string }
        personId: { type: [string, "null"], format: uuid }
        personName:
          type: [string, "null"]
          description: |
            The name that person carries today, resolved when the preview is read. `null` on a
            `CREATE`, which describes somebody who does not exist yet — their names are in `values`.
            A board reviewing an `END_MEMBERSHIP` is reading the riskiest line of the whole preview
            and has to see whose membership it is.
        values:
          type: object
          description: |
            Only the fields that would actually change, keyed by canonical field. A field this
            source does not own never appears here, however different the file is.
          additionalProperties: { type: string }
        membershipTypeId: { type: [string, "null"], format: uuid }
        account: { $ref: "#/components/schemas/ImportAccountOutcome" }

    ImportRowError:
      type: object
      required: [rowNumber, code, params]
      properties:
        rowNumber: { type: integer }
        code:
          type: string
          description: |
            An i18n key; the client renders it. The row is skipped, the file is not. A row is also
            reported here when it carries a value this instance cannot store — empty, holding a line
            break, too long, or not a usable address — so a preview never promises a change that the
            execution would then refuse.
        params:
          type: object
          additionalProperties: true

    ImportPossibleDuplicate:
      type: object
      required: [rowNumber, externalId, personId, personName]
      description: |
        A row that would create somebody the roster appears to hold already. It is reported and not
        acted on: two members really are called John Roe, so only a board can tell a duplicate from
        a namesake. The answer to a real one is to link the record to the person it names.
      properties:
        rowNumber: { type: integer }
        externalId: { type: string }
        personId: { type: string, format: uuid }
        personName:
          type: string
          description: The name that person carries today, resolved when the preview is read.

    ImportSharedAddress:
      type: object
      required: [rowNumber, externalId, sharedBy]
      description: |
        A row this run would open an account for, whose address more than one person holds. The
        account is still opened — a shared address is deliberate, a parent registering for their
        children — but whoever reads that mailbox receives every one-time password sent to it and a
        first credential is enough to keep an account. The count is here so a board sees that
        before the run sends anything, the way the roster shows it before a single credential.
      properties:
        rowNumber: { type: integer }
        externalId: { type: string }
        sharedBy:
          type: integer
          description: |
            People who would hold that address once the run is done: those the roster already has
            on it plus those this run puts there. A row moving somebody onto the address counts
            twice at worst, which errs towards reporting more sharing rather than less.

    ImportRemovalCounts:
      type: object
      required: [count, currentlyLinked, percent]
      properties:
        count: { type: integer }
        currentlyLinked:
          type: integer
          description: |
            How many current memberships this source accounts for right now. It is the denominator
            of `percent`, so a source covering part of a club is measured against its own part
            rather than against the whole roster.
        percent: { type: integer }

    ImportPreview:
      type: object
      required: [previewId, sourceId, mode, fileName, fileHash, rowCount, ignoredColumns, changes,
                 rowErrors, possibleDuplicates, sharedAddresses, removals, needsConfirmation,
                 superseded, createdAt, expiresAt]
      properties:
        previewId: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/SnapshotMode" }
        fileName: { type: string, minLength: 1, maxLength: 200 }
        fileHash:
          type: string
          description: |
            The SHA-256 of the uploaded bytes, in lower-case hex. Uploading the same file twice
            yields two previews carrying the same hash, which is how a board can tell it reviewed
            the file it meant to.
        rowCount: { type: integer }
        ignoredColumns:
          type: array
          items: { type: string }
          description: |
            Headers the file carries and this source's mapping does not name. They are skipped and
            listed rather than silently dropped: a column left out by a typo in the mapping looks
            exactly like a column the club never wanted.
        changes:
          type: array
          items: { $ref: "#/components/schemas/ImportPersonChange" }
        rowErrors:
          type: array
          items: { $ref: "#/components/schemas/ImportRowError" }
        possibleDuplicates:
          type: array
          items: { $ref: "#/components/schemas/ImportPossibleDuplicate" }
        sharedAddresses:
          type: array
          items: { $ref: "#/components/schemas/ImportSharedAddress" }
        removals: { $ref: "#/components/schemas/ImportRemovalCounts" }
        needsConfirmation:
          type: boolean
          description: |
            True when the share of this source's memberships that would end exceeds the source's
            own threshold. It does not block anything here — a preview writes nothing — it tells a
            board that executing this one needs a deliberate confirmation.
        superseded:
          type: boolean
          description: |
            A newer preview for this source exists. The older one is kept so that what was reviewed
            stays readable, and it is not what a later execution should use.
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    ImportRun:
      type: object
      required: [runId, sourceId, previewId, mode, fileHash, created, corrected, membershipsEnded,
                 accountsCreated, accountsDisabled, rolesRemoved, rowErrors, removalsConfirmed,
                 executedAt]
      properties:
        runId: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        previewId: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/SnapshotMode" }
        fileHash: { type: string }
        created: { type: integer }
        corrected: { type: integer }
        membershipsEnded: { type: integer }
        accountsCreated:
          type: integer
          description: |
            Accounts opened for members whose membership type grants one. Each was mailed its own
            one-time password; nobody else ever sees it.
        accountsDisabled:
          type: integer
          description: |
            Accounts whose only role was `MEMBER` and which are therefore no longer able to sign in.
            An account holding another role is never disabled by a snapshot, and no snapshot ever
            enables one.
        rolesRemoved:
          type: integer
          description: Accounts that kept another role and lost `MEMBER` only.
        rowErrors: { type: integer }
        removalsConfirmed: { type: boolean }
        executedAt: { type: string, format: date-time }

    ExecutionRequest:
      type: object
      properties:
        confirmRemovals:
          type: boolean
          default: false
          description: |
            Required only when the preview reported `needsConfirmation`. It is a deliberate second
            statement about one reviewed preview, not a setting: a truncated export is the accident
            this exists to catch, and catching it is worth one extra click.

    RetentionCategory:
      type: string
      enum: [BOOKINGS, FORMER_MEMBERS]
      description: |
        `BOOKINGS` covers bookings and series by when they ended. `FORMER_MEMBERS` covers people
        by when their membership ended, with their accounts.

    RetentionPolicy:
      type: object
      required: [category, retainMonths]
      properties:
        category: { $ref: "#/components/schemas/RetentionCategory" }
        retainMonths:
          type: [integer, "null"]
          minimum: 1
          maximum: 1200
          description: Months a record is kept after it ended; null when the category is not configured.

    RetentionPeriod:
      type: object
      required: [retainMonths]
      properties:
        retainMonths:
          type: integer
          minimum: 1
          maximum: 1200

    RetentionPreview:
      type: object
      required: [previewId, expiresAt, bookings, formerMembers, blocked]
      properties:
        previewId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        bookings:
          description: What the run would pseudonymise; null when bookings have no period.
          oneOf:
            - $ref: "#/components/schemas/RetentionBookingsPreview"
            - type: "null"
        formerMembers:
          description: Whom the run would remove; null when former members have no period.
          oneOf:
            - $ref: "#/components/schemas/RetentionFormerMembersPreview"
            - type: "null"
        blocked:
          type: array
          description: Former members eligible by date whom a run cannot remove yet, with the reason.
          items: { $ref: "#/components/schemas/RetentionBlockedRecord" }

    RetentionBookingsPreview:
      type: object
      required: [endedBefore, bookings, series]
      properties:
        endedBefore: { type: string, format: date-time }
        bookings: { type: integer }
        series: { type: integer }

    RetentionFormerMembersPreview:
      type: object
      required: [membershipEndedBefore, people, accounts]
      properties:
        membershipEndedBefore: { type: string, format: date }
        people: { type: integer }
        accounts: { type: integer }

    RetentionBlockedRecord:
      type: object
      required: [personId, reason]
      properties:
        personId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/RetentionBlockReason" }

    RetentionBlockReason:
      type: string
      enum: [ADMINISTRATOR, NAMED_IN_BOOKINGS, ON_A_WAITING_LIST]
      description: |
        `ADMINISTRATOR`: an account of the person holds the administrator role.
        `NAMED_IN_BOOKINGS`: a booking or series that this run does not pseudonymise still names
        the person. `ON_A_WAITING_LIST`: the person waits for a court.

    RetentionRun:
      type: object
      required: [runId, bookingsPseudonymised, seriesPseudonymised, formerMembersRemoved,
                 accountsRemoved, formerMembersSkipped]
      properties:
        runId: { type: string, format: uuid }
        bookingsPseudonymised: { type: integer }
        seriesPseudonymised: { type: integer }
        formerMembersRemoved: { type: integer }
        accountsRemoved: { type: integer }
        formerMembersSkipped:
          type: integer
          description: Former members the preview listed who were no longer eligible when the run reached them.

    MembershipTypeRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60, pattern: ".*\\S.*" }
        ruleSetId: { type: [string, "null"], format: uuid }
        grantsAccount:
          type: boolean
          default: false
          description: |
            Absent is `false`. Switching it on changes nothing by itself; the next synchronisation
            of a source is what creates the accounts, and its preview says how many first.

    PersonRequest:
      type: object
      description: |
        Neither name may be blank, and no value may hold a control character — not a line break,
        and not a NUL, which PostgreSQL refuses to store at all.

        Surrounding whitespace is removed before the values are checked and stored, so a name or
        an address pasted with padding is accepted, `maxLength` counts what is left, and the
        person carries no padding.

        An email address is accepted whatever the rest of the roster already holds; see
        `POST /api/admin/roster`.
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          maxLength: 60
          pattern: "[^\\u0000-\\u001f\\u007f-\\u009f]*[^\\u0000-\\u0020\\u007f-\\u009f\\u00a0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000\\ufeff][^\\u0000-\\u001f\\u007f-\\u009f]*"
        lastName:
          type: string
          maxLength: 60
          pattern: "[^\\u0000-\\u001f\\u007f-\\u009f]*[^\\u0000-\\u0020\\u007f-\\u009f\\u00a0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000\\ufeff][^\\u0000-\\u001f\\u007f-\\u009f]*"
        email:
          type: [string, "null"]
          format: email
          maxLength: 120
          description: |
            One `@` with something before it, and a dotted domain after it. The rule is spelled out
            here because the service enforces exactly it: a shape this pattern accepts and the
            service then refuses would reach a club board as a `500`.

            Absent or `null` is a person the club has no address for, which a real member list
            has plenty of. The empty string is not that: it is a blank field somebody left behind,
            and it is refused. Leaving the field out of a correction is therefore how an address
            entered by mistake is taken away again.
          pattern: "[^\\u0000-\\u0020\\u007f-\\u009f@]+@[^\\u0000-\\u0020\\u007f-\\u009f@.]+(\\.[^\\u0000-\\u0020\\u007f-\\u009f@.]+)+"

    RosterEntry:
      type: object
      required: [personId, firstName, lastName, email, enabled, membershipCurrent, roles]
      properties:
        personId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: [string, "null"], format: email }
        accountId: { type: [string, "null"], format: uuid }
        username: { type: [string, "null"] }
        locale:
          type: [string, "null"]
          pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
          description: |
            The language the instance writes to this account in, and `null` for a person who holds
            no account. Read it together with `accountId`, the same way `username` is read.
        addressSharedBy:
          type: [integer, "null"]
          minimum: 1
          description: |
            How many people this instance holds at this email address, counting the person
            themselves, and `null` for a person the club has no address for. One address serving
            several accounts is by design — a parent registering for their children — so this is not
            a warning; it is the number that tells a family apart from an address entered by
            mistake, at the moment somebody is about to have a credential sent there.
        credentialState:
          type: [string, "null"]
          enum: [AWAITING_CREDENTIAL, CREDENTIAL_ISSUED, CREDENTIAL_EXPIRED, PASSWORD_CHOSEN, null]
          description: |
            Where the account stands between being created and being used, and `null` for a person
            who holds none.

            `AWAITING_CREDENTIAL` means nothing has been issued yet, or that what was issued has
            been withdrawn because the address it was sent to is no longer the person's.
            `CREDENTIAL_ISSUED` means one is out and has not been replaced; `CREDENTIAL_EXPIRED`
            means its deadline has passed and it no longer authenticates, while the account itself
            stays active and keeps its roles. `PASSWORD_CHOSEN` means the member has replaced it
            with one of their own.

            It says nothing about whether a message arrived: the instance hands a message over and
            does not learn what became of it.
        enabled:
          type: boolean
          description: |
            The account's state, not the person's. A person without an account is never enabled and
            is not thereby disabled — read it together with `accountId`.
        membershipCurrent:
          type: boolean
          description: |
            Whether the person holds a membership on the club's today. It is the field to read for
            "is this person a member": the period the other membership fields describe may have
            ended or may not have begun yet.
        membershipTypeId:
          type: [string, "null"]
          format: uuid
          description: |
            The type of one period of the person's membership: the period valid today, else the
            next one scheduled, else the latest that ended. `GET
            /api/admin/roster/{personId}/membership-periods` lists every period.
        membershipState:
          oneOf:
            - $ref: "#/components/schemas/MembershipPeriodState"
            - type: "null"
          description: Where that period stands on the club's today, `null` when the person holds none.
        membershipStartedOn:
          type: [string, "null"]
          format: date
          description: The first day of that period, absent when the person holds none.
        membershipEndedOn:
          type: [string, "null"]
          format: date
          description: |
            The first day that period no longer holds, absent while it runs without an end. It may
            lie in the future: a membership that ends in December still holds until then.
        roles:
          type: array
          description: |
            Ascending by role name, so a client may compare two entries without sorting them
            first and the order does not move when the enumeration grows.
          items: { $ref: "#/components/schemas/Role" }

    CredentialState:
      type: string
      description: |
        Where an account stands between being created and being used. `credentialState` on a
        roster entry says what each value means.
      enum: [AWAITING_CREDENTIAL, CREDENTIAL_ISSUED, CREDENTIAL_EXPIRED, PASSWORD_CHOSEN]

    RosterPage:
      type: object
      required: [entries, matching]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/RosterEntry" }
        matching:
          type: integer
          minimum: 0
          description: |
            How many people the criteria match across every page, not only this one. It is counted
            in its own statement, so a roster that changes between the two can make it differ from
            what paging through the list finds.
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: Pass this person id as `cursor` to continue after the current page.

    RosterSearchRequest:
      type: object
      description: |
        What narrows the roster, and why it is a body rather than a query string: a fragment of a
        name is the name of a person, and a URL reaches browser history, an intermediary's log and
        an operator's diagnostics, none of which the protections on a response body cover.
      properties:
        query:
          type: string
          maxLength: 60
          description: Matches against the person's full name, case-insensitively.
        membershipTypeId:
          type: string
          format: uuid
          description: |
            Only the people who hold this membership type **right now**. A membership that has
            ended does not match, even though the entry still names the type its holder last held
            — `membershipTypeId` on an entry answers "of what were they a member", and this
            field answers "of what are they one". Combining it with `query` narrows by both.
        currentMembers:
          type: boolean
          default: false
          description: |
            Only the people who hold a membership of any type **right now**, in the sense
            `membershipTypeId` uses. A membership that has ended does not match.
        role:
          $ref: "#/components/schemas/Role"
          description: Only people whose displayed account holds this role.
        credentialStates:
          type: array
          uniqueItems: true
          maxItems: 4
          items: { $ref: "#/components/schemas/CredentialState" }
          description: |
            Only people whose displayed account is in one of these states at the moment of the
            request, the same state `credentialState` on their entry reports. A person without an
            account has no state and never matches. Absent or empty narrows nothing. Everybody who
            has not yet chosen a password of their own is the three values other than
            `PASSWORD_CHOSEN`.
        sortBy:
          $ref: "#/components/schemas/RosterSortField"
          default: NAME
        sortDirection:
          $ref: "#/components/schemas/RosterSortDirection"
          default: ASC
        cursor:
          type: string
          format: uuid
          description: The `nextCursor` of the preceding page.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50

    RosterSortField:
      type: string
      description: |
        The visible roster column that determines page order. `ACCOUNT` orders active accounts,
        disabled accounts, then people without an account. `ROLES` compares the stable role codes.
        Missing usernames, memberships, and roles stay after populated values in both directions.
      enum: [NAME, USERNAME, ACCOUNT, MEMBERSHIP_TYPE, ROLES]

    RosterSortDirection:
      type: string
      description: The direction of the selected column; the person-id tie-breaker stays ascending.
      enum: [ASC, DESC]

    RosterExportRequest:
      type: object
      description: |
        The roster list's name and membership-type narrowing, plus what the receiving spreadsheet
        needs. It is a body for the reason above and not because the operation is a `POST`.
      properties:
        query:
          type: string
          maxLength: 60
          description: Matches against the person's full name, case-insensitively.
        membershipTypeId:
          type: string
          format: uuid
          description: Only the people who hold this membership type right now.
        sourceId:
          type: string
          format: uuid
          description: |
            The import source whose member numbers fill `memberNumber`. An unknown one is answered
            `404`, as it is everywhere else it names a source.
        separator:
          type: string
          pattern: '^[,;|\t]$'
          minLength: 1
          maxLength: 1
          default: ","
          description: |
            The single character between two cells. A club whose spreadsheet reads semicolons says
            so here; the default is a comma.
        encoding:
          type: string
          maxLength: 40
          default: "UTF-8"
          description: |
            One of the names `/api/admin/import/encodings` lists. That list answers the import,
            so a few of its names decode only and cannot write a file; asking one of them for an
            export is answered `400` for the same reason an unusable name is — it names a club's
            tooling and not a caller's bug.

    AccountRequest:
      type: object
      description: |
        The request carries no credential. The instance generates one when the account is created
        and sends it to the member, so nobody on the board chooses it, sees it or has to pass it on.
      required: [username, roles]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 60
          pattern: "^[a-z0-9._-]+$"
          description: |
            The login identifier, unique across the instance and suggested as `lastname.firstname`.
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }

    AccountLocaleRequest:
      type: object
      description: |
        The language the instance writes to this account in. It is stored on the account rather than
        kept in the browser, so a message reaches the member in the language they read and not in the
        one the club happens to default to.

        The pattern is the shape of a language tag, not the set of languages: which languages exist
        is a property of the image and is served as `supportedLocales` on the club configuration. A
        well-formed tag this instance ships no translation for is refused with
        `urn:courtside:error:language-unsupported`, which names the languages it does ship.
      required: [locale]
      properties:
        locale: { type: string, pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$" }

    UsernameRequest:
      type: object
      description: |
        The name replaces the one the account holds. Its shape is the one `AccountRequest`
        states, because a name a correction may produce and a name a creation may produce are
        the same identifier.
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 60
          pattern: "^[a-z0-9._-]+$"
          description: |
            The login identifier, unique across the instance and suggested as `lastname.firstname`.

    RolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }

    RuleSet:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }

    RuleSetRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60, pattern: ".*\\S.*" }

    RuleDefinition:
      type: object
      required: [ruleType, params]
      properties:
        ruleType: { $ref: "#/components/schemas/RuleType" }
        params:
          type: object
          additionalProperties: { type: integer }

    RuleTypeConfiguration:
      type: object
      required: [ruleType, configurable, parameters]
      properties:
        ruleType: { $ref: "#/components/schemas/RuleType" }
        configurable: { type: boolean }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/RuleParameter" }

    RuleParameter:
      type: object
      required: [name, minimum, maximum, kind]
      properties:
        name: { type: string }
        minimum: { type: integer }
        maximum: { type: integer }
        kind: { $ref: "#/components/schemas/RuleParameterKind" }

    RuleParameterKind:
      type: string
      description: |
        How a client reads a parameter's integer value. `NUMBER` is a plain count or length.
        `TIME_OF_DAY` counts minutes after midnight in the club's time zone, so 1200 is 20:00.
      enum: [NUMBER, TIME_OF_DAY]

    SetRuleRequest:
      type: object
      required: [params]
      properties:
        params:
          type: object
          additionalProperties: { type: integer }

    ParticipantRequest:
      type: object
      description: |
        Exactly one of the three is set. A member by id, a guest by name, or a participant card
        such as a ball machine, which occupies a place on court without being a person.
      properties:
        personId: { type: [string, "null"], format: uuid }
        guestName: { type: [string, "null"] }
        cardId: { type: [string, "null"], format: uuid }

    CreateBookingRequest:
      type: object
      required: [courtIds, cardId, startsAt, endsAt]
      properties:
        courtIds:
          type: array
          minItems: 1
          # A court's number is at most 999, so no club has more to book at once. The bound is
          # here because an array with none is a body of any size a caller cares to send.
          maxItems: 999
          uniqueItems: true
          items: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        startsAt:
          type: string
          format: date-time
          description: Must not be before the current instant.
        endsAt:
          type: string
          format: date-time
          description: Must be after `startsAt`.
        note: { type: [string, "null"], maxLength: 500 }
        participants:
          type: array
          # A card permits at most 20 players, so no court takes more.
          maxItems: 20
          items: { $ref: "#/components/schemas/ParticipantRequest" }

    JoinWaitlistRequest:
      type: object
      required: [courtId, cardId, startsAt, endsAt]
      properties:
        courtId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        startsAt:
          type: string
          format: date-time
          description: Must not be before the current instant.
        endsAt:
          type: string
          format: date-time
          description: Must be after `startsAt`.
        note: { type: [string, "null"], maxLength: 500 }
        participants:
          type: array
          # A card permits at most 20 players, so no court takes more.
          maxItems: 20
          items: { $ref: "#/components/schemas/ParticipantRequest" }

    WaitlistJoined:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }

    WaitlistEntryState:
      type: string
      enum: [WAITING, OFFERED, BOOKED, LEFT, EXPIRED, SKIPPED, WITHDRAWN, ENDED]
      description: |
        `WAITING` until the slot frees and it is this entry's turn, `OFFERED` while the slot is
        reserved for the member, then one closed state: booked, left or declined, expired, skipped
        because the member was no longer eligible or the offer could not reach them, withdrawn
        because the club took the court, or ended with the slot's start.

    WaitlistEntry:
      type: object
      required: [id, courtId, startsAt, endsAt, cardLabel, state]
      properties:
        id: { type: string, format: uuid }
        courtId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cardLabel: { type: string }
        state: { $ref: "#/components/schemas/WaitlistEntryState" }
        offerExpiresAt:
          type: [string, "null"]
          format: date-time
          description: When the offer ends, once one was made.
        bookingId:
          type: [string, "null"]
          format: uuid
          description: The booking an accepted offer or the member's own booking became.

    ReservedSlot:
      type: object
      required: [courtId, startsAt, endsAt]
      properties:
        courtId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        ownEntryId:
          type: [string, "null"]
          format: uuid
          description: The viewer's own entry holding this reservation; null for everybody else.

    BookingCreated:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }

    PersonalBooking:
      type: object
      required: [id, courtIds, startsAt, endsAt, cardLabel, cardColor, status]
      properties:
        id: { type: string, format: uuid }
        seriesId: { type: [string, "null"], format: uuid }
        courtIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cardLabel: { type: string }
        cardColor: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        note: { type: [string, "null"] }
        partnerSearch:
          $ref: "#/components/schemas/PartnerSearchState"
        checkIn:
          $ref: "#/components/schemas/CheckIn"
        released:
          type: boolean
          description: |
            True on a cancelled booking the club freed because nobody checked in by its release
            time. Absent otherwise.
        access:
          $ref: "#/components/schemas/AccessGrant"

    AccessGrant:
      type: object
      description: |
        The codes that open the access points of a confirmed booking whose card grants access,
        from the booking's start less the club's lead until its end plus the club's lag: static
        codes, and the booking's own code once the access-control system has accepted it.
        Present only while that window has not ended, and only to the booking's own people.
      required: [validFrom, validUntil, codes]
      properties:
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        codes:
          type: array
          description: Empty only while the booking's own code is pending.
          items: { $ref: "#/components/schemas/AccessCode" }
        codePending:
          type: boolean
          description: |
            True while the access-control system has not yet accepted the booking's own code.
            Absent otherwise.
        emergencyCodeKept:
          type: boolean
          description: |
            True when an access point of the booking keeps an emergency code its people may ask
            for during the window. Absent otherwise.

    EmergencyAccess:
      type: object
      description: The emergency codes of a booking's access points, never sent by mail.
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AccessCode" }

    OccupancyKeyStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        createdAt:
          type: string
          format: date-time
          description: When the current key was created. Absent without one.

    IssuedOccupancyKey:
      type: object
      required: [key, createdAt]
      properties:
        key:
          type: string
          description: The new key. It is shown this once and cannot be read back.
        createdAt: { type: string, format: date-time }

    AccessCode:
      type: object
      required: [accessPointName, code]
      properties:
        accessPointName: { type: string }
        code: { type: string, pattern: "^[0-9]{4,8}$" }

    CheckIn:
      type: object
      description: |
        Present on an upcoming confirmed booking while the club records attendance. The member who
        booked it checks in from `opensAt` until `closesAt`, the booking's end.
      required: [opensAt, closesAt, checkedIn]
      properties:
        opensAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        checkedIn: { type: boolean }

    AttendanceOutcome:
      type: string
      enum: [ATTENDED, NO_SHOW]

    AttendanceRequest:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: "#/components/schemas/AttendanceOutcome" }

    AttendancePolicy:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            Whether the club records attendance at all. Without it no check-in, no-show, release or
            no-show limit has any effect.
        releaseAfterMinutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 120
          description: |
            How long after its start a member booking nobody checked in for is cancelled and its
            court freed. `null` never releases one. It needs `enabled`.

    NoShow:
      type: object
      required: [bookingId, startsAt, endsAt]
      properties:
        bookingId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    NoShowsLifted:
      type: object
      required: [lifted]
      properties:
        lifted:
          type: integer
          minimum: 0
          description: How many recorded no-shows stopped counting.

    PartnerSearchState:
      type: string
      description: |
        Present only on a booking that holds the "looking for a partner" participant card and still
        stands before its start. `AVAILABLE` means its place could be offered, `PUBLISHED` that it is.
      enum: [AVAILABLE, PUBLISHED]

    OpenPlace:
      type: object
      required: [invitationId, courtIds, startsAt, endsAt, cardLabel]
      properties:
        invitationId: { type: string, format: uuid }
        courtIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cardLabel: { type: string }

    PersonalBookingView:
      type: string
      enum: [UPCOMING, CANCELLED, HISTORY]

    PersonalBookingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PersonalBooking" }
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: Pass this booking id as `cursor` to continue after the current page.
        refreshedAt:
          type: string
          format: date-time
          description: Instant at which this page was read from the booking ledger.
        timeZone:
          type: string
          description: Club time zone used to render the cached booking instants.
        courts:
          type: array
          description: Court labels needed to render this page without another request.
          items: { $ref: "#/components/schemas/PublicCourt" }
        clubName:
          type: string
          description: The club's display name, so an installed app opened offline can still say whose it is.

    Participation:
      type: object
      description: |
        One booking this member is recorded in but did not make. It names no person, by design:
        who else plays is not this member's to see on somebody else's booking.
      required: [id, courtIds, startsAt, endsAt, cardLabel, cardColor, status]
      properties:
        id: { type: string, format: uuid }
        courtIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cardLabel: { type: string }
        cardColor: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        access:
          $ref: "#/components/schemas/AccessGrant"

    ParticipationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Participation" }
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: Pass this booking id as `cursor` to continue after the current page.

    ManagedAppointment:
      type: object
      required: [id, cardId, courtIds, startsAt, endsAt, cardLabel, cardColor, status, participantCount,
                 ownBooking]
      properties:
        id: { type: string, format: uuid }
        seriesId: { type: [string, "null"], format: uuid }
        cardId: { type: string, format: uuid }
        courtIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cardLabel: { type: string }
        cardColor: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        participantCount: { type: integer, minimum: 0 }
        ownBooking:
          type: boolean
          description: |
            Whether the signed-in account holds the appointment. Only somebody else's appointment
            may be cancelled with a reason.

    ManagedAppointmentView:
      type: string
      enum: [UPCOMING, HISTORY]

    ManagedAppointmentPage:
      type: object
      required: [items, series]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ManagedAppointment" }
        series:
          type: array
          description: |
            The whole of every series an item on this page belongs to, counted over all its occurrences
            the caller manages rather than the ones this page holds.
          items: { $ref: "#/components/schemas/ManagedSeriesFacts" }
        nextCursor:
          type: [string, "null"]
          format: uuid

    ManagedSeriesFacts:
      type: object
      required: [seriesId, firstStartsAt, lastStartsAt, occurrences, cancelled, past]
      properties:
        seriesId: { type: string, format: uuid }
        firstStartsAt: { type: string, format: date-time }
        lastStartsAt: { type: string, format: date-time }
        occurrences:
          type: integer
          format: int32
          minimum: 1
        cancelled:
          type: integer
          format: int32
          minimum: 0
          description: Occurrences that were cancelled.
        past:
          type: integer
          format: int32
          minimum: 0
          description: Occurrences not cancelled that have already started.

    ManagedParticipantKind:
      type: string
      enum: [MEMBER, GUEST, CARD]

    ManagedParticipant:
      type: object
      required: [kind, displayName]
      properties:
        kind: { $ref: "#/components/schemas/ManagedParticipantKind" }
        displayName: { type: string }

    ManagedAppointmentDetail:
      allOf:
        - $ref: "#/components/schemas/ManagedAppointment"
        - type: object
          required: [participants]
          properties:
            note: { type: [string, "null"] }
            participants:
              type: array
              items: { $ref: "#/components/schemas/ManagedParticipant" }
            attendance:
              $ref: "#/components/schemas/AttendanceOutcome"

    Allocation:
      type: object
      description: One court's occupancy for one booking.
      required: [bookingId, courtId, startsAt, endsAt, cardLabel, cardColor, ownBooking, showGenericOccupancy]
      properties:
        bookingId: { type: string, format: uuid }
        courtId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cardLabel:
          type: string
          description: A neutral placeholder when generic occupancy hides the card from this viewer.
        cardColor:
          type: string
          description: A neutral colour when generic occupancy hides the card from this viewer.
        ownBooking:
          type: boolean
          description: True only when the authenticated viewer created this booking; always false anonymously.
        showGenericOccupancy:
          type: boolean
          description: Whether member-facing views use a neutral booked label instead of the card label.
        participantLastNames:
          type: [array, "null"]
          description: |
            Null unless the booking is the authenticated viewer's own member booking. Contains the
            last names of other member participants in entry order. The viewer and guests are omitted.
          items: { type: string }
        bookedByName:
          type: [string, "null"]
          description: |
            Null on every member-facing response, always. Participant names are not shown for
            someone else's booking — not to guests and not to members — and this is not a setting
            a club can switch on. Only the administrative views resolve a name.
        participantCount:
          type: [integer, "null"]
          format: int32
          minimum: 1
          description: Present for participant-based bookings; absent for named special occupancy.

    SeriesRuleRequest:
      type: object
      description: |
        A recurrence, ending either on a date or after a number of occurrences — exactly one of
        `endsOn` and `occurrenceCount` is given.
      required: [courtIds, cardId, startsOn, startTime, durationMinutes, intervalWeeks, weekdays]
      properties:
        courtIds:
          type: array
          minItems: 1
          # A court's number is at most 999, so no club has more to book at once. The bound is
          # here because an array with none is a body of any size a caller cares to send.
          maxItems: 999
          uniqueItems: true
          items: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        startsOn:
          type: string
          format: date
          description: Occurrences before the current instant cannot be created.
        startTime: { $ref: "#/components/schemas/LocalTime" }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        intervalWeeks: { type: integer, minimum: 1, maximum: 52 }
        weekdays:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/DayOfWeek" }
        endsOn:
          type: [string, "null"]
          format: date
          description: Not before `startsOn`. Mutually exclusive with `occurrenceCount`.
        occurrenceCount:
          type: [integer, "null"]
          minimum: 1
          maximum: 200
          description: Mutually exclusive with `endsOn`.
        note: { type: [string, "null"], maxLength: 500 }

    CreateSeriesRequest:
      description: |
        A recurrence together with the occurrences to actually write. Previewing needs only the
        recurrence; creating needs the caller's confirmation as well, which is why the two
        operations do not share one shape.
      allOf:
        - $ref: "#/components/schemas/SeriesRuleRequest"
        - type: object
          required: [confirmedStarts]
          properties:
            confirmedStarts:
              type: array
              minItems: 1
              # A series has at most occurrenceCount's maximum of occurrences, so it can confirm
              # no more than that many.
              maxItems: 200
              uniqueItems: true
              description: |
                Each entry must be one the preview actually offered — the creator decides which
                occurrences to keep, and nothing is written that they did not confirm.
              items: { type: string, format: date-time }

    SourceOffer:
      type: object
      required: [version, environment, sourceUrl]
      properties:
        version:
          type: string
          description: The version this instance was built as.
        commit:
          type: [string, "null"]
          description: |
            The commit it was built from, when the build had a repository to read. Absent for a
            build from a source archive, where the version is all there is to go on.
        environment:
          type: string
          enum: [PRODUCTION, UAT, DEVELOPMENT, PERFORMANCE, SECURITY]
          description: The deployment environment this instance identifies itself as.
        sourceUrl:
          type: string
          format: uri
          pattern: "^https?://.+"
          description: |
            Where the corresponding source of this version can be obtained. Absolute and
            resolvable by whoever reads it: an address only the club's own network can reach is
            not an offer to the club's members.
      example:
        version: "1.4.0"
        commit: "9f1c0e3a5b7d2f4681c9a0e5d3b7f2a4c6e8d0b1"
        environment: "PRODUCTION"
        sourceUrl: "https://example.org/git/courtside"

    Occurrence:
      type: object
      required: [startsAt, endsAt, blockedCourtIds, violations, creatable]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        blockedCourtIds:
          type: array
          items: { type: string, format: uuid }
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
        creatable: { type: boolean }

    SeriesPreview:
      type: object
      required: [occurrences, creatableCount, truncatedByHorizon]
      properties:
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/Occurrence" }
        creatableCount: { type: integer, format: int64 }
        truncatedByHorizon:
          type: boolean
          description: |
            True when the recurrence would run past the instance's horizon. Said here rather than
            on creation, because by then a dropped date was never among the confirmed occurrences
            to report against.
        horizonLimit: { type: [string, "null"], format: date }

    SeriesCreated:
      type: object
      required: [bookingIds, skipped]
      properties:
        seriesId:
          type: [string, "null"]
          format: uuid
          description: Null when nothing could be created; no empty series is left behind.
        bookingIds:
          type: array
          items: { type: string, format: uuid }
        skipped:
          type: array
          description: Occurrences a conflict or a rule kept from being created.
          items: { type: string, format: date-time }

    MoveRequest:
      type: object
      description: |
        A move is not a date-shift operation: each occurrence keeps its original local date. The
        supplied target defines its time of day, duration and courts, and must change at least one
        of them.
      required: [fromBookingId, scope]
      properties:
        fromBookingId: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/CancelScope" }
        newStartTime: { $ref: "#/components/schemas/NullableLocalTime" }
        newDurationMinutes: { type: [integer, "null"], minimum: 1 }
        newCourtIds:
          type: [array, "null"]
          minItems: 1
          maxItems: 999
          uniqueItems: true
          description: Absent leaves the courts as they are; empty is not a request that means anything.
          items: { type: string, format: uuid }

    Move:
      type: object
      required: [bookingId, fromStartsAt, fromEndsAt, toStartsAt, toEndsAt, blockedCourtIds, unbookableCourtIds, violations, executable]
      properties:
        bookingId: { type: string, format: uuid }
        fromStartsAt: { type: string, format: date-time }
        fromEndsAt: { type: string, format: date-time }
        toStartsAt: { type: string, format: date-time }
        toEndsAt: { type: string, format: date-time }
        blockedCourtIds:
          type: array
          items: { type: string, format: uuid }
        unbookableCourtIds:
          type: array
          items: { type: string, format: uuid }
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
        executable: { type: boolean }

    MovePreview:
      type: object
      required: [moves, executable]
      properties:
        moves:
          type: array
          items: { $ref: "#/components/schemas/Move" }
        executable: { type: boolean }

    MoveExecuted:
      type: object
      required: [moved]
      properties:
        moved: { type: integer }

    AffectedBooking:
      type: object
      required: [bookingId, courtIds, startsAt, endsAt]
      properties:
        bookingId: { type: string, format: uuid }
        courtIds:
          type: array
          items: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    Impact:
      type: object
      description: What a configuration change would hit, before it is made.
      required: [affectedCount, truncated, bookings]
      properties:
        affectedCount: { type: integer }
        truncated:
          type: boolean
          description: True when another page of affected bookings exists.
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: The cursor for the next page, or null when this is the final page.
        bookings:
          type: array
          items: { $ref: "#/components/schemas/AffectedBooking" }

    CourtUtilisation:
      type: object
      description: Confirmed court time intersecting the requested local-date period.
      required: [courtId, courtNumber, courtName, bookingCount, occupiedMinutes, occupiedOpenMinutes, occupancy]
      properties:
        courtId: { type: string, format: uuid }
        courtNumber: { type: integer, format: int32, minimum: 1, maximum: 999 }
        courtName: { type: [string, "null"] }
        bookingCount: { type: integer, format: int64, minimum: 0 }
        occupiedMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed minutes inside the period, whether or not the facility was open.
        occupiedOpenMinutes:
          type: integer
          format: int64
          minimum: 0
          description: The part of `occupiedMinutes` that falls inside the facility's opening hours.
        occupancy:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 1
          description: |
            `occupiedOpenMinutes` divided by the report's `openMinutes`: 0.25 means the court was
            held for a quarter of the time the facility was open. Null when the facility had no open
            minutes in the period.

    FacilityUtilisation:
      type: object
      description: |
        Booked occupancy for every court, including inactive courts and courts with no confirmed
        allocation in the period. Cancelled allocations do not contribute; closures are bookings and
        do. The dates are interpreted in `timeZone`; allocations crossing either boundary contribute
        only their intersecting minutes.
      required: [from, to, timeZone, openMinutes, courts]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timeZone: { type: string }
        openMinutes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Minutes the facility was open in the period, from the opening hours in force on each
            day. Each day's window is read as wall-clock time in `timeZone`, so a day
            that changes to or from daylight saving time counts the minutes that actually elapsed.
            The same for every court: the product keeps no dated court availability.
        courts:
          type: array
          items: { $ref: "#/components/schemas/CourtUtilisation" }

    UsageReport:
      type: object
      description: Aggregate usage of the courts in an inclusive local-date period of `timeZone`.
      required: [from, to, timeZone, capacity, cancellations, attendance, ruleRejections]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timeZone: { type: string }
        capacity: { $ref: "#/components/schemas/CapacityUsage" }
        cancellations: { $ref: "#/components/schemas/CancellationUsage" }
        attendance: { $ref: "#/components/schemas/AttendanceUsage" }
        ruleRejections: { $ref: "#/components/schemas/RuleRejectionUsage" }

    CapacityUsage:
      type: object
      description: |
        Which booking cards and membership types took the courts. `capacityMinutes` and
        `closedMinutes` are the open court minutes and the closed ones of the period, as the
        utilisation statistics count them.
      required: [capacityMinutes, closedMinutes, uses]
      properties:
        capacityMinutes: { type: integer, format: int64, minimum: 0 }
        closedMinutes: { type: integer, format: int64, minimum: 0 }
        uses:
          type: array
          items: { $ref: "#/components/schemas/CapacityUse" }

    CapacityUse:
      type: object
      description: |
        Confirmed bookings of one card whose holder holds one membership type, counted when that
        membership ran on the day the booking starts, so a type change counts each booking under the
        type held on its day. A holder without
        a running membership, or a booking without a holder, has no type.
        `bookedMinutes` sums the court minutes of those bookings, one court at a time. A group
        fewer than three accounts booked is not shown on its own: it joins the one row with
        `other` set, which has no card and no type, so the totals stay whole and nobody is singled out.
      required: [other, cardId, cardLabel, membershipTypeId, membershipTypeName, bookings, bookedMinutes, share]
      properties:
        other: { type: boolean }
        cardId: { type: [string, "null"], format: uuid }
        cardLabel: { type: [string, "null"] }
        membershipTypeId: { type: [string, "null"], format: uuid }
        membershipTypeName: { type: [string, "null"] }
        bookings: { type: integer, format: int64, minimum: 0 }
        bookedMinutes: { type: integer, format: int64, minimum: 0 }
        share:
          type: [number, "null"]
          format: double
          minimum: 0
          description: |
            `bookedMinutes` divided by the open court minutes that were not closed; `null` when there
            were none.

    CancellationUsage:
      type: object
      description: |
        Cancelled bookings, split by who cancelled them: the holder, the club on the holder's
        behalf, or the release of a booking nobody checked in for.
      required: [cancelled, byHolder, byClub, released, reasons, cards]
      properties:
        cancelled: { type: integer, format: int64, minimum: 0 }
        byHolder: { type: integer, format: int64, minimum: 0 }
        byClub: { type: integer, format: int64, minimum: 0 }
        released: { type: integer, format: int64, minimum: 0 }
        reasons:
          type: array
          description: The club's cancellations by the reason it gave; `reason` is absent for those without one.
          items: { $ref: "#/components/schemas/CancellationReasonCount" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/CardCancellations" }

    CancellationReasonCount:
      type: object
      required: [cancelled]
      properties:
        reason:
          $ref: "#/components/schemas/CancellationReason"
        cancelled: { type: integer, format: int64, minimum: 0 }

    CardCancellations:
      type: object
      description: |
        The cancellations of one card. A card fewer than three accounts held cancelled bookings of
        joins the one row with `other` set, which has no card.
      required: [other, cardId, cardLabel, cancelled, byHolder, byClub, released]
      properties:
        other: { type: boolean }
        cardId: { type: [string, "null"], format: uuid }
        cardLabel: { type: [string, "null"] }
        cancelled: { type: integer, format: int64, minimum: 0 }
        byHolder: { type: integer, format: int64, minimum: 0 }
        byClub: { type: integer, format: int64, minimum: 0 }
        released: { type: integer, format: int64, minimum: 0 }

    AttendanceUsage:
      type: object
      description: |
        What was recorded for the bookings. `noShows` still count towards the no-show limit,
        `liftedNoShows` were lifted by the board. A booking with nothing recorded counts in none of
        them. `tracked` says whether the club records attendance now.
      required: [tracked, attended, noShows, liftedNoShows]
      properties:
        tracked: { type: boolean }
        attended: { type: integer, format: int64, minimum: 0 }
        noShows: { type: integer, format: int64, minimum: 0 }
        liftedNoShows: { type: integer, format: int64, minimum: 0 }

    RuleRejectionUsage:
      type: object
      description: |
        Booking and cancellation attempts the club's rules refused. One attempt can break several
        rules, so the counts per rule may add up to more than `attempts`.
      required: [attempts, rules]
      properties:
        attempts: { type: integer, format: int64, minimum: 0 }
        rules:
          type: array
          items: { $ref: "#/components/schemas/RuleRejectionCount" }

    RuleRejectionCount:
      type: object
      required: [code, attempts]
      properties:
        code:
          type: string
          description: The violation code the refusal carried, as the client translates it.
        attempts: { type: integer, format: int64, minimum: 0 }

    StatisticsPeriod:
      type: object
      description: An inclusive range of local dates in `timeZone`.
      required: [from, to, timeZone]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timeZone: { type: string }

    StatisticsRange:
      type: object
      required: [firstBookingOn, today, timeZone]
      properties:
        firstBookingOn: { type: [string, "null"], format: date }
        today: { type: string, format: date }
        timeZone: { type: string }

    UtilisationTotals:
      type: object
      required: [openMinutes, courtCount, capacityMinutes, closedMinutes, bookedMinutes, occupancy]
      properties:
        openMinutes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Minutes the facility was open, from the opening hours in force on each day read as wall-clock
            time in the club time zone; a day that changes to or from daylight saving time counts
            the minutes that elapsed.
        courtCount:
          type: integer
          format: int32
          minimum: 0
          description: |
            Courts active now, plus inactive courts that held a confirmed allocation in the scope
            these totals cover.
        capacityMinutes:
          type: integer
          format: int64
          minimum: 0
          description: "`openMinutes` times `courtCount`."
        closedMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed closure minutes inside open time, over every court.
        bookedMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed minutes of every other card inside open time, over every court.
        occupancy:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 1
          description: |
            `bookedMinutes / (capacityMinutes - closedMinutes)`, and `null` when no court time was
            left to book.

    PreviousUtilisation:
      type: object
      description: The same totals for the equally long period that ends the day before `from`.
      required: [period, totals]
      properties:
        period: { $ref: "#/components/schemas/StatisticsPeriod" }
        totals: { $ref: "#/components/schemas/UtilisationTotals" }

    CourtStatistics:
      type: object
      required: [courtId, courtNumber, courtName, active, bookings, closedMinutes, bookedMinutes, occupancy]
      properties:
        courtId: { type: string, format: uuid }
        courtNumber: { type: integer, format: int32, minimum: 1, maximum: 999 }
        courtName: { type: [string, "null"] }
        active: { type: boolean }
        bookings:
          type: integer
          format: int64
          minimum: 0
          description: Distinct confirmed bookings other than closures holding this court in the period.
        closedMinutes: { type: integer, format: int64, minimum: 0 }
        bookedMinutes: { type: integer, format: int64, minimum: 0 }
        occupancy:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 1
          description: "`bookedMinutes / (openMinutes - closedMinutes)` for this court."

    CardUtilisation:
      type: object
      required: [cardId, label, color, closure, bookings, minutes]
      properties:
        cardId: { type: string, format: uuid }
        label: { type: string }
        color: { type: string }
        closure:
          type: boolean
          description: True for the card whose minutes are `closedMinutes`.
        bookings:
          type: integer
          format: int64
          minimum: 0
          description: Distinct confirmed bookings under this card holding a court in the period.
        minutes:
          type: integer
          format: int64
          minimum: 0
          description: Their minutes inside open time.

    HourUtilisation:
      type: object
      description: |
        One hour of the club-local week. A day that falls back from daylight saving time passes
        the repeated hour twice and counts both.
      required: [isoWeekday, hour, openMinutes, closedMinutes, bookedMinutes, occupancy]
      properties:
        isoWeekday: { type: integer, format: int32, minimum: 1, maximum: 7 }
        hour: { type: integer, format: int32, minimum: 0, maximum: 23 }
        openMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Facility open minutes in this hour over the period, for one court.
        closedMinutes: { type: integer, format: int64, minimum: 0 }
        bookedMinutes: { type: integer, format: int64, minimum: 0 }
        occupancy:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 1
          description: "`bookedMinutes / (openMinutes * courtCount - closedMinutes)`."

    UtilisationBucket:
      type: object
      required: [startsOn, endsOn, totals]
      properties:
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        totals: { $ref: "#/components/schemas/UtilisationTotals" }

    UtilisationProgression:
      type: object
      required: [granularity, buckets]
      properties:
        granularity:
          type: string
          enum: [WEEK, MONTH]
        buckets:
          type: array
          items: { $ref: "#/components/schemas/UtilisationBucket" }

    UtilisationStatistics:
      type: object
      required: [period, totals, previous, courts, cards, hours, progression]
      properties:
        period: { $ref: "#/components/schemas/StatisticsPeriod" }
        totals: { $ref: "#/components/schemas/UtilisationTotals" }
        previous:
          oneOf:
            - $ref: "#/components/schemas/PreviousUtilisation"
            - type: "null"
          description: "`null` when the preceding period would start before the year 0001."
        courts:
          type: array
          description: Every court in number order.
          items: { $ref: "#/components/schemas/CourtStatistics" }
        cards:
          type: array
          description: Every booking card, active or not.
          items: { $ref: "#/components/schemas/CardUtilisation" }
        hours:
          type: array
          description: All 168 hours of the week, Monday 0 o'clock first.
          items: { $ref: "#/components/schemas/HourUtilisation" }
        progression: { $ref: "#/components/schemas/UtilisationProgression" }

    BookingFigures:
      type: object
      required: [confirmed, cancelled, cancellationRate, series, single, withGuests, guestEntries]
      properties:
        confirmed: { type: integer, format: int64, minimum: 0 }
        cancelled: { type: integer, format: int64, minimum: 0 }
        cancellationRate:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 1
          description: "`cancelled / (confirmed + cancelled)`, and `null` without any booking."
        series:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed bookings that are an occurrence of a series.
        single: { type: integer, format: int64, minimum: 0 }
        withGuests:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed bookings with at least one guest.
        guestEntries:
          type: integer
          format: int64
          minimum: 0
          description: Guest entries across the confirmed bookings.

    PreviousBookingFigures:
      type: object
      required: [period, figures]
      properties:
        period: { $ref: "#/components/schemas/StatisticsPeriod" }
        figures: { $ref: "#/components/schemas/BookingFigures" }

    ParticipantCardUse:
      type: object
      required: [cardId, label, uses]
      properties:
        cardId: { type: string, format: uuid }
        label: { type: string }
        uses:
          type: integer
          format: int64
          minimum: 0
          description: Participant slots this card filled in confirmed bookings.

    BookingStatistics:
      type: object
      required: [period, figures, previous, participantCards]
      properties:
        period: { $ref: "#/components/schemas/StatisticsPeriod" }
        figures: { $ref: "#/components/schemas/BookingFigures" }
        previous:
          oneOf:
            - $ref: "#/components/schemas/PreviousBookingFigures"
            - type: "null"
          description: "`null` when the preceding period would start before the year 0001."
        participantCards:
          type: array
          description: Every participant card, active or not.
          items: { $ref: "#/components/schemas/ParticipantCardUse" }

    MemberFigures:
      type: object
      required: [members, joins, leavings, activeMembers, activeShare]
      properties:
        members:
          type: integer
          format: int64
          minimum: 0
          description: Memberships running on the period's last day.
        joins:
          type: integer
          format: int64
          minimum: 0
          description: Memberships that started in the period, without a period of the same person that directly precedes them.
        leavings:
          type: integer
          format: int64
          minimum: 0
          description: Memberships that ended in the period, without a period of the same person that directly follows them.
        activeMembers: { type: integer, format: int64, minimum: 0 }
        activeShare:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 1
          description: "`activeMembers / members`, and `null` without members."

    PreviousMemberFigures:
      type: object
      required: [period, figures]
      properties:
        period: { $ref: "#/components/schemas/StatisticsPeriod" }
        figures: { $ref: "#/components/schemas/MemberFigures" }

    MembershipTypeCount:
      type: object
      required: [membershipTypeId, name, members]
      properties:
        membershipTypeId: { type: string, format: uuid }
        name: { type: string }
        members:
          type: integer
          format: int64
          minimum: 0
          description: Running memberships of this type on the period's last day.

    AccountFigures:
      type: object
      description: Enabled accounts only.
      required: [accounts, passwordChosen, withoutChosenPassword, signedInWithin30Days,
                 signedInWithin90Days, neverSignedIn]
      properties:
        accounts: { type: integer, format: int64, minimum: 0 }
        passwordChosen:
          type: integer
          format: int64
          minimum: 0
          description: Accounts whose holder has set a password of their own.
        withoutChosenPassword:
          type: integer
          format: int64
          minimum: 0
          description: Accounts still awaiting, holding or past a one-time credential.
        signedInWithin30Days:
          type: integer
          format: int64
          minimum: 0
          description: Latest sign-in within the 30 days that end with the period's last day.
        signedInWithin90Days: { type: integer, format: int64, minimum: 0 }
        neverSignedIn: { type: integer, format: int64, minimum: 0 }

    MemberStatistics:
      type: object
      required: [period, figures, previous, membershipTypes, accounts]
      properties:
        period: { $ref: "#/components/schemas/StatisticsPeriod" }
        figures: { $ref: "#/components/schemas/MemberFigures" }
        previous:
          oneOf:
            - $ref: "#/components/schemas/PreviousMemberFigures"
            - type: "null"
          description: "`null` when the preceding period would start before the year 0001."
        membershipTypes:
          type: array
          description: Every membership type, active or not.
          items: { $ref: "#/components/schemas/MembershipTypeCount" }
        accounts: { $ref: "#/components/schemas/AccountFigures" }

    MessageKindCount:
      type: object
      required: [kind, queued, handedOver, refused, failed, retried]
      properties:
        kind: { $ref: "#/components/schemas/MessageKind" }
        queued: { type: integer, format: int64, minimum: 0 }
        handedOver: { type: integer, format: int64, minimum: 0 }
        refused: { type: integer, format: int64, minimum: 0 }
        failed: { type: integer, format: int64, minimum: 0 }
        retried:
          type: integer
          format: int64
          minimum: 0
          description: Messages of this kind whose first handover attempt failed and that were, or wait to be, tried again.

    PreviousMessageCounts:
      type: object
      required: [period, kinds]
      properties:
        period: { $ref: "#/components/schemas/StatisticsPeriod" }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/MessageKindCount" }

    MessageStatistics:
      type: object
      required: [period, kinds, previous]
      properties:
        period: { $ref: "#/components/schemas/StatisticsPeriod" }
        kinds:
          type: array
          description: Every message kind, in the order `MessageKind` declares them.
          items: { $ref: "#/components/schemas/MessageKindCount" }
        previous:
          oneOf:
            - $ref: "#/components/schemas/PreviousMessageCounts"
            - type: "null"
          description: "`null` when the preceding period would start before the year 0001."

    AuditEntry:
      type: object
      required: [id, occurredAt, eventType, parameters]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        eventType:
          type: string
          description: |
            The client resolves its message from this: `audit.event.${eventType}`. The key is
            derived rather than stored, so it never joins the contract that keeps stored rows
            readable.
        parameters:
          type: object
          additionalProperties: true
          description: The recorded payload, as the message's parameters.
        subjectId:
          type: [string, "null"]
          format: uuid
          description: |
            The entity the change concerns. Absent or `null` for an activity that concerns the
            whole instance rather than one entity, such as `dataexchange.log.exported`.
        subjectName:
          type: [string, "null"]
          description: |
            What the entity is called today, or `null` where nothing names it. A name is resolved
            for the configuration entities and for a person. A booking and a series are named by
            the courts they occupy, in court order. An account subject has no resolver, so its
            entries are always `null` while the account is very much alive. Read `null` as "not
            resolvable", never as "erased".
        subjectPeriod:
          oneOf:
            - $ref: "#/components/schemas/AuditSubjectPeriod"
            - type: "null"
          description: |
            The period a booking subject holds today, or the earliest occurrence a series subject
            holds today, cancelled ones included. It is today's state, not the state when the entry
            was recorded. Absent or `null` for every other subject and for a booking or series that
            nothing resolves.
        actorAccountId: { type: [string, "null"], format: uuid }
        actorUsername:
          type: [string, "null"]
          description: |
            The acting account's username, or `null` when no account acted, and when the account
            that acted was erased.

    AuditSubjectPeriod:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    MessageKind:
      type: string
      description: |
        What a message was. The client resolves its label from this; the value is the message's own
        name, not the reason another part of the instance had for asking.
      enum: [ACCOUNT_WELCOME, CREDENTIALS_NEW_ACCOUNT, CREDENTIALS_PASSWORD_RESET, ACCOUNT_USERNAME_REMINDER,
             ACCOUNT_PASSWORD_RESET_CODE, ACCOUNT_MFA_RECOVERY_CODE, ACCOUNT_SECURITY_CHANGED,
             ACCOUNT_FACTOR_GUESSING_BLOCKED, ACCOUNT_ADDRESS_CHANGED, BOOKING_CONFIRMED,
             BOOKING_PLAYER_RECORDED, BOOKING_PLAYER_WITHDREW, BOOKING_DISPLACED,
             BOOKING_REMINDER, BOOKING_CANCELLED, BOOKING_CANCELLED_BY_CLUB, BOOKING_RELEASED,
             BOOKING_SERIES_CREATED, BOOKING_SERIES_CANCELLED_BY_CLUB, BOOKING_SERIES_MOVED_BY_CLUB,
             WAITLIST_OFFER, BOOKING_PARTNER_FOUND, BOOKING_PLACE_TAKEN, ACCESS_CODE_CHANGED,
             ACCESS_CODE_READY, MEMBERS_DOOR_CODE_CHANGED]

    MessageTemplateLanguage:
      type: string
      description: A language the instance ships message wording in.
      enum: [de, en]

    MessageTemplateText:
      type: object
      required: [subject, body]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
          description: One line. Placeholders are written as `{name}`.
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: Plain text. Placeholders are written as `{name}`.

    MessageTemplateWording:
      type: object
      required: [language, shipped]
      properties:
        language: { $ref: "#/components/schemas/MessageTemplateLanguage" }
        shipped: { $ref: "#/components/schemas/MessageTemplateText" }
        own:
          oneOf:
            - $ref: "#/components/schemas/MessageTemplateText"
            - type: "null"
          description: The club's wording, or null while the shipped wording applies.

    MessageTemplate:
      type: object
      required: [kind, placeholders, requiredPlaceholders, languages]
      properties:
        kind: { $ref: "#/components/schemas/MessageKind" }
        placeholders:
          type: array
          description: Every placeholder the message fills, without braces.
          items: { type: string }
        requiredPlaceholders:
          type: array
          description: The placeholders a club wording of the body must keep.
          items: { type: string }
        languages:
          type: array
          items: { $ref: "#/components/schemas/MessageTemplateWording" }

    MessageChoice:
      type: object
      required: [kind, declinable, enabled]
      properties:
        kind: { $ref: "#/components/schemas/MessageKind" }
        declinable:
          type: boolean
          description: |
            False for what the club must be able to send: the credentials an account needs to sign
            in at all, the notice that a closure hit a booking, being told somebody wrote you
            into one, and being told the club cancelled or moved one.
        enabled:
          type: boolean
          description: Whether this account currently receives the kind.

    MessageChoiceRequest:
      type: object
      required: [declined]
      properties:
        declined:
          type: array
          items: { $ref: "#/components/schemas/MessageKind" }

    MessageChannel:
      type: string
      description: A way a message reaches a member besides the notification centre.
      enum: [EMAIL]

    MessageChannelChoice:
      type: object
      required: [channel, enabled]
      properties:
        channel: { $ref: "#/components/schemas/MessageChannel" }
        enabled:
          type: boolean
          description: Whether this account currently receives messages on the channel.

    MessageChannelChoiceRequest:
      type: object
      required: [declined]
      properties:
        declined:
          type: array
          items: { $ref: "#/components/schemas/MessageChannel" }

    Notification:
      type: object
      required: [id, kind, createdAt, link]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/MessageKind" }
        createdAt: { type: string, format: date-time }
        readAt:
          type: [string, "null"]
          format: date-time
          description: When the account first marked the entry read, or `null` while it is unread.
        booking:
          $ref: "#/components/schemas/NotificationBooking"
        closure:
          $ref: "#/components/schemas/NotificationClosure"
        cancellationReason:
          $ref: "#/components/schemas/CancellationReason"
        waitlistOffer:
          $ref: "#/components/schemas/NotificationWaitlistOffer"
        link: { $ref: "#/components/schemas/NotificationLink" }

    NotificationWaitlistOffer:
      type: object
      description: |
        The slot a `WAITLIST_OFFER` entry offered and whether the offer is still open. Absent once
        the entry is gone with its slot.
      required: [slot, expiresAt, open]
      properties:
        slot: { $ref: "#/components/schemas/NotificationBooking" }
        expiresAt: { type: string, format: date-time }
        open: { type: boolean }

    NotificationBooking:
      type: object
      description: |
        The booking an entry concerns as it stands now. It is absent when the entry concerns none,
        when the booking no longer exists, or when the account neither owns it nor plays in it any
        more. It names no person.
      required: [startsAt, endsAt, courts, cardLabel, cancelled]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        courts:
          type: array
          items: { $ref: "#/components/schemas/NotificationCourt" }
        cardLabel: { type: string }
        cancelled: { type: boolean }

    NotificationCourt:
      type: object
      required: [number]
      properties:
        number: { type: integer }
        name: { type: [string, "null"] }

    NotificationClosure:
      type: string
      description: Why a displaced booking no longer fits, present on `BOOKING_DISPLACED` entries only.
      enum: [COURT_OUT_OF_SERVICE, CARD_OUT_OF_SERVICE, DAY_CLOSED, HOURS_NARROWED, HOLIDAY, SEASON, COURT_CLOSED]

    NotificationLink:
      type: object
      description: |
        Where the entry leads, as one of the client's own pages rather than an address, so no entry
        can send a member off the instance. `bookingId` is present only while the booking exists and
        the account owns it or plays in it, `waitlistEntryId` only while the account's own entry
        exists.
      required: [target]
      properties:
        target:
          type: string
          enum: [BOOKINGS, ACCOUNT_SECURITY, WAITLIST]
        bookingId: { type: string, format: uuid }
        waitlistEntryId: { type: string, format: uuid }

    NotificationPage:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unread:
          type: integer
          format: int64
          minimum: 0
          description: How many of the account's entries are unread, counted over all of them and not only this page.
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: Pass this notification id as `cursor` to continue after the current page.

    MessageState:
      type: string
      description: |
        `HANDED_OVER` is where a message that went out rests. Handing a message to the mail server
        is not delivery, and this instance learns nothing after that point — a state claiming
        otherwise would claim knowledge nobody has.
      enum: [QUEUED, HANDED_OVER, REFUSED, FAILED]

    MessageEntry:
      type: object
      required: [id, queuedAt, kind, state, messageId, personId, personName]
      properties:
        id: { type: string, format: uuid }
        queuedAt: { type: string, format: date-time }
        settledAt:
          type: [string, "null"]
          format: date-time
          description: When the message reached the state it is in, and `null` while it is queued.
        kind: { $ref: "#/components/schemas/MessageKind" }
        state: { $ref: "#/components/schemas/MessageState" }
        messageId:
          type: string
          description: |
            The `Message-ID` this instance set before handing the message over. It is the only
            thread between this row and the mail server's own log, which is where an operator
            looks for what happened after the handover.
        reason:
          type: [string, "null"]
          description: |
            The kinds of failure the mail library reported, as type names — never the relay's own
            words, which are about an address this instance has no business storing verbatim.
        statusCode:
          type: [string, "null"]
          description: The SMTP status code the relay answered with, where it answered one.
        personId: { type: string, format: uuid }
        personName:
          type: string
          description: |
            Who was written to. An entry cannot outlive the account it names — the record is
            removed with it — so this is always a person the club can still open.

    MessagePage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/MessageEntry" }
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: Pass this entry id as `cursor` to continue after the current page.

    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: Pass this entry id as `cursor` to continue after the current page.
        searchIncomplete:
          type: boolean
          description: |
            True only when a text search reached its bounded server-side scan budget before it
            could prove that there are no more matches. Narrow the event type or time range.

    AuditSearchRequest:
      type: object
      description: |
        Criteria for the administrative change log. This is a request body because a search term
        can contain a person's name or username and must not reach browser history or access logs.
      properties:
        query:
          type: string
          maxLength: 60
          description: Matches subject names, actor usernames, and exact subject or actor ids, case-insensitively.
        eventType:
          type: string
          maxLength: 100
          description: Exact event type.
        subjectId: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        cursor: { type: string, format: uuid }
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50

    OperationalLogSource:
      type: string
      enum: [APPLICATION, DATABASE, PROXY]

    OperationalLogSeverity:
      type: string
      enum: [ERROR, WARN, INFO, DEBUG, UNKNOWN]

    OperationalLogAvailability:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]

    OperationalLogEntry:
      type: object
      required: [id, occurredAt, source, severity, message]
      properties:
        id: { type: string, format: uuid }
        occurredAt:
          type: string
          format: date-time
          description: Time at which the local collector received the record; supplied timestamps are not trusted.
        source:
          allOf: [{ $ref: "#/components/schemas/OperationalLogSource" }]
          description: Claimed service source from an unauthenticated local transport.
        severity: { $ref: "#/components/schemas/OperationalLogSeverity" }
        message: { type: string, maxLength: 8192 }
        traceId:
          type: [string, "null"]
          maxLength: 256
          pattern: "^[A-Fa-f0-9]{32}$"
          description: A W3C trace identifier. Values outside that closed shape are not retained.

    OperatorCheckState:
      type: string
      enum: [OK, FAILING, UNAVAILABLE]
      description: |
        `OK` passed. `FAILING` names where the failing dependency sits in `location`. `UNAVAILABLE`
        means the instance holds no evidence either way and is never a healthy result.

    OperatorCheckReason:
      type: string
      enum: [NOT_CONFIGURED, NOT_RECORDED, UNREADABLE, NOT_YET_OBSERVED, PENDING_MIGRATIONS,
             FAILED_MIGRATION, HANDOVER_FAILING, LAST_MESSAGE_FAILED, RECORDED_IN_THE_FUTURE]
      description: Why a check is not `OK`, as a code the client translates.

    OperatorHealth:
      type: object
      required: [checkedAt, version, migrations, mail, publicOrigin, backup]
      properties:
        checkedAt:
          type: string
          format: date-time
        version: { $ref: "#/components/schemas/OperatorVersionCheck" }
        migrations: { $ref: "#/components/schemas/OperatorMigrationCheck" }
        mail: { $ref: "#/components/schemas/OperatorMailCheck" }
        publicOrigin: { $ref: "#/components/schemas/OperatorPublicOriginCheck" }
        backup: { $ref: "#/components/schemas/OperatorBackupCheck" }

    OperatorVersionCheck:
      type: object
      required: [state, version, revision, builtAt]
      properties:
        state: { $ref: "#/components/schemas/OperatorCheckState" }
        version:
          type: string
        revision:
          type: [string, "null"]
          description: The source revision, or `null` when the build had no repository to read.
        builtAt:
          type: [string, "null"]
          format: date-time

    OperatorMigrationCheck:
      type: object
      required: [state, reason, currentVersion, expectedVersion, pending, location]
      properties:
        state: { $ref: "#/components/schemas/OperatorCheckState" }
        reason:
          oneOf:
            - $ref: "#/components/schemas/OperatorCheckReason"
            - type: "null"
          description: "`null` when the check is `OK`."
        currentVersion:
          type: [string, "null"]
          description: The newest migration the database records as applied.
        expectedVersion:
          type: [string, "null"]
          description: The newest migration this application ships.
        pending:
          type: integer
          minimum: 0
          description: Migrations this application ships that the database has not applied.
        location:
          type: [string, "null"]
          description: The migration version that failed or is the first still pending.

    OperatorMailCheck:
      type: object
      required: [state, reason, lastHandedOverAt, location]
      properties:
        state: { $ref: "#/components/schemas/OperatorCheckState" }
        reason:
          oneOf:
            - $ref: "#/components/schemas/OperatorCheckReason"
            - type: "null"
          description: "`null` when the check is `OK`."
        lastHandedOverAt:
          type: [string, "null"]
          format: date-time
          description: When the relay last accepted a message.
        location:
          type: [string, "null"]
          description: The configured relay as host and port, named when handover fails.

    OperatorPublicOriginCheck:
      type: object
      required: [state, reason, origin]
      properties:
        state: { $ref: "#/components/schemas/OperatorCheckState" }
        reason:
          oneOf:
            - $ref: "#/components/schemas/OperatorCheckReason"
            - type: "null"
          description: "`null` when the check is `OK`."
        origin:
          type: [string, "null"]
          description: The configured public address messages link to.

    OperatorBackupCheck:
      type: object
      required: [state, reason, completedAt, ageSeconds, location]
      properties:
        state: { $ref: "#/components/schemas/OperatorCheckState" }
        reason:
          oneOf:
            - $ref: "#/components/schemas/OperatorCheckReason"
            - type: "null"
          description: "`null` when the check is `OK`."
        completedAt:
          type: [string, "null"]
          format: date-time
          description: When the latest backup the operator recorded completed.
        ageSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
        location:
          type: [string, "null"]
          description: The configured evidence file, named when it cannot be read.

    OperationalLogSearchRequest:
      type: object
      properties:
        source: { $ref: "#/components/schemas/OperationalLogSource" }
        severity: { $ref: "#/components/schemas/OperationalLogSeverity" }
        from: { type: string, format: date-time }
        to:
          type: string
          format: date-time
          description: Exclude records observed at or after this instant.
        text:
          type: string
          maxLength: 200
          description: Case-insensitive message fragment; kept in the request body for privacy.
        traceId:
          type: string
          minLength: 32
          maxLength: 32
          pattern: "^[A-Fa-f0-9]{32}$"
          description: Exact case-insensitive trace identifier; kept in the request body for privacy.
        cursor: { type: string, format: uuid }
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }

    OperationalLogPage:
      type: object
      required: [entries, availability, retentionTruncated, searchIncomplete, droppedRecords]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/OperationalLogEntry" }
        nextCursor:
          type: [string, "null"]
          format: uuid
        availability: { $ref: "#/components/schemas/OperationalLogAvailability" }
        retentionTruncated:
          type: boolean
          description: Older records have been evicted by bounded rotation.
        searchIncomplete:
          type: boolean
          description: At least one retained record or byte was skipped or could not be validated.
        droppedRecords:
          type: integer
          format: int64
          minimum: 0
          description: Records the collector refused since its retained status was created.
        oldestAvailableAt:
          type: [string, "null"]
          format: date-time


    SubjectAccessReservation:
      type: object
      required: [courtId, startsAt, endsAt]
      properties:
        courtId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    SubjectAccessBooking:
      type: object
      required: [bookingId, createdAt, status, reservations]
      properties:
        bookingId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/BookingStatus" }
        cancelledAt: { type: [string, "null"], format: date-time }
        cancellationReason:
          $ref: "#/components/schemas/CancellationReason"
        note:
          type: [string, "null"]
          description: What this person wrote on the booking, and `null` where they wrote nothing.
        reservations:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessReservation" }
        partnerSearchPublishedAt:
          type: [string, "null"]
          format: date-time
          description: When this person offered the booking's open place to other members, and `null` while no offer stands.

    SubjectAccessParticipation:
      type: object
      required: [bookingId, status, reservations]
      description: |
        A booking this person is recorded in. It carries the court and the time and nothing about
        whoever made it: who booked, what they wrote on it and who else they named are that
        person's data, not this one's.
      properties:
        bookingId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BookingStatus" }
        reservations:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessReservation" }

    SubjectAccessActedForBooking:
      type: object
      required: [bookingId, holderPersonId, createdAt, status, reservations]
      description: |
        A booking this person made as guardian for somebody else, who holds it. The holder is
        named by id only, since their name is not this person's data.
      properties:
        bookingId: { type: string, format: uuid }
        holderPersonId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/BookingStatus" }
        reservations:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessReservation" }

    SubjectAccessWaitlistEntry:
      type: object
      required: [entryId, courtId, startsAt, endsAt, state, joinedAt]
      properties:
        entryId: { type: string, format: uuid }
        courtId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/WaitlistEntryState" }
        joinedAt: { type: string, format: date-time }
        offerExpiresAt: { type: [string, "null"], format: date-time }
        note: { type: [string, "null"] }

    SubjectAccessNamedInWaitlist:
      type: object
      required: [entryId, courtId, startsAt, endsAt]
      properties:
        entryId: { type: string, format: uuid }
        courtId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    SubjectAccessMembership:
      type: object
      required: [membershipTypeId, membershipType]
      properties:
        membershipTypeId: { type: string, format: uuid }
        membershipType:
          type: [string, "null"]
          description: The type's name today, or `null` once the type itself is gone.
        startedOn: { type: [string, "null"], format: date }
        endedOn:
          type: [string, "null"]
          format: date
          description: The date the membership ended, absent while it runs.

    SubjectAccessGuardianship:
      type: object
      required: [relationshipId, role, otherPersonId, grants, startedOn, endedOn]
      properties:
        relationshipId: { type: string, format: uuid }
        role:
          type: string
          enum: [GUARDIAN, DEPENDANT]
          description: Whether this person acts for the other or is acted for.
        otherPersonId: { type: string, format: uuid }
        grants:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/GuardianGrant" }
        startedOn: { type: string, format: date }
        endedOn:
          type: [string, "null"]
          format: date
          description: The first day the relationship no longer holds, `null` while it runs without an end.

    SubjectAccessAccount:
      type: object
      required: [accountId, username, locale, enabled, createdAt, credentialState, roles]
      properties:
        accountId: { type: string, format: uuid }
        username: { type: string }
        locale: { type: string }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        passwordChangeRequired: { type: boolean }
        credentialsExpireAt: { type: [string, "null"], format: date-time }
        lastLoginAt:
          type: [string, "null"]
          format: date-time
          description: The account's latest successful sign-in, null when it never signed in.
        credentialState:
          type: string
          enum: [AWAITING_CREDENTIAL, CREDENTIAL_ISSUED, CREDENTIAL_EXPIRED, PASSWORD_CHOSEN]
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }

    SubjectAccessExternalReference:
      type: object
      required: [sourceId, externalId, linkedAt]
      properties:
        sourceId: { type: string, format: uuid }
        externalId:
          type: string
          description: The identifier the club's other system knows this person by.
        linkedAt: { type: string, format: date-time }

    SubjectAccessChange:
      type: object
      required: [occurredAt, eventType, parameters]
      description: A recorded change this person is the subject of.
      properties:
        occurredAt: { type: string, format: date-time }
        eventType: { type: string }
        parameters:
          type: object
          additionalProperties: true
          description: The recorded payload, which describes this person alone.

    SubjectAccessAction:
      type: object
      required: [occurredAt, eventType]
      description: |
        A recorded change this person made. It names what they did and when, and never what was
        changed: the subject of such an entry is usually somebody else, and their record is not
        part of this answer.
      properties:
        occurredAt: { type: string, format: date-time }
        eventType: { type: string }

    SubjectAccessSeries:
      type: object
      required: [seriesId, createdAt, startsOn, startTime, durationMinutes, intervalWeeks,
                 weekdays]
      description: A recurring booking this person set up.
      properties:
        seriesId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        startsOn: { type: string, format: date }
        startTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        durationMinutes: { type: integer }
        intervalWeeks: { type: integer }
        weekdays:
          type: array
          description: Ascending ISO day numbers, Monday being 1.
          items: { type: integer, minimum: 1, maximum: 7 }
        endsOn: { type: [string, "null"], format: date }
        occurrenceCount: { type: [integer, "null"] }
        note: { type: [string, "null"] }

    SubjectAccessMessage:
      type: object
      required: [queuedAt, kind, state]
      description: |
        What became of one message this instance addressed to this person. It says what was sent
        and how it went, never what it said: the record holds no body and no address of its own.
      properties:
        queuedAt: { type: string, format: date-time }
        settledAt: { type: [string, "null"], format: date-time }
        kind: { $ref: "#/components/schemas/MessageKind" }
        state: { $ref: "#/components/schemas/MessageState" }
        reason:
          type: [string, "null"]
          description: The kinds of failure the mail library reported, where a handover failed.
        statusCode: { type: [string, "null"] }
        messageId: { type: [string, "null"] }

    SubjectAccessDeclinedMessage:
      type: object
      required: [kind, declinedAt]
      description: A kind of message this person asked not to receive.
      properties:
        kind: { $ref: "#/components/schemas/MessageKind" }
        declinedAt: { type: string, format: date-time }

    SubjectAccessNotification:
      type: object
      required: [kind, createdAt]
      description: |
        One entry of this person's notification centre: what it was, what it stored and whether
        they read it, not what it showed, because the entry holds no text of its own.
      properties:
        kind: { $ref: "#/components/schemas/MessageKind" }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        bookingId:
          type: string
          format: uuid
          description: The booking the entry concerns, as stored, whether or not it still exists.
        waitlistEntryId:
          type: string
          format: uuid
          description: The waitlist entry a waitlist offer concerns, as stored, whether or not it still exists.
        closure:
          $ref: "#/components/schemas/NotificationClosure"
        cancellationReason:
          $ref: "#/components/schemas/CancellationReason"

    SubjectAccessDeclinedChannel:
      type: object
      required: [channel, declinedAt]
      description: A channel this person asked to receive no messages on.
      properties:
        channel: { $ref: "#/components/schemas/MessageChannel" }
        declinedAt: { type: string, format: date-time }

    SubjectAccessExport:
      type: object
      required: [producedAt, personId, firstName, lastName, accounts, memberships, guardianships,
                 bookingsMade, bookingsActedFor, bookingsRecordedIn, bookingSeries, messages, declinedMessages,
                 notifications, declinedChannels, externalReferences, changesAsSubject, changesAsActor,
                 waitlistEntries, waitlistsNamedIn]
      description: |
        Everything this instance holds about one person, and nothing it holds about anybody else.
      properties:
        producedAt: { type: string, format: date-time }
        personId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: [string, "null"], format: email }
        accounts:
          type: array
          description: |
            Every account this person holds, and empty for a person who holds none. Usually one,
            but this instance permits a person to hold a dormant account beside a current one, and
            an answer that named only the one representing them elsewhere would leave the other
            out. Ordered as the roster orders them: the enabled ones first, oldest first within.
          items: { $ref: "#/components/schemas/SubjectAccessAccount" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessMembership" }
        guardianships:
          type: array
          description: |
            Every guardian relationship the person takes part in, as guardian or as dependant. The
            other person is named by id only, since their name is not this person's data.
          items: { $ref: "#/components/schemas/SubjectAccessGuardianship" }
        bookingsMade:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessBooking" }
        bookingsActedFor:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessActedForBooking" }
        bookingsRecordedIn:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessParticipation" }
        bookingSeries:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessSeries" }
        waitlistEntries:
          type: array
          description: Every stored waitlist entry the person's accounts made, closed ones included.
          items: { $ref: "#/components/schemas/SubjectAccessWaitlistEntry" }
        waitlistsNamedIn:
          type: array
          description: |
            Waitlist entries somebody else made naming this person as a player, with the court and
            time only.
          items: { $ref: "#/components/schemas/SubjectAccessNamedInWaitlist" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessMessage" }
        declinedMessages:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessDeclinedMessage" }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessNotification" }
        declinedChannels:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessDeclinedChannel" }
        externalReferences:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessExternalReference" }
        changesAsSubject:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessChange" }
        changesAsActor:
          type: array
          items: { $ref: "#/components/schemas/SubjectAccessAction" }

  headers:
    Location:
      description: Where the created resource can be read.
      required: true
      schema: { type: string, format: uri-reference }

  responses:
    Unauthenticated:
      description: No session, or a session that has ended.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Refused, because a state-changing request carries no valid CSRF token or the caller may not do this.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such thing.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Invalid:
      description: The request was understood and rejected.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: The request's content type is not one this operation consumes.
      headers:
        Accept:
          description: The media types the operation does consume.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request collides with the current state; the problem `type` names the case.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: The upload is larger than this instance accepts.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: |
        Too many requests. Every operation a handler serves can answer this when the caller has spent its
        request budget (`urn:courtside:error:request-rate-limited`) or when the operation's class
        is already running as often as the instance allows
        (`urn:courtside:error:operation-capacity-exhausted`). Protected operations add their own
        types, such as `urn:courtside:error:login-rate-limited`.
      headers:
        Retry-After:
          description: Seconds until another attempt may be made.
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: A required external service could not complete this operation safely.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

paths:

  /api/source:
    get:
      tags: [source]
      operationId: getSourceOffer
      summary: The running version and where its source can be had.
      description: |
        Courtside is AGPL-3.0. A club that modified it and runs it for its members owes those
        members the source of the modified version, and this is where an instance says which
        version that is and where to get it. The reference deployment requires an explicit
        `sourceUrl`; an unchanged installation points it at the upstream repository and a club
        that forked points it at the corresponding source of that fork.

        Public and unauthenticated on purpose: the obligation is to the people using the service,
        and requiring an account to see it would defeat it.
      security: []
      responses:
        "200":
          description: What this instance is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceOffer" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/openapi.yaml:
    get:
      tags: [documentation]
      operationId: getApiDocument
      summary: This document, as served by this instance.
      description: |
        Clubs update on their own schedule, so the contract an instance answers to may be older
        than the one in the project's repository. This is the one that binds here.
      security: []
      responses:
        "200":
          description: The API document.
          content:
            application/yaml:
              schema: { type: string }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/session:
    get:
      tags: [session-status]
      operationId: getSessionStatus
      summary: Report the current browser session.
      responses:
        "200":
          description: The current authentication state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionStatus" }
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [session]
      operationId: logIn
      summary: Log in.
      description: |
        Form-encoded, not JSON: this is Spring Security's form login, and the encoding is part of
        the contract rather than an accident.

        A `GET /api/session` beforehand issues the readable `__Host-XSRF-TOKEN` cookie whose value
        this request must echo in `X-XSRF-TOKEN`. Local HTTP development uses the unprefixed cookie
        name. Without it the answer is `403` with the `urn:courtside:error:access-denied` problem
        type, before any credential is checked.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in. The session cookie is set.
          headers:
            X-Courtside-Password-Change-Required:
              description: |
                Present and `true` while the account still holds a one-time password. Reading this
                status, replacing the password and signing out are what the session can do until
                the replacement succeeds; every other operation answers 403.
              schema: { type: boolean }
        "202":
          description: The password was accepted. Complete MFA before the session grants account access.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/session/mfa:
    post:
      tags: [session-mfa]
      operationId: completeMfaLogin
      summary: Complete a pending password login with TOTP or a single-use recovery code.
      description: |
        The pending browser session binds the account and its expiring challenge. A successful
        proof replaces the session identifier and grants the account's current privileges.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeProof" }
      responses:
        "200":
          description: Both factors succeeded. The replacement session cookie is set.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/session/logout:
    post:
      tags: [session]
      operationId: logOut
      summary: Log out and end the session.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Logged out.
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/session/reauthentication:
    post:
      tags: [session-reauthentication]
      operationId: reauthenticate
      summary: Prove the current account's authentication factors again.
      description: |
        A successful proof is retained only in this server-side session for five minutes. Courtside
        requires the account password and, for an MFA-enabled account, an enrolled second factor
        or single-use recovery code.

        An account still marked for an initial password change is refused here. Nothing the proof
        unlocks is reachable in that state, so the proof is not either.

        A successful proof replaces the session and answers with a new session cookie. The
        identifier that was presented stops authorizing immediately, so a client that manages
        cookies itself has to carry the replacement forward. The signed-in account and the browser
        the session records travel to the replacement; its absolute lifetime starts again, the way
        a sign-in's does.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticationRequest" }
      responses:
        "204":
          description: |
            A replacement session carries the recent full-authentication proof, and its
            identifier is delivered in the session cookie.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/account-recovery/password:
    post:
      tags: [account-recovery]
      operationId: requestPasswordReset
      summary: Ask the instance to mail a code for setting a new password.
      description: |
        The unauthenticated counterpart to the request a board makes through the roster. A member
        who cannot sign in asks here, and the instance mails a single-use code to the address on
        the account. **Nothing about the account changes.** The password it has keeps working, its
        sessions keep running, and only `/api/account-recovery/password/redemption` — which needs
        the code — changes anything. So an unsolicited request costs its target one message and
        nothing else.

        The code is eight characters, mailed grouped as `ABCD-EFGH`, and it expires after a period
        the club configures. Asking again replaces whatever code was outstanding.

        The answer is `202` whether or not the name belongs to an account, and it carries no body.
        Asking must not be a way to learn who belongs to this club, so status, headers and body say
        the same thing either way. A deactivated account and one whose person has no address are
        answered the same way and send nothing.

        A member who knows their address but not their name asks
        `/api/account-recovery/usernames` first. That operation mails nothing an account can be
        changed with.

        Three limits bound this operation and only two of them are visible. An account may be
        mailed a limited number of codes per window; reaching it is answered `202` like everything
        else, because a `429` from it would confirm that the submitted name belongs to somebody.
        The other two are answered `429` with
        `urn:courtside:error:account-recovery-rate-limited` and carry `Retry-After`: one counts
        what the caller's own address submits, the other counts what anybody submits for this
        subject, so a name that matches nothing still meets a limit. Neither reads the account, so
        neither says whether one exists — but the second is shared, so it can also be met because
        somebody else asked for the same name.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202":
          description: |
            The request was accepted. Whether a message follows is deliberately not said.
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/accounts/{accountId}/mfa:
    get:
      tags:
      - mfa-recovery
      operationId: getAdministrativeMfaStatus
      summary: Read an account's MFA and controlled recovery state.
      description: Requires the administrator role. Never reveals methods, labels, setup secrets or recovery codes.
      security:
      - sessionCookie: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Only the account's enabled and recovery-block flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaAdministrativeStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/admin/accounts/{accountId}/mfa-recovery:
    post:
      tags:
      - mfa-recovery
      operationId: initiateMfaRecovery
      summary: Block an account and mail a controlled recovery code after an identity check.
      description: Requires an enabled MFA administrator with fresh password and factor proof. Existing methods remain
        until successful redemption.
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRecoveryInitiation'
      responses:
        '202':
          description: The account is blocked and a recovery message is queued.
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/account-recovery/mfa/redemption:
    post:
      tags: [mfa-recovery]
      operationId: redeemMfaRecovery
      summary: Choose a permanent password and remove lost factors using the mailed recovery code.
      description: The blocked holder supplies their username, current single-use rescue code and a new permanent password. Ordinary password recovery cannot clear the block or remove factors.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaRecoveryRedemption" }
      responses:
        "204": { description: "The new password is set, all factors removed and every old session revoked." }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/account-recovery/password/redemption:
    post:
      tags: [account-recovery]
      operationId: redeemPasswordReset
      summary: Set a new password with the code that was mailed.
      description: |
        The only operation of this pair that changes an account, and the reason the request above
        changes none. Presenting the code proves that whoever asks reads the address the account
        carries; the new password is set in the same request, the account's sessions all end, and
        the code is gone afterwards.

        An account that had never chosen a password is served too: redeeming clears the
        requirement to replace an issued credential and the expiry that went with it, so a member
        whose invitation expired before they used it does not need their board.

        A code nobody holds, a code already redeemed and a code whose account can no longer be
        reached all answer `urn:courtside:error:account-recovery-code-invalid`. One that was valid
        and is past its expiry answers `urn:courtside:error:account-recovery-code-expired`,
        because "ask for another one" is different advice from "check what you typed".

        The password is held to the same rules as every other password this instance stores, and
        answered with `urn:courtside:error:password-too-guessable`, which names no individual
        rule. A password that is the one the account already holds is answered that way too, and
        deliberately not with the `urn:courtside:error:password-reuses-credential` the
        authenticated change uses: nobody proved the current password to reach this operation, so
        a type of its own would tell whoever holds the code what that password is. A breach lookup
        that does not answer refuses the change with `503` rather than storing something
        unchecked, and leaves the code unspent like every other refusal. **A password these rules refuse
        does not spend the code** — the member corrects it and sends again.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRedemptionRequest" }
      responses:
        "204":
          description: The password is set and every session for the account has ended.
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/account-recovery/usernames:
    post:
      tags: [account-recovery]
      operationId: requestUsernameReminder
      summary: Ask the instance which account names an address holds.
      description: |
        An email address is not an identifier here: a family enrols several children under one
        parent's address, so one address can hold several accounts. Somebody who has forgotten
        their password has usually forgotten the name they sign in with, and this operation
        answers that without touching anything.

        Every account registered to the address receives one message naming the account it belongs
        to. No credential is issued, no session ends, and no account state changes, so a shared
        address cannot cost a parent their password because a child asked.

        The answer is `202` whether or not the address holds an account, and it carries no body,
        for the same reason as the operation above. The same two visible windows bound it — one on
        the caller's address, one on the submitted address as a subject — and both are answered
        `429` with `urn:courtside:error:account-recovery-rate-limited`. There is no third: this
        operation issues nothing, so no issuing window applies.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsernameReminderRequest" }
      responses:
        "202":
          description: |
            The request was accepted. Whether any message follows is deliberately not said.
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/account/initial-password:
    put:
      tags: [account]
      operationId: changeInitialPassword
      summary: Replace the one-time bootstrap password.
      description: |
        Available only to an authenticated account marked for an initial password change. The
        successful change ends every active session for the account; sign in again with the new
        password.

        The password is refused with `urn:courtside:error:password-too-guessable` when it appears
        on a public list of common passwords, or when it contains the account's username, the
        member's own name, the local part of its email address, or the club name. One type answers
        for all of them, so the response never says which one matched. Repeating the one-time
        password this instance issued is refused with
        `urn:courtside:error:password-reuses-credential`, which says so plainly because the member
        has to be told something different. Nothing else about the password is required: any
        composition and any alphabet within the length bounds is accepted.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InitialPasswordChangeRequest" }
      responses:
        "204":
          description: Changed. The current session has ended.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/account/password:
    put:
      tags: [account]
      operationId: changeOwnPassword
      summary: Replace the signed-in account's permanent password.
      description: |
        The current password proves the request. The replacement uses the same common, contextual
