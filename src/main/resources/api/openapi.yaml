        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/opening-hours/{day}:
    put:
      tags: [admin-opening-hours]
      operationId: setOpeningHours
      summary: Set one weekday's window.
      description: |
        To open the courts early for a tournament, change the day's window rather than booking
        around it — the window binds everyone, including an admin.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: day
          in: path
          required: true
          schema: { $ref: "#/components/schemas/DayOfWeek" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetOpeningHoursRequest" }
      responses:
        "200":
          description: Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpeningHours" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [admin-opening-hours]
      operationId: closeDay
      summary: Close a weekday entirely.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: day
          in: path
          required: true
          schema: { $ref: "#/components/schemas/DayOfWeek" }
      responses:
        "204":
          description: Closed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

