  /api/admin/rule-sets/{id}/rules/{ruleType}:
    put:
      tags: [admin-rule-sets]
      operationId: setRule
      summary: Configure one rule of a rule set.
      description: |
        Rules are data, not code: a rule is a row with parameters, and which parameters a type
        accepts is defined by the type. An unknown parameter is refused rather than ignored.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: ruleType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/RuleType" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetRuleRequest" }
      responses:
        "200":
          description: Configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleDefinition" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin-rule-sets]
      operationId: removeRule
      summary: Remove a rule from a rule set.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: ruleType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/RuleType" }
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

