        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster-search:
    post:
      tags: [admin-roster]
      operationId: searchRoster
      x-courtside-state-invariant: true
      summary: The club's people, with their account and membership when they have one.
      description: |
        A person exists without an account — children and dormant records from a membership import
        have none — so `accountId`, `username` and `roles` are absent for them and `enabled` reports
        the account's state only where one exists.

        The default order is last name, then first name. Every requested order uses person id as a
        deterministic tie-breaker, and `cursor` continues after the entry it names in that order.
        A cursor naming somebody the filtered roster no longer holds is answered `400` rather than
        silently ending the list, because a truncated page is the one wrong answer a client cannot
        detect. The check and page are separate statements, so a concurrent removal after the check
        can still produce an empty final page. An unknown membership type is not an error: nobody
        holds it, so the page is empty.

        Reading the roster is a `POST` because the criteria name a person and a criterion in a URL
        outlives the request in places a response body never reaches. It changes nothing, and
        `SafeMethodStateInvarianceTest` holds it to that alongside the safe methods.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RosterSearchRequest" }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterPage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}:
    get:
      tags: [admin-roster]
      operationId: readPerson
      summary: Read one person.
      description: |
        The entry the roster list carries, for one person. The list can already answer this by
        paging to the right entry; naming a person directly is what lets an administrative surface
        give them an address of their own, so that a reloaded page and a shared link both resolve.
      security:
        - sessionCookie: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [admin-roster]
      operationId: changePerson
      summary: Correct a person's name or email address.
      description: |
        The account and the membership the person holds are untouched; this changes the person
        record alone. Every field is written, so a request that leaves `email` out removes the
        address the person carried - unless they hold an account, which is reached by mail and
        would become unrecoverable. That is answered `400` with
        `urn:courtside:error:account-needs-address`; correcting the address is always allowed.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.

        The account that took the preview is the only account that may execute it. Another
        administrator receives `409` with `urn:courtside:error:import-preview-actor-mismatch` and
        the preview remains available to its reviewer.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonRequest" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/account:
    post:
      tags: [admin-roster]
      operationId: createAccount
      summary: Give a person a user account.
      description: |
        The account is enabled at once and the instance sends its first credential to the member
        without anybody on the board seeing it. Until that credential is replaced the account can
        reach nothing else, which is the state the bootstrap administrator starts in as well.

        A person holds at most one account here. Every write on this surface names an account by
        its person, so a second one would be unreachable through the surface that created it and
        disabling the person would leave it signed in; a person who already holds one is answered
        `409`. A username the instance already holds is answered `409` too, and the two carry
        different problem types.

        **The person needs an email address.** Everything that grants or restores access travels by
        mail - the first credential and every later one - so an account without one could never be
        reached at all. A person who holds none is answered `400` with
        `urn:courtside:error:account-needs-address`, and for the same reason a correction may not
        take the address away from a person who already holds an account.

        No `Location`: an account has no address of its own, and the roster entry in the response
        body is where its state is read.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/account/roles:
    put:
      tags: [admin-roster]
      operationId: changeAccountRoles
      summary: Replace the roles of a person's account.
      description: |
        The roles sent replace the ones the account holds. Removing one ends that account's
        sessions: a session carries the roles it was signed in with, so a demotion that waits for
        the session to expire is not a demotion. Adding one ends nothing.

        `ADMIN` may be taken from an account once another enabled account holds it, so an officer
        can step down and a board can demote a former one. Taking it from the last enabled account
        that holds it is answered `409`, because the instance would then have nobody who could
        give it back.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolesRequest" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The instance would be left without an enabled administrator.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/account/username:
    put:
      tags: [admin-roster]
      operationId: changeAccountUsername
      summary: Correct the username of a person's account.
      description: |
        A username mistyped at creation is otherwise permanent: nothing else on this surface can
        reach it, and the person, their roles, their state and their password are untouched here.

        The correction ends the account's sessions. A session is recognised by the username it was
        signed in with, so one left standing would be signed in under a name the instance no longer
        knows. Sending the name the account already holds changes nothing, leaves its sessions
        alone and is answered `200` rather than a `409` against itself.

        A username another account holds is answered `409` with the same problem type
        `POST /api/admin/roster/{personId}/account` answers with.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsernameRequest" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/account/locale:
    put:
      tags: [admin-roster]
      operationId: changeAccountLocale
      summary: Correct the language a person's account is written to in.
      description: |
        A member who cannot reach the choice themselves, or one whose language was wrong from the
        start, is otherwise written to in a language they may not read. The person, their roles,
        their state and their password are untouched here, and the account's sessions are left
        alone: the language decides what a message says, not what an account may do.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountLocaleRequest" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/account/credentials:
    post:
      tags: [admin-roster]
      operationId: requestAccountCredentials
      summary: Have the instance send this account new credentials.
      description: |
        The instance generates the credential and sends it to the member. Nobody on the board
        chooses it, sees it, or has to pass it on, and it appears in no response, log or problem
        detail. The account keeps its username, its roles and its state.

        One action covers every case a board reaches for: a message that never arrived, a deadline
        that passed, and a member who no longer knows their own password. Which of the two
        configured lifetimes applies is read from the account rather than chosen by the caller —
        everything short of a password the member picked themselves is still the invitation, and
        keeps the longer window a club set for one.

        Whatever was issued before stops working, and the account's sessions end with it: the
        message may be sitting in a mailbox that is not the member's, which is the case this
        answers.

        `POST`, because each call issues something new rather than writing a state twice.

        A deactivated account is answered `409` with `urn:courtside:error:account-deactivated`, and
        one whose person has no address with `urn:courtside:error:account-address-missing`. Neither
        can be reached, and a message telling somebody their access is ready when it is not is worse
        than none.

        The answer says the request was accepted, not that anything has been sent: the message is
        handed over afterwards, and `credentialState` is what says it went out. Issuing and sending
        are one transaction, so a credential nobody received never replaces the one on file.

        How often credentials may be requested for one account within a configured window is
        limited — requests, not deliveries — and the excess call is answered `429` with
        `urn:courtside:error:credential-issue-rate-limited`. The account is the unit, so one
        member's mailbox cannot be filled and no member's issuing blocks another's.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/account/sessions:
    delete:
      tags: [admin-roster]
      operationId: endAccountSessions
      summary: End every session of one account.
      description: |
        Requires a full re-authentication no older than five minutes. The account's durable
        security epoch advances before its stored sessions are removed, so an in-flight request
        cannot restore stale authority.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Every session of the account ended.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/sessions:
    delete:
      tags: [admin-roster]
      operationId: endAllSessions
      summary: End every account session in the instance.
      description: |
        Requires a full re-authentication no older than five minutes. The response may complete;
        the initiating administrator's session is then invalid as well. No second operator is
        required.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Every session ended after this response completed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/account/active:
    put:
      tags: [admin-roster]
      operationId: setAccountActive
      summary: Enable or disable a person's account.
      description: |
        Disabling ends the account's sessions and refuses its next request; the person, their
        membership and their bookings are untouched. Enabling ends nothing.

        Disabling the last enabled account holding `ADMIN` is answered `409`, for the reason
        `PUT .../account/roles` gives.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActiveRequest" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The instance would be left without an enabled administrator.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/membership:
    put:
      tags: [admin-roster]
      operationId: assignMembership
      summary: Give a person a membership, move them to another type, or correct its dates.
      description: |
        Writes one period of the person's membership, as `MembershipRequest` describes: a type
        change opens the new type from today and keeps the old one as its own period, and a
        person who rejoins gains a new period beside the one that ended. A type picked by mistake
        is corrected on the period itself.

        The type has to be one the club still offers whenever the write leaves somebody a member of
        a type they did not already hold. A deactivated type is refused there, which is what its
        `active` flag is for. Everything that does not make somebody a member is left alone:
        correcting the dates of a period on a retired type stays possible, and ending one is never
        refused for the type it is on.

        A membership decides which rules the person's bookings are measured against, so a write
        that changes the type or whether they are a member today ends their account's sessions and
        they sign in again. A person without an account has none to end.

        The response is the roster entry.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipRequest" }
      responses:
        "200":
          description: Assigned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such person, or no such membership type.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            The membership type is no longer offered
            (`urn:courtside:error:membership-type-inactive`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [admin-roster]
      operationId: removeMembership
      summary: End a person's membership today.
      description: |
        The person, their account, their bookings and the record of their past periods stay. The
        period valid today ends today in the club's time zone, so it no longer holds from today on,
        and every period scheduled to begin after today is removed, each removal recorded in the
        audit log. Nothing else is deleted.

        Use `PUT` to end a membership on another date, or the periods under
        `/api/admin/roster/{personId}/membership-periods` to correct a date recorded wrongly.
        Ending a membership the person does not hold is the state the request asks for and answers
        the same way.

        Their account's sessions end, for the reason the assignment gives.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Ended.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/membership-periods:
    get:
      tags: [admin-roster]
      operationId: listMembershipPeriods
      summary: Every period of a person's membership, oldest first.
      description: |
        The periods never overlap. One of them may be valid today, earlier ones have ended and
        later ones are scheduled; a period scheduled ahead grants nothing until its first day.
      security:
        - sessionCookie: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The periods, ascending by their first day.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MembershipPeriod" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [admin-roster]
      operationId: addMembershipPeriod
      summary: Add a period to a person's membership, also one that begins or ends in the future.
      description: |
        The period may not overlap another of the same person; one ending on the day the next
        begins does not. The person's account sessions end, because the rules their bookings are
        measured against may change.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipPeriodRequest" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPeriod" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such person, or no such membership type.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            The period overlaps another (`urn:courtside:error:membership-periods-overlap`), or the
            type is no longer offered (`urn:courtside:error:membership-type-inactive`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/membership-periods/{periodId}:
    put:
      tags: [admin-roster]
      operationId: correctMembershipPeriod
      summary: Correct a period of a person's membership, its type and both its dates.
      description: |
        The request writes the period whole. The corrected period may not overlap another of the
        same person. The person's account sessions end, because the rules their bookings are measured
        against may change.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipPeriodRequest" }
      responses:
        "200":
          description: Corrected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPeriod" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such person, no such membership type, or no such period of this person
            (`urn:courtside:error:membership-period-not-found`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            The period overlaps another (`urn:courtside:error:membership-periods-overlap`), or the
            new type is no longer offered (`urn:courtside:error:membership-type-inactive`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [admin-roster]
      operationId: removeMembershipPeriod
      summary: Remove a period recorded by mistake.
      description: |
        The period is deleted, not ended: use it for a period that never happened. A membership
        that did happen and has stopped is ended instead, so its record stays. The person's account
        sessions end, because the rules their bookings are measured against may change.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such person, or no such period of this person
            (`urn:courtside:error:membership-period-not-found`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/guardianships:
    get:
      tags: [admin-roster]
      operationId: listGuardianRelationships
      summary: Every guardian relationship a person takes part in, as guardian or as dependant.
      description: |
        Oldest first. A relationship grants its actions only while it runs; an ended one stays
        listed so the board can see who could act for whom.
      security:
        - sessionCookie: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The relationships, ascending by their first day.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GuardianRelationship" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [admin-roster]
      operationId: createGuardianRelationship
      summary: Let one person act for another with the granted actions, from today.
      description: |
        The relationship starts today and grants exactly the listed actions. It gives the guardian
        no club role and does not change either person's account. A guardian holds one relationship
        to a dependant on any day, and two people cannot be each other's guardians at once. The
        change is recorded in the audit log.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianRelationshipRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianRelationship" }
        "400":
          description: |
            The request is malformed, or the relationship is not usable
            (`urn:courtside:error:invalid-guardian-relationship`): the person in the path takes no
            part in it, a person would be their own guardian, no action is granted, the end lies
            before today or on today so that it would hold no day, or the dependant already acts
            for the guardian.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The guardian already holds a relationship to this dependant on a day the new one would
            cover (`urn:courtside:error:guardian-relationship-overlap`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/guardianships/{relationshipId}:
    put:
      tags: [admin-roster]
      operationId: changeGuardianRelationship
      summary: Change the granted actions and the end of a relationship.
      description: |
        The request writes both whole. Setting an end today or earlier stops the relationship from
        that day; clearing it lets the relationship run until the board ends it. The change is
        recorded in the audit log.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: relationshipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianRelationshipChange" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianRelationship" }
        "400":
          description: |
            The request is malformed, or the change is not usable
            (`urn:courtside:error:invalid-guardian-relationship`): no action is granted, the end
            lies before the start or on it, or reopening it would make two people each other's
            guardians. Ending a relationship on its first day is what the end operation does.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such person, or no such relationship of this person
            (`urn:courtside:error:guardian-relationship-not-found`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            The reopened relationship would overlap another of the same two people
            (`urn:courtside:error:guardian-relationship-overlap`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [admin-roster]
      operationId: removeGuardianRelationship
      summary: Remove a relationship recorded by mistake.
      description: |
        The relationship is deleted, not ended: use it for one that should never have existed. One
        that did hold and has stopped is ended instead, so its record stays. The removal is
        recorded in the audit log.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: relationshipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such relationship of this person
            (`urn:courtside:error:guardian-relationship-not-found`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/guardianships/{relationshipId}/end:
    post:
      tags: [admin-roster]
      operationId: endGuardianRelationship
      summary: End a relationship today.
      description: |
        From today the guardian may take none of its actions. A relationship that has already ended
        keeps its end. The change is recorded in the audit log.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: relationshipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianRelationship" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such relationship of this person
            (`urn:courtside:error:guardian-relationship-not-found`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/import/encodings:
    get:
      tags: [admin-import]
      operationId: listSupportedEncodings
      summary: The character sets this instance can read a snapshot in.
      description: |
        Every character set the running platform supports, by canonical name, sorted. The list is
        the platform's rather than this product's, so a club with an unusual export is limited by
        what its instance can decode and not by what a release happened to enumerate.

        A browser can decode fewer of these than the server can, so a name outside what the browser
        knows still imports - only the local column preview cannot be offered for it.
      responses:
        "200":
          description: The character sets, by canonical name.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/import/sources:
    get:
      tags: [admin-import]
      operationId: listImportSources
      summary: The systems this club synchronises its roster from.
      description: |
        Ordered by `sourceKey`. A club that has never imported anything has none.
      responses:
        "200":
          description: The sources.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportSource" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [admin-import]
      operationId: createImportSource
      summary: Describe a system a roster snapshot comes from.
      description: |
        A source is what makes a second upload an update rather than a duplicate: every record it
        brings is matched by `sourceKey` together with the member number the file carries, never by
        a name or an email address.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportSourceRequest" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSource" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/import/sources/{id}:
    get:
      tags: [admin-import]
      operationId: readImportSource
      summary: One source and its whole configuration.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSource" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [admin-import]
      operationId: changeImportSource
      summary: Correct any part of a source's configuration.
      description: |
        The request replaces the configuration whole — the key, the display name, both mappings, the
        owned fields and the threshold. A club that mistyped a column header, pointed a value at the
        wrong membership type or picked the wrong threshold corrects it here; nothing about a source
        is written once.

        Changing a mapping does not touch the people a previous run created. It decides what the
        **next** snapshot means.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportSourceRequest" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSource" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [admin-import]
      operationId: deleteImportSource
      summary: Remove a source nothing in the roster points at.
      description: |
        What goes is the club's description of a system it reads from — no person and no membership
        is touched. A source that still holds external references is refused with `409` instead:
        those references say where people in the roster came from, and dropping them silently would
        make the next snapshot from that system create every one of them again as a new person.
        Unlink them first, and the description can go.

        A source that has been executed against is refused for good. Its run log says what was
        written to this club's roster and when, which is history rather than configuration — the way
        to stop using such a source is to stop uploading to it.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/import/sources/{sourceId}/references:
    get:
      tags: [admin-import-references]
      operationId: listExternalReferences
      summary: Which member number of this source stands for which person.
      description: |
        Ordered by the member number, and `cursor` continues after the reference it names in that
        same order.
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          description: |
            The opaque `nextCursor` returned by the preceding page. A cursor naming a reference this
            source no longer holds is answered `404` rather than silently ending the list, because a
            truncated page is the one wrong answer a client cannot detect.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalReferencePage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [admin-import-references]
      operationId: linkExternalReference
      summary: Say which person a member number of this source stands for.
      description: |
        A snapshot matches a record by this reference and by nothing else — never by a name and
        never by an email address, because two members really are called John Roe and a club enrols
        children under a parent's address. A record whose member number this source does not know
        becomes a new person, and a board that recognises the resemblance links the two here
        instead.

        Naming the same person under the same member number again changes nothing and is answered
        `201` with the reference as it already stands. The two ways of contradicting an existing
        reference are refused: a member number this source already gives to somebody else, and a
        person this source already knows under a different member number. Both are corrected by
        unlinking first — an existing reference is never silently moved, because moving it would
        hand one person's record to another at the next snapshot.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalReferenceRequest" }
      responses:
        "201":
          description: Linked.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalReference" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/import/sources/{sourceId}/references/{referenceId}:
    delete:
      tags: [admin-import-references]
      operationId: unlinkExternalReference
      summary: Take back what a member number of this source stands for.
      description: |
        The person stays exactly as they are; what goes is the statement that this source's member
        number names them. The next snapshot carrying that member number therefore reads as a person
        this instance has not seen before.

        The link is addressed by `referenceId`, the id this instance minted for it and which every
        entry of the reference list already carries. The member number would name the same row, but
        it is a value the club's own source system holds about a person, and a path segment reaches
        browser history, an intermediary's log and an operator's diagnostics. A `referenceId` that
        belongs to another source, or that nothing points at, is answered `404`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: referenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Unlinked.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/import/sources/{sourceId}/previews:
    post:
      tags: [admin-import-previews]
      operationId: createImportPreview
      summary: Upload a roster snapshot and see exactly what it would change.
      description: |
        Nothing is written. The file is read against this source's column mapping, every row is
        resolved against the people this source already knows, and the answer is the whole change
        set: what would be created, what would be updated and in which fields, whose membership
        would end, which rows could not be read, and which creations resemble somebody the roster
        already holds.

        A header problem fails the whole file, because nothing in it can then be trusted. A cell
        problem fails one row and is reported beside the rest — a club with one truncated line
        should not have to fix the export before it can see the other nine hundred.

        Uploading again supersedes the previous preview of this source rather than replacing it.
        A preview is never edited: correcting a mistake means uploading the corrected file, which
        is the honest move, because an editable preview would no longer be what anybody reviewed.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, mode]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The club's export as CSV, named `.csv` or `.txt`. A byte order mark is honoured.
                    The declared part type is checked for contradiction against the types a browser
                    sends for such a file, listed under `encoding` below; a part that declares no
                    type at all is accepted, because some clients send none. The content decides: a
                    container, image, workbook or executable signature is refused, and so is
                    anything that decodes into a C0 control character other than tab, carriage
                    return or line feed.
                mode: { $ref: "#/components/schemas/SnapshotMode" }
                encoding:
                  type: string
                  maxLength: 60
                  description: |
                    Overrides the source's own encoding for this file alone, for the export that
                    came out differently once. Omitted, the source's is used. A byte order mark and
                    valid UTF-8 are facts about the content and are used whatever either says; the
                    name only settles a file that is neither, and such a file is refused rather
                    than read as something nobody chose when the name in force is `UTF-8`.

                    This is a name and not an enumeration on purpose. Which character sets exist is
                    a property of the platform the instance runs on, not a decision this product
                    gets to freeze into a release: a club whose export tool writes a seventh one
                    must not have to wait for a new image to import its own members.
            encoding:
              file:
                # The same export leaves a club's browser as a different type depending on the
                # system that sends it, so it is checked for contradiction and never trusted.
                contentType: text/csv, text/plain, application/vnd.ms-excel, application/octet-stream
      responses:
        "201":
          description: The preview.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/import/previews/{id}:
    get:
      tags: [admin-import-previews]
      operationId: readImportPreview
      summary: Read a preview back, exactly as it was taken.
      description: |
        A preview is immutable and answers with its change set for a bounded time. Past that time
        the row still answers with its hash and its counts, and the change set it carried is no
        longer part of the answer.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/import/previews/{id}/execution:
    post:
      tags: [admin-import-runs]
      operationId: executeImportPreview
      summary: Apply exactly the change set that was reviewed.
      description: |
        The preview is the contract: what a board approved is what runs. Nothing is re-resolved and
        nothing is re-read from the file, so a roster that moved between the preview and this
        request cannot be written over by a change set that no longer describes it — if anybody the
        preview would touch has changed since it was taken, the run is refused and nothing is
        written. That covers creations too: a member number the preview would create, and which
        somebody has linked in the meantime, refuses the run rather than adding a second record for
        a person the roster now holds.

        The whole run is one transaction. A change set whose last row fails leaves nothing behind:
        not a person, not a membership, not a reference.

        Executions of one source serialise, so two boards pressing this at the same moment cannot
        interleave. A successful run supersedes every preview of that source, including this one,
        which is what makes re-executing a reviewed snapshot impossible rather than merely unwise.

        Executing the same file twice changes nothing the second time. That is the property this
        whole design exists for: a record is matched by its member number, so a second run finds
        everybody it created the first time.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionRequest" }
      responses:
        "200":
          description: What the run did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRun" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/import/sources/{sourceId}/runs:
    get:
      tags: [admin-import-runs]
      operationId: listImportRuns
      summary: What this source has actually written, newest first.
      description: |
        The log outlives the previews it came from: it keeps the file's hash and the counts, and
        never a copy of the roster. That is what an audit of *what was executed* needs, and it is
        not personal data.
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportRun" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/retention/policies:
    get:
      tags: [admin-retention]
      operationId: listRetentionPolicies
      summary: How long the club keeps each category of personal record.
      description: |
        One entry per record category the instance can apply retention to, in a fixed order. A
        category whose `retainMonths` is null is not configured, and nothing in it is ever changed.
        Courtside prescribes no period: the club chooses what its own lawful basis allows.
        Administrators only.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The categories and their periods.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RetentionPolicy" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/retention/policies/{category}:
    put:
      tags: [admin-retention]
      operationId: setRetentionPolicy
      summary: Keep one category of record for the given number of months.
      description: |
        Setting a period changes no record. Only a previewed and confirmed run applies it.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/RetentionCategory"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionPeriod" }
