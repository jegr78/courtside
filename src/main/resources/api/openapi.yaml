      description: |
        Applied in one transaction: either every weekday in the body is stored or none of them is.
        The week takes effect on `effectiveFrom`; the days before it keep the hours they had.
        To open the courts early for a tournament, change that day's window rather than booking
        around it — the window binds everyone, including an admin.

        Every unusable day is reported together, each violation naming its `day`, so a board fixes
        the week once instead of meeting the next problem after every save.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
