openapi: 3.1.0

info:
  title: Courtside
  version: 0.1.0
  summary: Court booking for a single sports club.
  description: |
    Courtside is single-tenant: this document describes the API of one club's own instance.
    There is no tenant identifier anywhere in it, and there never will be.

    This document is the source of truth for the API, not a description generated from an
    implementation. An operation that is not here is not part of the API, and a change here is a
    change to a published contract.

    ## Errors

    Every failure is an RFC 9457 problem detail. `type` is always a `urn:courtside:error:<slug>`
    URN: a stable identifier, not a fetchable page. A club runs its instance under its own domain,
    so an `https://` type would name a host nobody operates.

    Two arrays carry everything a client has to show a member, and both hold the same kind of
    entry:

    - `violations` — a rule the request broke. Always an array, even where only one entry is ever
      possible, so a client has one shape to render rather than two.
    - `fieldErrors` — the same, plus the name of the input it came from.

    Neither carries rendered text. Each entry has a `code` naming a message and `params` holding
    the values that message interpolates, and the client resolves the pair against its own message
    catalogue. This is what makes the API usable in a language the server does not ship.

    ## Authentication

    Anonymous callers may read the public court plan and its anonymised occupancy. Creating,
    changing or cancelling a booking always requires a server-side session belonging to the
    acting account. Booking and participant cards describe permissions and participant slots;
    they are never credentials and carry no shared secret. State-changing requests also require
    the CSRF token declared below.

    Future paid bookings by people without a club membership use verified external accounts, not
    anonymous writes. Those accounts retain their booking and payment history and may later gain
    an active membership without changing identity. They may use only cards that explicitly allow
    the future `EXTERNAL_BOOKER` permission; an empty card role list never grants external access.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /
    description: The club's own instance.

tags:
  - name: session
    description: Logging in and out.
  - name: documentation
    description: The contract this instance answers to.
  - name: source
    description: Where this instance's own source can be had.
  - name: courts
    description: The club's courts, as anyone may see them.
  - name: opening-hours
    description: When the facility is open, as anyone may see it.
  - name: club-config
    description: The club's name and branding, as anyone may see it.
  - name: cards
    description: The booking and participant cards a member may use.
  - name: bookings
    description: Booking a court, and cancelling.
  - name: participants
    description: Finding members who can participate in a booking.
  - name: booking-series
    description: Recurring bookings — previewing, creating, moving and cancelling.
  - name: admin-courts
    description: Administering courts.
  - name: admin-opening-hours
    description: Administering opening hours.
  - name: admin-booking-cards
    description: Administering booking cards.
  - name: admin-participant-cards
    description: Administering participant cards.
  - name: admin-membership-types
    description: Administering membership types.
  - name: admin-roster
    description: The club's people, and the accounts they hold.
  - name: admin-rule-sets
    description: Administering rule sets and their rules.
  - name: admin-config
    description: Administering the club's own name and branding.
  - name: admin-impact
    description: What a configuration change would affect, before it is made.

security:
  - sessionCookie: []

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        A server-side session, established by `POST /api/session`. Deliberately not a JWT: the
        club's own frontend and the API share an origin, and an admin must be able to end a
        session immediately, which a self-contained token cannot offer.
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        Required on every state-changing request. Any `GET` issues a readable `XSRF-TOKEN` cookie;
        echo its value in this header. Modelled as a security scheme rather than as a header
        parameter because it is consumed before the operation runs and is never part of its input.

        A write without it answers `401`, not `403`: for an unauthenticated caller the missing
        token is indistinguishable from a missing session.

  parameters:
    ImpactCursor:
      name: cursor
      in: query
      required: false
      description: The opaque `nextCursor` returned by the preceding page.
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  schemas:

    DayOfWeek:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    Role:
      type: string
      description: A permission bundle. One person often holds several.
      enum: [MEMBER, TRAINER, SPORT_DIRECTOR, YOUTH_DIRECTOR, GROUNDSKEEPER, TREASURER, ADMIN]

    InitialPasswordChangeRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 12

    SessionStatus:
      type: object
      required: [authenticated, roles, passwordChangeRequired]
      properties:
        authenticated:
          type: boolean
        username:
          type: string
        displayName:
          type: string
        locale:
          type: string
          pattern: "^(de|en)$"
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        passwordChangeRequired:
          type: boolean

    RuleType:
      type: string
      enum: [OPENING_HOURS, SLOT_GRID, ADVANCE_WINDOW, MAX_OPEN_BOOKINGS]

    CancelScope:
      type: string
      description: Which occurrences of a series an operation applies to.
      enum: [THIS, THIS_AND_FOLLOWING, WHOLE_SERIES]

    BookingStatus:
      type: string
      enum: [CONFIRMED, CANCELLED]

    Violation:
      type: object
      description: |
        A rule the request broke, named rather than rendered. The client resolves `code` against
        its own message catalogue and interpolates `params`.
      required: [code, params]
      properties:
        code:
          type: string
          examples: ["booking.rule.advanceWindow.exceeded"]
        params:
          type: object
          additionalProperties: true
          examples: [{ maxDays: 14 }]

    FieldError:
      type: object
      description: A violation that also names the input it came from.
      required: [field, code, params]
      properties:
        field:
          type: string
          examples: ["endsAt"]
        code:
          type: string
          examples: ["validation.ChronologicalSlot"]
        params:
          type: object
          additionalProperties: true

    Problem:
      type: object
      description: RFC 9457 problem detail.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: A `urn:courtside:error:<slug>` URN. Stable, and not a fetchable page.
          examples: ["urn:courtside:error:court-not-bookable"]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: |
            English, for a developer reading a log. Never shown to a member, and never built from
            a caller's input — the translatable part is in `violations`.
        instance:
          type: string
          format: uri
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Trace identifier shared with structured logs and tracing backends.
        spanId:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Server span identifier that selects the same request within the trace.
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
        fieldErrors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    PublicCourt:
      type: object
      required: [id, number, name]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        name: { type: [string, "null"] }

    Court:
      type: object
      required: [id, number, name, active]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        name: { type: [string, "null"] }
        active: { type: boolean }

    CourtRequest:
      type: object
      required: [number]
      properties:
        number: { type: integer, minimum: 1, maximum: 999 }
        name: { type: string, maxLength: 60 }

    OpeningHours:
      type: object
      description: |
        A day with no window is closed. Opening hours bind everyone, including an admin: the grid
        can only offer slots they permit, so a booking outside them is one the interface cannot
        render back.
      required: [dayOfWeek]
      properties:
        dayOfWeek: { $ref: "#/components/schemas/DayOfWeek" }
        opensAt: { type: [string, "null"], format: time }
        closesAt: { type: [string, "null"], format: time }

    BookingGrid:
      type: object
      required: [timeZone, slotMinutes, openingHours]
      properties:
        timeZone: { type: string, example: Europe/Berlin }
        slotMinutes: { type: integer, minimum: 5, maximum: 120, multipleOf: 5 }
        openingHours:
          type: array
          items: { $ref: "#/components/schemas/OpeningHours" }

    SetOpeningHoursRequest:
      type: object
      required: [opensAt, closesAt]
      properties:
        opensAt: { type: string, format: time }
        closesAt: { type: string, format: time }

    ClubConfig:
      type: object
      required: [clubName, primaryColor, accentColor, defaultLocale, slotMinutes, timeZone]
      properties:
        clubName: { type: string }
        primaryColor: { type: string }
        accentColor: { type: string }
        logoUrl: { type: [string, "null"] }
        imprintUrl: { type: [string, "null"] }
        defaultLocale: { type: string }
        slotMinutes: { type: integer, minimum: 5, maximum: 120, multipleOf: 5 }
        timeZone: { type: string, example: Europe/Berlin }

    ClubConfigRequest:
      type: object
      required: [clubName, primaryColor, accentColor, defaultLocale, slotMinutes, timeZone]
      properties:
        clubName: { type: string, maxLength: 100, pattern: ".*\\S.*" }
        primaryColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        accentColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        logoUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^(https?://.+|/[^/\\\\].*|/)$"
        imprintUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^(https?://.+|/[^/\\\\].*|/)$"
        defaultLocale: { type: string, pattern: "^(de|en)$" }
        slotMinutes: { type: integer, minimum: 5, maximum: 120, multipleOf: 5 }
        timeZone:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z][A-Za-z0-9+_-]*(/[A-Za-z0-9+._-]+)*$"
          description: |
            An IANA time zone identifier such as `Europe/Berlin`. A fixed-offset identifier is
            refused: the club grid has to follow daylight saving. It can only be changed while
            no confirmed future booking exists.
          example: Europe/Berlin

    WebManifest:
      type: object
      required: [name, short_name, start_url, display, background_color, theme_color, icons]
      properties:
        name: { type: string }
        short_name: { type: string }
        start_url: { type: string }
        display: { type: string, enum: [standalone] }
        background_color: { type: string }
        theme_color: { type: string }
        icons:
          type: array
          items: { $ref: "#/components/schemas/WebManifestIcon" }

    WebManifestIcon:
      type: object
      required: [src, sizes]
      properties:
        src: { type: string }
        sizes: { type: string }
        type: { type: string }

    PublicBookingCard:
      type: object
      required: [id, label, color, allowedPlayerCounts, guestAllowed]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        color: { type: string }
        allowedPlayerCounts:
          type: array
          items: { type: integer }
        guestAllowed: { type: boolean }

    PublicParticipantCard:
      type: object
      required: [id, label]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        capacity: { type: [integer, "null"] }

    PublicParticipantMember:
      type: object
      required: [personId, displayName]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }

    BookingCard:
      type: object
      description: |
        What kind of occupancy a booking is. Member booking, training, league match and court
        closure differ only by their card, so a new kind is a row rather than a deployment.
      required: [id, label, color, allowedRoles, managingRoles, allowedPlayerCounts, tracksPlayers, countsAgainstLimits, guestAllowed, showGenericOccupancy, active]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        color: { type: string }
        allowedRoles:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }
        managingRoles:
          type: array
          uniqueItems: true
          description: |
            The roles that may open, read and cancel every booking made on this card,
            independently of who may book with it. Empty means only an admin may.
          items: { $ref: "#/components/schemas/Role" }
        allowedPlayerCounts:
          type: array
          items: { type: integer }
        tracksPlayers: { type: boolean }
        countsAgainstLimits: { type: boolean }
        guestAllowed: { type: boolean }
        showGenericOccupancy:
          type: boolean
          description: Show a neutral booked label in the member-facing court plan instead of the card label.
        active: { type: boolean }

    BookingCardRequest:
      type: object
      required: [label, color, allowedRoles, allowedPlayerCounts, countsAgainstLimits, guestAllowed]
      properties:
        label: { type: string, maxLength: 60, pattern: ".*\\S.*" }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        allowedRoles:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }
        managingRoles:
          type: array
          uniqueItems: true
          description: |
            The roles that may open, read and cancel every booking made on this card,
            independently of who may book with it. Absent or empty means only an admin may.
          items: { $ref: "#/components/schemas/Role" }
        allowedPlayerCounts:
          type: array
          description: |
            The exact player counts this card permits — `[2, 4]` for a member card, empty for a
            card that does not record players at all, such as training or a closure.
          maxItems: 20
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 20 }
        countsAgainstLimits: { type: boolean }
        guestAllowed: { type: boolean }
        showGenericOccupancy:
          type: boolean
          default: false

    ParticipantCard:
      type: object
      required: [id, label, active]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        capacity: { type: [integer, "null"] }
        active: { type: boolean }

    ParticipantCardRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, maxLength: 60, pattern: ".*\\S.*" }
        capacity:
          type: [integer, "null"]
          minimum: 1
          maximum: 99
          description: How many of this card the club owns. Absent means unlimited.

    ActiveRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }

    MembershipRequest:
      type: object
      description: |
        A person holds at most one membership, so the type named here replaces the one they hold
        rather than adding a second. The request writes that one membership whole: its type and
        both its dates.
      required: [membershipTypeId]
      properties:
        membershipTypeId:
          type: string
          format: uuid
          description: |
            A membership type the club still offers; `GET /api/admin/membership-types` lists them
            with their `active` flag. The club has to still offer it only when it differs from the
            type the person already holds — correcting the dates of a membership on a type retired
            since is not an assignment and is not refused, because a departure recorded on the
            wrong day would otherwise be permanent.
        startedOn:
          type: [string, "null"]
          format: date
          description: |
            The date the membership began. Omitted, it is today for a membership that is being
            created or revived, and leaves a running one where it is — changing somebody's type
            continues their membership rather than starting a new one.
        endedOn:
          type: [string, "null"]
          format: date
          description: |
            Present, it writes a membership that has ended: the record and the type stay, the
            person stops being a member. Omitted, the membership runs. It may not precede
            `startedOn`.

    MembershipType:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ruleSetId: { type: [string, "null"], format: uuid }
        active: { type: boolean }

    MembershipTypeRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60, pattern: ".*\\S.*" }
        ruleSetId: { type: [string, "null"], format: uuid }

    PersonRequest:
      type: object
      description: |
        None of the three values may be blank, and no name may hold a line break.

        Surrounding whitespace is removed before the values are checked and stored, so a name or
        an address pasted with padding is accepted, `maxLength` counts what is left, and the
        person carries no padding.

        An email address is accepted whatever the rest of the roster already holds; see
        `POST /api/admin/roster`.
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          maxLength: 60
          pattern: "[^\\u000a\\u000d]*[^\\u0009-\\u000d\\u001c-\\u0020\\u0085\\u00a0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000\\ufeff][^\\u000a\\u000d]*"
        lastName:
          type: string
          maxLength: 60
          pattern: "[^\\u000a\\u000d]*[^\\u0009-\\u000d\\u001c-\\u0020\\u0085\\u00a0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000\\ufeff][^\\u000a\\u000d]*"
        email:
          type: string
          format: email
          maxLength: 120
          pattern: "[^\\u000a\\u000d]*[^\\u0009-\\u000d\\u001c-\\u0020\\u0085\\u00a0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000\\ufeff][^\\u000a\\u000d]*"

    RosterEntry:
      type: object
      required: [personId, firstName, lastName, email, enabled, roles]
      properties:
        personId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        accountId: { type: [string, "null"], format: uuid }
        username: { type: [string, "null"] }
        enabled:
          type: boolean
          description: |
            The account's state, not the person's. A person without an account is never enabled and
            is not thereby disabled — read it together with `accountId`.
        membershipTypeId:
          type: [string, "null"]
          format: uuid
          description: |
            The type of the membership the person holds, or — when `membershipEndedOn` is present —
            the type they last held. Read it together with `membershipEndedOn` and never on its
            own: a person whose membership has ended still has a type here and is not a member.
        membershipStartedOn:
          type: [string, "null"]
          format: date
          description: The date the membership began, absent when the person holds none.
        membershipEndedOn:
          type: [string, "null"]
          format: date
          description: |
            Present only for a membership that has ended, naming the date it did. A person whose
            entry carries it is **not** currently a member: no membership-scoped booking rule is
            measured against them and they are not offered as a co-player.
        roles:
          type: array
          description: |
            Ascending by role name, so a client may compare two entries without sorting them
            first and the order does not move when the enumeration grows.
          items: { $ref: "#/components/schemas/Role" }

    RosterPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/RosterEntry" }
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: Pass this person id as `cursor` to continue after the current page.

    AccountRequest:
      type: object
      description: |
        The one-time password is what an administrator hands the member; the member replaces it
        before reaching anything else and it is never stored as given. Twelve characters is the
        floor the bootstrap administrator's password is held to, and an administrator creating
        accounts is not held to a weaker one.
      required: [username, oneTimePassword, roles]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 60
          pattern: "^[a-z0-9._-]+$"
          description: |
            The login identifier, unique across the instance and suggested as `lastname.firstname`.
        oneTimePassword: { type: string, format: password, minLength: 12, maxLength: 200 }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }

    UsernameRequest:
      type: object
      description: |
        The name replaces the one the account holds. Its shape is the one `AccountRequest`
        states, because a name a correction may produce and a name a creation may produce are
        the same identifier.
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 60
          pattern: "^[a-z0-9._-]+$"
          description: |
            The login identifier, unique across the instance and suggested as `lastname.firstname`.

    PasswordResetRequest:
      type: object
      description: |
        The one-time password is what an administrator hands the member; the member replaces it
        before reaching anything else and it is never stored as given. Twelve characters is the
        floor the bootstrap administrator's password is held to, and a reset an administrator
        performs is not held to a weaker one.
      required: [oneTimePassword]
      properties:
        oneTimePassword: { type: string, format: password, minLength: 12, maxLength: 200 }

    RolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }

    RuleSet:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }

    RuleSetRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60, pattern: ".*\\S.*" }

    RuleDefinition:
      type: object
      required: [ruleType, params]
      properties:
        ruleType: { $ref: "#/components/schemas/RuleType" }
        params:
          type: object
          additionalProperties: { type: integer }

    RuleTypeConfiguration:
      type: object
      required: [ruleType, configurable, parameters]
      properties:
        ruleType: { $ref: "#/components/schemas/RuleType" }
        configurable: { type: boolean }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/RuleParameter" }

    RuleParameter:
      type: object
      required: [name, minimum, maximum]
      properties:
        name: { type: string }
        minimum: { type: integer }
        maximum: { type: integer }

    SetRuleRequest:
      type: object
      required: [params]
      properties:
        params:
          type: object
          additionalProperties: { type: integer }

    ParticipantRequest:
      type: object
      description: |
        Exactly one of the three is set. A member by id, a guest by name, or a participant card
        such as a ball machine, which occupies a place on court without being a person.
      properties:
        personId: { type: [string, "null"], format: uuid }
        guestName: { type: [string, "null"] }
        cardId: { type: [string, "null"], format: uuid }

    CreateBookingRequest:
      type: object
      required: [courtIds, cardId, startsAt, endsAt]
      properties:
        courtIds:
          type: array
          minItems: 1
          # A court's number is at most 999, so no club has more to book at once. The bound is
          # here because an array with none is a body of any size a caller cares to send.
          maxItems: 999
          uniqueItems: true
          items: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        startsAt:
          type: string
          format: date-time
          description: Must not be before the current instant.
        endsAt:
          type: string
          format: date-time
          description: Must be after `startsAt`.
        note: { type: [string, "null"] }
        participants:
          type: array
          items: { $ref: "#/components/schemas/ParticipantRequest" }

    BookingCreated:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }

    PersonalBooking:
      type: object
      required: [id, courtIds, startsAt, endsAt, cardLabel, cardColor, status]
      properties:
        id: { type: string, format: uuid }
        seriesId: { type: [string, "null"], format: uuid }
        courtIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cardLabel: { type: string }
        cardColor: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        note: { type: [string, "null"] }

    PersonalBookingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PersonalBooking" }
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: Pass this booking id as `cursor` to continue after the current page.

    ManagedAppointment:
      type: object
      required: [id, courtIds, startsAt, endsAt, cardLabel, cardColor, status, participantCount]
      properties:
        id: { type: string, format: uuid }
        seriesId: { type: [string, "null"], format: uuid }
        courtIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cardLabel: { type: string }
        cardColor: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        participantCount: { type: integer, minimum: 0 }

    ManagedAppointmentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ManagedAppointment" }
        nextCursor:
          type: [string, "null"]
          format: uuid

    ManagedParticipantKind:
      type: string
      enum: [MEMBER, GUEST, CARD]

    ManagedParticipant:
      type: object
      required: [kind, displayName]
      properties:
        kind: { $ref: "#/components/schemas/ManagedParticipantKind" }
        displayName: { type: string }

    ManagedAppointmentDetail:
      allOf:
        - $ref: "#/components/schemas/ManagedAppointment"
        - type: object
          required: [participants]
          properties:
            note: { type: [string, "null"] }
            participants:
              type: array
              items: { $ref: "#/components/schemas/ManagedParticipant" }

    Allocation:
      type: object
      description: One court's occupancy for one booking.
      required: [bookingId, courtId, startsAt, endsAt, cardLabel, cardColor, ownBooking, showGenericOccupancy]
      properties:
        bookingId: { type: string, format: uuid }
        courtId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cardLabel: { type: string }
        cardColor: { type: string }
        ownBooking:
          type: boolean
          description: True only when the authenticated viewer created this booking; always false anonymously.
        showGenericOccupancy:
          type: boolean
          description: Whether member-facing views use a neutral booked label instead of the card label.
        participantLastNames:
          type: array
          description: |
            Present only for the authenticated viewer's own member booking. Contains the last
            names of other member participants in entry order. The viewer and guests are omitted.
          items: { type: string }
        bookedByName:
          type: [string, "null"]
          description: |
            Null on every member-facing response, always. Participant names are not shown for
            someone else's booking — not to guests and not to members — and this is not a setting
            a club can switch on. Only the administrative views resolve a name.
        participantCount:
          type: [integer, "null"]
          format: int32
          minimum: 1
          description: Present for participant-based bookings; absent for named special occupancy.

    SeriesRuleRequest:
      type: object
      description: |
        A recurrence, ending either on a date or after a number of occurrences — exactly one of
        `endsOn` and `occurrenceCount` is given.
      required: [courtIds, cardId, startsOn, startTime, durationMinutes, intervalWeeks, weekdays]
      properties:
        courtIds:
          type: array
          minItems: 1
          # A court's number is at most 999, so no club has more to book at once. The bound is
          # here because an array with none is a body of any size a caller cares to send.
          maxItems: 999
          uniqueItems: true
          items: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        startsOn:
          type: string
          format: date
          description: Occurrences before the current instant cannot be created.
        startTime: { type: string, format: time }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        intervalWeeks: { type: integer, minimum: 1, maximum: 52 }
        weekdays:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/DayOfWeek" }
        endsOn:
          type: [string, "null"]
          format: date
          description: Not before `startsOn`. Mutually exclusive with `occurrenceCount`.
        occurrenceCount:
          type: [integer, "null"]
          minimum: 1
          maximum: 200
          description: Mutually exclusive with `endsOn`.
        note: { type: [string, "null"] }

    CreateSeriesRequest:
      description: |
        A recurrence together with the occurrences to actually write. Previewing needs only the
        recurrence; creating needs the caller's confirmation as well, which is why the two
        operations do not share one shape.
      allOf:
        - $ref: "#/components/schemas/SeriesRuleRequest"
        - type: object
          required: [confirmedStarts]
          properties:
            confirmedStarts:
              type: array
              minItems: 1
              # A series has at most occurrenceCount's maximum of occurrences, so it can confirm
              # no more than that many.
              maxItems: 200
              uniqueItems: true
              description: |
                Each entry must be one the preview actually offered — the creator decides which
                occurrences to keep, and nothing is written that they did not confirm.
              items: { type: string, format: date-time }

    SourceOffer:
      type: object
      required: [version, environment, sourceUrl]
      properties:
        version:
          type: string
          description: The version this instance was built as.
        commit:
          type: [string, "null"]
          description: |
            The commit it was built from, when the build had a repository to read. Absent for a
            build from a source archive, where the version is all there is to go on.
        environment:
          type: string
          enum: [PRODUCTION, UAT, DEVELOPMENT, PERFORMANCE]
          description: The deployment environment this instance identifies itself as.
        sourceUrl:
          type: string
          format: uri
          pattern: "^https?://.+"
          description: |
            Where the corresponding source of this version can be obtained. Absolute and
            resolvable by whoever reads it: an address only the club's own network can reach is
            not an offer to the club's members.
      example:
        version: "1.4.0"
        commit: "9f1c0e3a5b7d2f4681c9a0e5d3b7f2a4c6e8d0b1"
        environment: "PRODUCTION"
        sourceUrl: "https://example.org/git/courtside"

    Occurrence:
      type: object
      required: [startsAt, endsAt, blockedCourtIds, violations, creatable]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        blockedCourtIds:
          type: array
          items: { type: string, format: uuid }
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
        creatable: { type: boolean }

    SeriesPreview:
      type: object
      required: [occurrences, creatableCount, truncatedByHorizon]
      properties:
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/Occurrence" }
        creatableCount: { type: integer, format: int64 }
        truncatedByHorizon:
          type: boolean
          description: |
            True when the recurrence would run past the instance's horizon. Said here rather than
            on creation, because by then a dropped date was never among the confirmed occurrences
            to report against.
        horizonLimit: { type: [string, "null"], format: date }

    SeriesCreated:
      type: object
      required: [bookingIds, skipped]
      properties:
        seriesId:
          type: [string, "null"]
          format: uuid
          description: Null when nothing could be created; no empty series is left behind.
        bookingIds:
          type: array
          items: { type: string, format: uuid }
        skipped:
          type: array
          description: Occurrences a conflict or a rule kept from being created.
          items: { type: string, format: date-time }

    MoveRequest:
      type: object
      description: |
        A move is not a date-shift operation: each occurrence keeps its original local date. The
        supplied target defines its time of day, duration and courts, and must change at least one
        of them.
      required: [fromBookingId, scope]
      properties:
        fromBookingId: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/CancelScope" }
        newStartTime: { type: [string, "null"], format: time }
        newDurationMinutes: { type: [integer, "null"], minimum: 1 }
        newCourtIds:
          type: [array, "null"]
          minItems: 1
          maxItems: 999
          uniqueItems: true
          description: Absent leaves the courts as they are; empty is not a request that means anything.
          items: { type: string, format: uuid }

    Move:
      type: object
      required: [bookingId, fromStartsAt, toStartsAt, blockedCourtIds, unbookableCourtIds, violations, executable]
      properties:
        bookingId: { type: string, format: uuid }
        fromStartsAt: { type: string, format: date-time }
        toStartsAt: { type: string, format: date-time }
        blockedCourtIds:
          type: array
          items: { type: string, format: uuid }
        unbookableCourtIds:
          type: array
          items: { type: string, format: uuid }
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
        executable: { type: boolean }

    MovePreview:
      type: object
      required: [moves, executable]
      properties:
        moves:
          type: array
          items: { $ref: "#/components/schemas/Move" }
        executable: { type: boolean }

    MoveExecuted:
      type: object
      required: [moved]
      properties:
        moved: { type: integer }

    AffectedBooking:
      type: object
      required: [bookingId, courtIds, startsAt, endsAt]
      properties:
        bookingId: { type: string, format: uuid }
        courtIds:
          type: array
          items: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    Impact:
      type: object
      description: What a configuration change would hit, before it is made.
      required: [affectedCount, truncated, bookings]
      properties:
        affectedCount: { type: integer }
        truncated:
          type: boolean
          description: True when another page of affected bookings exists.
        nextCursor:
          type: [string, "null"]
          format: uuid
          description: The cursor for the next page, or null when this is the final page.
        bookings:
          type: array
          items: { $ref: "#/components/schemas/AffectedBooking" }

  responses:
    Unauthenticated:
      description: No session, or a state-changing request without a CSRF token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated, but not allowed to do this.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such thing.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Invalid:
      description: The request was understood and rejected.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request collides with the current state; the problem `type` names the case.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many requests for the protected operation.
      headers:
        Retry-After:
          description: Seconds until another attempt may be made.
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

paths:

  /api/source:
    get:
      tags: [source]
      operationId: getSourceOffer
      summary: The running version and where its source can be had.
      description: |
        Courtside is AGPL-3.0. A club that modified it and runs it for its members owes those
        members the source of the modified version, and this is where an instance says which
        version that is and where to get it. An unmodified deployment reports the upstream
        repository; a club that forked points `sourceUrl` at its own.

        Public and unauthenticated on purpose: the obligation is to the people using the service,
        and requiring an account to see it would defeat it.
      security: []
      responses:
        "200":
          description: What this instance is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceOffer" }

  /api/openapi.yaml:
    get:
      tags: [documentation]
      operationId: getApiDocument
      summary: This document, as served by this instance.
      description: |
        Clubs update on their own schedule, so the contract an instance answers to may be older
        than the one in the project's repository. This is the one that binds here.
      security: []
      responses:
        "200":
          description: The API document.
          content:
            application/yaml:
              schema: { type: string }

  /api/session:
    get:
      tags: [session-status]
      operationId: getSessionStatus
      summary: Report the current browser session.
      responses:
        "200":
          description: The current authentication state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionStatus" }
    post:
      tags: [session]
      operationId: logIn
      summary: Log in.
      description: |
        Form-encoded, not JSON: this is Spring Security's form login, and the encoding is part of
        the contract rather than an accident.

        A `GET` beforehand issues the readable `XSRF-TOKEN` cookie whose value this request must
        echo in `X-XSRF-TOKEN`. Without it the answer is `401`, indistinguishable from a wrong
        password — if credentials are certainly right and the answer is `401`, the token is
        missing.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in. The session cookie is set.
          headers:
            X-Courtside-Password-Change-Required:
              description: Present and `true` when only the initial-password endpoint may be used.
              schema: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/session/logout:
    post:
      tags: [session]
      operationId: logOut
      summary: Log out and end the session.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Logged out.

  /api/account/initial-password:
    put:
      tags: [account]
      operationId: changeInitialPassword
      summary: Replace the one-time bootstrap password.
      description: |
        Available only to an authenticated account marked for an initial password change. The
        successful change ends every active session for the account; sign in again with the new
        password.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InitialPasswordChangeRequest" }
      responses:
        "204":
          description: Changed. The current session has ended.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/public/courts:
    get:
      tags: [courts]
      operationId: listCourts
      summary: The club's active courts.
      security: []
      responses:
        "200":
          description: The courts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicCourt" }

  /api/public/opening-hours:
    get:
      tags: [opening-hours]
      operationId: listOpeningHours
      summary: When the facility is open, by weekday.
      security: []
      responses:
        "200":
          description: One entry per weekday.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OpeningHours" }

  /api/public/booking-grid:
    get:
      tags: [opening-hours]
      operationId: getBookingGrid
      summary: The time zone, slot duration and weekly opening windows that define the booking grid.
      security: []
      responses:
        "200":
          description: The booking grid configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGrid" }

  /api/public/config:
    get:
      tags: [club-config]
      operationId: getClubConfig
      summary: The club's name and branding.
      security: []
      responses:
        "200":
          description: The configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClubConfig" }

  /manifest.webmanifest:
    get:
      tags: [manifest]
      operationId: getWebManifest
      summary: The installable web application's club-specific metadata.
      security: []
      responses:
        "200":
          description: The web application manifest.
          content:
            application/manifest+json:
              schema: { $ref: "#/components/schemas/WebManifest" }

  /api/public/booking-cards:
    get:
      tags: [cards]
      operationId: listBookableCards
      summary: The booking cards the caller may use.
      description: |
        Filtered by the caller's roles: a card gated behind a role they do not hold is absent
        rather than shown and refused. Authenticated despite the path — the answer depends on who
        is asking.
      responses:
        "200":
          description: The cards this caller may place.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicBookingCard" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/public/participant-cards:
    get:
      tags: [cards]
      operationId: listParticipantCards
      summary: The active participant cards.
      description: What can fill a player slot without being a person — a ball machine, or an open slot.
      responses:
        "200":
          description: The cards.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicParticipantCard" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/public/participant-members:
    get:
      tags: [participants]
      operationId: listParticipantMembers
      summary: Members matching a name fragment for participant selection.
      description: |
        Any authenticated account may search the entire member directory by a name fragment,
        matched case-insensitively anywhere in the full name and returning at most 20 rows with no
        contact details. This reach is deliberate, for the co-player picker — the way
        `Allocation.bookedByName` documents its own visibility rule rather than leaving it
        implicit. The current authorization does not verify club membership. Before authenticated
        external guest accounts are introduced, this endpoint must gain that boundary so those
        accounts do not inherit the directory reach.
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 60 }
      responses:
        "200":
          description: Matching members ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicParticipantMember" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/bookings:
    get:
      tags: [bookings]
      operationId: listAllocations
      summary: The occupancy grid for one day.
      security: []
      description: |
        A day, not a range: the grid a member reads is one day wide, and the instance's own time
        zone decides where that day begins. A range would let a caller ask for a year.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: One entry per occupied court and slot.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Allocation" }
        "400":
          $ref: "#/components/responses/Invalid"
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Book one or more courts for a slot.
      description: |
        Non-overlap is decided by the database, not by a check beforehand — time passes between
        checking and inserting. A collision is a `409`, and it is authoritative. Every booking
        attempt carries an idempotency key; retrying the same request returns the original booking.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: An opaque key unique to this booking attempt for the authenticated account.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[\x21-\x7E]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: Booked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingCreated" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A court was taken in the meantime, or the idempotency key belongs to another request.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: One or more booking rules refused it.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/bookings/{id}:
    delete:
      tags: [bookings]
      operationId: cancelBooking
      summary: Cancel a booking.
      description: |
        The creator, an administrator, or an account currently allowed by the booking card may
        cancel the booking. Cards without role restrictions do not grant management access to
        unrelated accounts.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/my/bookings:
    get:
      tags: [bookings]
      operationId: listPersonalBookings
      summary: The signed-in account's bookings.
      description: Confirmed and cancelled bookings, ordered from newest occurrence to oldest.
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            The opaque `nextCursor` returned by the preceding page. A cursor this account's
            bookings do not contain yields an empty page rather than an error: a booking is
            cancelled and never removed, so an id that came from this list keeps resolving, and
            one that did not come from it belongs to somebody else.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Every booking created by this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBookingPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/managed/bookings:
    get:
      tags: [bookings]
      operationId: listManagedAppointments
      summary: Appointments the signed-in account is currently authorized to manage.
      description: |
        Uses each booking card's current allowed roles. Cards without role restrictions do not
        expose appointments to unrelated accounts. Administrators may manage every appointment.
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Appointments visible through the caller's current management roles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedAppointmentPage" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/managed/bookings/{id}:
    get:
      tags: [bookings]
      operationId: getManagedAppointment
      summary: Management details for one appointment.
      description: Internal notes and participant display names are returned only after authorization.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Details required to manage the appointment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedAppointmentDetail" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/booking-series/preview:
    post:
      tags: [booking-series]
      operationId: previewSeries
      summary: What a recurrence would produce, without writing anything.
      description: |
        Mandatory before creating. Open to any authenticated caller, including one who could not
        actually place the card — the card's allowed roles are enforced when the series is
        created, exactly as it is for a single booking.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesRuleRequest" }
      responses:
        "200":
          description: Every occurrence the rule produces, with what would block it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesPreview" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"

