        `/api/admin/reports/facility-utilisation`: both are given or both are omitted, without them
        the report covers the last full calendar month, and the period may span at most 366 days.
        Capacity, cancellations and attendance count the bookings whose first court starts in the
        period; rule rejections count the refused attempts made in it. Every figure is a count or
        a sum of minutes. No part of the answer names a person, an account or a booking.
