  /api/admin/audit:
    get:
      tags: [admin-audit]
      operationId: readAuditLog
      summary: The configuration changes this instance recorded, newest first.
      description: |
        Every entry names the account that made the change, or no account at all when the change
        had no signed-in person behind it. An account id that resolves to nothing is an account
        that has been erased; the id stands in its place.

        The page is ordered by `occurredAt` descending, and by `id` descending where several
        entries share one `occurredAt` — which happens whenever one administrative call records
        more than one change — so the order is total and a page boundary never drops or repeats a
        row. `cursor` continues after the entry it names in that same order.
      parameters:
        - name: subjectId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict the page to one configuration entity.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Include only entries recorded at or after this instant.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: |
            Exclude entries recorded at or after this instant. A boundary of midnight excludes
            anything recorded exactly at midnight; ask for the following instant to include it.
        - name: cursor
          in: query
          required: false
          description: |
            The opaque `nextCursor` returned by the preceding page. A cursor that does not name an
            entry of this log is answered `400` rather than silently starting the page over, because
            a restarted page is the one wrong answer a client cannot detect.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A page of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
