        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/admin/messages:
    get:
      tags: [admin-messages]
      operationId: readMessageLog
      summary: What became of the messages this instance sent, newest first.
      description: |
        Every message the instance handed to its mail server, with what became of it as far as this
        instance can know. `HANDED_OVER` is the resting state: the message is with the mail server,
        a failure would appear here, and nothing after that point is visible without receiving mail.

        A refusal is a recipient the relay rejected during the transaction — most often an address
        with a typo. There is no way to send the same message again: a credential exists only as a
        hash once it has gone out, so the remedy is to correct the address and ask for new
        credentials, on the person this entry names.

        Administrators only. Who was written to and when is personal data, and no officer role
        needs it.

        The page is newest first, in the order the entries were written rather than by the clock
        they carry: two messages queued inside one tick of it would otherwise have no order at all,
        and a page boundary would drop or repeat a row.
      security:
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MessageState" }
          description: |
            Restrict the page to one state. A value this instance does not know is answered `400`.
        - name: unsettled
          in: query
          required: false
          schema: { type: boolean }
          description: |
            Restrict the page to what went wrong — `REFUSED` and `FAILED` together. This is the
            filter a board reaches for; `state` is for looking at one of them on its own.
        - name: personId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict the page to the messages written to one person.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Include only messages queued at or after this instant.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Exclude messages queued at or after this instant.
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            The opaque `nextCursor` returned by the preceding page. A cursor that does not name an
            entry of this log is answered `400` rather than silently starting the page over.
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A page of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/message-templates:
    get:
      tags: [admin-message-templates]
      operationId: listMessageTemplates
      summary: Every message the instance sends, with its shipped and its club wording.
      description: |
        One entry per message kind in the order the instance knows them. Each carries the
        placeholders its message fills, the ones a club wording must keep, and per supported
        language the shipped subject and body beside the club's own wording, which is absent where
        the club keeps the shipped one. Administrators only.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MessageTemplate" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/message-templates/{kind}/{language}:
    put:
      tags: [admin-message-templates]
      operationId: changeMessageTemplate
      summary: Store the club's own subject and body of one message in one language.
      description: |
        The wording is plain text. It may name only placeholders the message fills, must keep the
        ones the message exists to deliver, such as the one-time password or the reset code, and
        keeps a secret out of the subject, which also stays on one line. A secret stands on its own
        in the body, apart from quotes and punctuation, so it never becomes part of a link. Control
        characters are refused. Anything else, links included, is the club's to word. The wording changes what a message says, never who
        receives it or whether it is sent.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/MessageTemplateKind"
        - $ref: "#/components/parameters/MessageTemplateLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageTemplateText" }
      responses:
        "204":
          description: Stored; the next message of this kind in this language uses it.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The wording names a placeholder the message cannot fill, leaves out one it must keep,
            puts a secret into the subject, glues a secret to other text, breaks the subject over
            lines or holds a control character. Each reason is one entry of `violations`, with the
            placeholder it concerns.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [admin-message-templates]
      operationId: resetMessageTemplate
      summary: Return one message in one language to the shipped wording.
      description: |
        Resetting a message that already uses the shipped wording changes nothing.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/MessageTemplateKind"
        - $ref: "#/components/parameters/MessageTemplateLanguage"
      responses:
        "204":
          description: The shipped wording applies.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/message-templates/{kind}/{language}/preview:
    post:
      tags: [admin-message-templates]
      operationId: previewMessageTemplate
      summary: Show a wording filled with example values, without storing it.
      description: |
        The same check as storing applies, so a preview that answers is a wording that can be
        stored. The example values are invented and name nobody.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/MessageTemplateKind"
        - $ref: "#/components/parameters/MessageTemplateLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageTemplateText" }
      responses:
        "200":
          description: The wording as a member would read it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTemplateText" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The wording is refused for the reasons storing it would be.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/audit:
    get:
      tags: [admin-audit]
      operationId: readAuditLog
      summary: The changes this instance recorded, newest first.
      description: |
        Every entry names the account that made the change, or no account at all when the change
        had no signed-in person behind it. An account id that resolves to nothing is an account
        that has been erased; the id stands in its place.

        Entries come from two places. The administrative surfaces record what a board configures:
        `facility.court.added`, `card.bookingCard.changed`, `config.club.changed`,
        `rules.ruleSet.changed`, `roster.person.corrected`, `dataexchange.source.described` and
        `notification.template.changed`, each with siblings, and `access.grant.retryRequested`, whose
        subject is the booking the retried grant belongs to. The rest is recorded outside those surfaces:
        `booking.booking.confirmed` and the four other booking entries, `access.grant.installed` and
        `access.grant.failing`, and
        `identity.account.credentialsRequested`, which names the account a credential was issued
        for. Treat `eventType` as an open set — a page may carry a name this description does not
        list.

        The page is ordered by `occurredAt` descending, and by `id` descending where several
        entries share one `occurredAt` — which happens whenever one administrative call records
        more than one change — so the order is total and a page boundary never drops or repeats a
        row. `cursor` continues after the entry it names in that same order.
      parameters:
        - name: subjectId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict the page to one entity.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Include only entries recorded at or after this instant.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: |
            Exclude entries recorded at or after this instant. A boundary of midnight excludes
            anything recorded exactly at midnight; ask for the following instant to include it.
        - name: cursor
          in: query
          required: false
          description: |
            The opaque `nextCursor` returned by the preceding page. A cursor that does not name an
            entry of this log is answered `400` rather than silently starting the page over, because
            a restarted page is the one wrong answer a client cannot detect.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A page of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/audit/search:
    post:
      tags: [admin-audit]
      operationId: searchAuditLog
      x-courtside-state-invariant: true
      summary: Search and filter recorded changes, newest first.
      description: |
        Uses the same total ordering and cursor semantics as the unfiltered log. The cursor must
        belong to the filtered result or the request is rejected instead of silently skipping data.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditSearchRequest" }
      responses:
        "200":
          description: A filtered page of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/operational-logs/search:
    post:
      tags: [admin-operational-logs]
      operationId: searchOperationalLogs
      x-courtside-state-invariant: true
      summary: Recent bounded operational records from the reference deployment.
      description: |
        Returns only normalized and redacted records carrying one of the fixed, claimed Courtside
        application, database and reverse-proxy source tags. The local transport does not
        authenticate that claim. Search criteria stay in the JSON body because message
        fragments may be personal. `UNAVAILABLE` is distinct from an available collection with no
        matching entries. Rotation, refused input and incomplete scans are reported explicitly;
        this endpoint never claims durable or complete log delivery.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationalLogSearchRequest" }
      responses:
        "200":
          description: A page of recent operational records and its evidence status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalLogPage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/operator-health:
    get:
      tags: [admin-operator-health]
      operationId: readOperatorHealth
      summary: The running version, migration state, mail handover, public origin and backup evidence.
      description: |
        Every check reads evidence the instance already holds and changes nothing. A check without
        evidence answers `UNAVAILABLE`, never `OK`: Courtside reports a backup only when the
        operator records one, and does not promise that backups, monitoring or alerts exist.
      responses:
        "200":
          description: The current result of every check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorHealth" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/export/roster:
    post:
      tags: [admin-export]
      operationId: exportRoster
      summary: The roster as a CSV file.
      description: |
        The club's own data, in a form its spreadsheet opens. A board that wants its member list
        for a general meeting, or a club that leaves, has no other way out than the API one request
        at a time.

        It is the club's member list and not its account list: the member number an import linked,
        the name, the address the club holds, and the membership with the dates it runs between.
        No username, no role, no booking, no change log. Every one of those is on screen for an
        administrator who needs it, and a file that travels by mail and lands in a shared drive is
        the wrong carrier for the half of the roster that describes how somebody signs in.

        Nor is it a subject access answer. The bulk form section 11 refuses is that shape — which
        holds everything one instance knows about one person — and a list every administrator
        already reads on screen does not become it by being downloadable.

        The columns are the ones the import understands, so a club that exports and re-imports gets
        its own people back rather than duplicates: `memberNumber`, `firstName`, `lastName`,
        `email` and `membershipType` are the import's canonical fields, and
        `membershipStartedOn` and `membershipEndedOn` follow them.

        `memberNumber` names one source, because a person may be linked in several and no rule for
        picking between them would be right for every club. `sourceId` says which; without it the
        column is empty for everybody, which is what a club that never imported anything gets.

        `query` and `membershipTypeId` mean exactly what they mean on `/api/admin/roster`, and the
        file holds every matching person rather than a page. The order is the same: last name,
        first name, person id.

        `separator` and `encoding` decide what the receiving spreadsheet makes of the file. A club
        whose tooling expects `windows-1252` gets mangled names from anything else, and the import
        source this club configured already records both — the administrative surface offers them
        from there. UTF-8 is written with a byte order mark, because a spreadsheet that is given
        none guesses, and guesses wrong on the first name that leaves ASCII.

        `POST` rather than `GET`, for one of the two reasons
        `/api/admin/export/person/{personId}` is a `POST`: the file discloses what the club holds
        about every one of its members at once, and that is not a request a browser may make on its
        own from a link somebody sent. It is not written to the change log, though — that log
        records a change against the entity it concerns, and an export changes nothing and names
        no entity. The subject access answer is recorded because answering *that* request is a
        processing activity the law attaches to one person, which is a reason about the person and
        not about the file.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RosterExportRequest" }
      responses:
        "200":
          description: The roster, one row per person.
          headers:
            Content-Disposition:
              description: |
                `attachment` with a fixed ASCII file name carrying the date the file was produced.
                No value a club entered reaches this header.
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/export/bookings:
    post:
      tags: [admin-export]
      operationId: exportBookings
      summary: The confirmed bookings of a period as a CSV file.
      description: |
        What stood on the courts between two dates, one row per court and slot, so a board can put
        a season into a spreadsheet without reading a calendar day by day.

        `from` and `to` are inclusive dates in the club time zone and the period may span at most
        366 days, exactly as `/api/admin/reports/facility-utilisation` defines a period. Confirmed
        occupancy only, for the same reason that report counts it: a cancelled booking occupied
        nothing.

        **It does not name who booked.** The columns are the ones the day grid already shows every
        member — the court, the slot and the card the court was held under — and nothing else. The
        contract's `Allocation.bookedByName` is designed and unbuilt, and an export is the wrong
        place for a product to resolve a member's name for the first time: what a board needs about
        one person is `/api/admin/export/person/{personId}`, which answers for that person alone
        and is recorded when it does.

        `separator` and `encoding` decide what the receiving spreadsheet makes of the file, as they
        do for the roster.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: separator
          in: query
          required: false
          description: The single character between two cells.
          schema: { type: string, pattern: '^[,;|\t]$', minLength: 1, maxLength: 1, default: "," }
        - name: encoding
          in: query
          required: false
          description: |
            One of the names `/api/admin/import/encodings` lists that can write a file; a
            decode-only one is answered `400`. The shape is the one a character set name may take
            at all, so a value that is not a name of one is refused before it reaches the list.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:+-]{0,39}$"
            maxLength: 40
            default: "UTF-8"
      responses:
        "200":
          description: The period's confirmed bookings, one row per court and slot.
          headers:
            Content-Disposition:
              description: |
                `attachment` with a fixed ASCII file name carrying the period it covers.
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/export/audit:
    post:
      tags: [admin-export]
      operationId: exportAuditLog
      summary: The change log as a CSV file.
      description: |
        Every entry `/api/admin/audit` pages through, in one file and in the same order: newest
        first, by `occurredAt` and then by id. The columns are the fields an entry carries there:
        `occurredAt` in the club time zone with its offset, `eventType`, `subjectId`,
        `subjectName`, `actorAccountId`, `actorUsername` and `parameters` as the recorded JSON.
        The interactive log stays paged; this file holds every entry of the period and is written
        while it is read, so its size does not depend on what fits in memory.

        The file ends with the entries recorded before the request arrived, so the entry this
        export records about itself is never in it. A cell that a spreadsheet would read as a
        formula is written with a leading apostrophe.

        Administrators only, as the log itself. The export is recorded as
        `dataexchange.log.exported`, an entry with no subject because it concerns the whole
        instance rather than one entity.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: from
          in: query
          required: false
          description: The first day to include, in the club time zone. Without it the file starts at the first entry.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: The last day to include, in the club time zone. Without it the file ends with the newest entry.
          schema: { type: string, format: date }
        - name: separator
          in: query
          required: false
          description: The single character between two cells.
          schema: { type: string, pattern: '^[,;|\t]$', minLength: 1, maxLength: 1, default: "," }
        - name: encoding
          in: query
          required: false
          description: |
            One of the names `/api/admin/import/encodings` lists that can write a file; a
            decode-only one is answered `400`.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:+-]{0,39}$"
            maxLength: 40
            default: "UTF-8"
      responses:
        "200":
          description: The change log, one row per entry.
          headers:
            Content-Disposition:
              description: |
                `attachment` with a fixed ASCII file name carrying the date the file was produced.
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/export/messages:
    post:
      tags: [admin-export]
      operationId: exportMessageLog
      summary: The message log as a CSV file.
      description: |
        Every entry `/api/admin/messages` pages through, in one file and in the same order, newest
        first. The columns are the fields an entry carries there: `queuedAt` and `settledAt` in
        the club time zone with their offset, `kind`, `state`, `messageId`, `personId`,
        `personName`, `reason` and `statusCode`. Who was written to and when is personal data, so
        the file is for administrators only, as the log is. The interactive log stays paged; this
        file holds every entry of the period and is written while it is read.

        The file ends with the messages queued before the request arrived. A cell that a
        spreadsheet would read as a formula is written with a leading apostrophe. The export is
        recorded as `dataexchange.log.exported`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: from
          in: query
          required: false
          description: The first day to include, in the club time zone. Without it the file starts at the first entry.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: The last day to include, in the club time zone. Without it the file ends with the newest entry.
          schema: { type: string, format: date }
        - name: separator
          in: query
          required: false
          description: The single character between two cells.
          schema: { type: string, pattern: '^[,;|\t]$', minLength: 1, maxLength: 1, default: "," }
        - name: encoding
          in: query
          required: false
          description: |
            One of the names `/api/admin/import/encodings` lists that can write a file; a
            decode-only one is answered `400`.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:+-]{0,39}$"
            maxLength: 40
            default: "UTF-8"
      responses:
        "200":
          description: The message log, one row per message.
          headers:
            Content-Disposition:
              description: |
                `attachment` with a fixed ASCII file name carrying the date the file was produced.
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/export/person/{personId}:
    post:
      tags: [admin-subject-access]
      operationId: exportPersonData
      summary: Answer what this instance holds about one person.
      description: |
        The club is the controller and owes this answer to whoever asks for it. One person per
        call: there is no list form and no bulk form, because a shape that answers a subject
        access request must not double as a way to read the roster.

        The answer holds this person's record, every account they hold, the membership they hold or
        last held, the bookings they made and the bookings somebody else recorded them in, the
        member numbers an import linked them by, and the change log from both sides — the changes
        made to them, and the changes they made.

        Nothing in it describes anybody else. A booking they made lists its courts and times and
        not the people they played with; a booking they were recorded in additionally omits who
        made it and what that person wrote on it; and a change they made names the operation and
        the moment, never the record it touched.

        `POST` rather than `GET`: producing the answer is itself a processing activity and is
        written to the change log, so the request is not one a client may repeat freely or a
        browser may make on its own.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubjectAccessExport" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
