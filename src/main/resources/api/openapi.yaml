      operationId: readStatisticsRange
      summary: The dates a period covering all of the club's bookings would run between.
      description: |
        `firstBookingOn` is the club-local date of the earliest allocation start of any booking,
        confirmed or cancelled, and `null` while there is none. `today` is the club-local date now.
        Reading the sections from `firstBookingOn` to `today` covers everything the club has
        booked. Administrators only.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The bounds of the club's booking history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatisticsRange" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/admin/statistics/utilisation:
    get:
      tags: [admin-statistics]
      operationId: readUtilisationStatistics
      summary: How full the courts were in a period, and when.
      description: |
        Open time comes from the opening hours in force on each day of the period. Court
        availability is not dated, so a
        court counts towards capacity when it is active now or when it held a confirmed allocation
        in the scope being computed: the period for the totals and the hours of the week, the
        bucket for each progression entry. Only confirmed allocations count, and only their minutes inside open
        time. Allocations under the shipped "court closed" card are closures: they are reported
        as `closedMinutes` and taken out of the time a court could have been booked, so occupancy
        is `bookedMinutes / (capacityMinutes - closedMinutes)`. An allocation crossing either end
        of the period contributes the minutes inside it.

        The period spans at most 36,525 days. The progression is bucketed by ISO week (Monday to Sunday)
        for periods of up to 92 days and by calendar month beyond; the first and last bucket are
        cut at the period's ends. Administrators only.

        Every statistics read stops after 30 seconds of database work and answers `503` with
        `urn:courtside:error:statement-timeout`; a shorter period is the remedy.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/StatisticsFrom"
        - $ref: "#/components/parameters/StatisticsTo"
      responses:
        "200":
          description: Utilisation of the period and of the period before it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UtilisationStatistics" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/admin/statistics/bookings:
    get:
      tags: [admin-statistics]
      operationId: readBookingStatistics
      summary: How members booked in a period.
      description: |
        A booking belongs to the period its earliest allocation starts in, whatever became of it
        later; a booking over several courts counts once. Closures are not bookings of members
        and are left out. Series, guests and participant cards are counted over confirmed bookings
        only, because a cancelled booking was not played. Administrators only.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/StatisticsFrom"
        - $ref: "#/components/parameters/StatisticsTo"
      responses:
        "200":
          description: Booking behaviour in the period and in the period before it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingStatistics" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/admin/statistics/members:
    get:
      tags: [admin-statistics]
      operationId: readMemberStatistics
      summary: How many members the club had at the end of a period, and how many of them played.
      description: |
        A membership runs on a day when it started on or before that day and has no end date or
        ends after it. A period reaching past today is read up to today, so a scheduled start or end
        does not count before its day. Members are counted by the membership type of the period
        running on the period's last day. An active member holds a running membership on the period's last
        day and, in a confirmed booking starting in the period, booked it or was recorded as a
        participant. Guests and participant cards are never members.

        Account figures describe the enabled accounts as they are now; a disabled account counts in
        none of them. `lastLoginAt` keeps only the latest sign-in, so for a period in the past the sign-in windows count the accounts whose latest
        sign-in falls inside them. Administrators only.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/StatisticsFrom"
        - $ref: "#/components/parameters/StatisticsTo"
      responses:
        "200":
          description: Members, activity and accounts for the period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberStatistics" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/admin/statistics/messages:
