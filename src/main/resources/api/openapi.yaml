      summary: Issue WebAuthn options within the existing pending password challenge.
      security:
      - csrfToken: []
      responses:
        '200':
          description: The MFA operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnRequestOptions'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/session/mfa/webauthn:
    post:
      tags:
      - session-webauthn
      operationId: completeWebauthnLogin
      summary: Complete a pending password login with a verified enrolled authenticator.
      security:
      - csrfToken: []
      responses:
        '200':
          description: The MFA operation succeeded.
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnAssertionCredential'

  /api/account/sessions:
    get:
      tags: [account]
      operationId: listOwnSessions
      summary: List the signed-in account's active sessions.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Privacy-safe session metadata ordered by most recent activity.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountSession" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [account]
      operationId: endOwnSessions
      summary: End every session of the signed-in account.
      description: Requires a full re-authentication no older than five minutes.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Every session ended after this response completed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/account/sessions/{sessionHandle}:
    delete:
      tags: [account]
      operationId: endOwnSession
      summary: End one session of the signed-in account.
      description: Ending another session requires a full re-authentication no older than five minutes.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: sessionHandle
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{22}$"
      responses:
        "204":
          description: The selected session ended.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/account/locale:
    put:
      tags: [account]
      operationId: changeOwnLocale
      summary: Choose the language this account is written to in.
      description: |
        Available to any authenticated account, for itself. The choice is stored, so the next
        message the instance sends arrives in it; a language picked in the browser alone changes
        what a page shows and nothing that is written.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountLocaleRequest" }
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/account/messages:
    get:
      tags: [account-messages]
      operationId: listOwnMessageChoices
      summary: Which kinds of message this account receives.
      description: |
        Every kind the instance sends, with whether it may be switched off at all and whether this
        account currently receives it. A kind nobody chose about is received: the absence of a
        choice is a yes, so a kind added later reaches people who chose before it existed.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The choices.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MessageChoice" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [account-messages]
      operationId: chooseOwnMessages
      summary: Switch kinds of message off for this account.
      description: |
        The request names every kind this account declines; anything absent from it is received.
        A kind the club must be able to send is refused with
        `urn:courtside:error:message-not-declinable` rather than silently ignored.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageChoiceRequest" }
      responses:
        "204":
          description: Chosen.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/account/messages/channels:
    get:
      tags: [account-messages]
      operationId: listOwnMessageChannels
      summary: Which channels besides the notification centre this account receives messages on.
      description: |
        A channel choice is separate from the kind choice: a declined kind reaches the account on no
        channel, the notification centre included, while a declined channel only stops that channel.
        A channel nobody chose about is on. Credentials, password-reset codes and username reminders
        are mailed whatever this says, because whoever asks for them cannot sign in to read the
        centre.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The channel choices.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MessageChannelChoice" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [account-messages]
      operationId: chooseOwnMessageChannels
      summary: Switch channels off for this account.
      description: The request names every channel this account declines; anything absent from it is on.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageChannelChoiceRequest" }
      responses:
        "204":
          description: Chosen.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/account/notifications:
    get:
      tags: [account-notifications]
      operationId: listOwnNotifications
      summary: The notification centre of the signed-in account, newest first.
      description: |
        Every message addressed to this account, whichever channel also carried it, and only those.
        An entry names what it concerns and links to it by target rather than by address, so the
        client resolves the link to one of its own pages.
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            The opaque `nextCursor` returned by the preceding page. A cursor this account's
            notifications do not contain yields an empty page rather than an error.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/PageLimit"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The account's notifications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/account/notifications/{notificationId}/read:
    post:
      tags: [account-notifications]
      operationId: markOwnNotificationRead
      summary: Mark one of this account's notifications read.
      description: |
        Marking an entry that is already read keeps the time it was first read. An id this account
        holds no notification under, another account's included, answers
        `urn:courtside:error:notification-not-found`.
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Read.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/courts:
    get:
      tags: [courts]
      operationId: listCourts
      summary: The club's active courts.
      security: []
      responses:
        "200":
          description: The courts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicCourt" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/occupancy:
    get:
      tags: [occupancy]
      operationId: getCourtOccupancy
      summary: Whether each active court is occupied now, and how many minutes until its next booking.
      description: |
        One `name=value` line per value, two per active court in the order of its number:
        `court<N>.occupied` is `1` while a booking whose card signals occupancy runs on court `N`
        and `0` otherwise, and `court<N>.minutes` counts the whole minutes, rounded down, until the
        next such booking starts. It is `0` while the court is occupied and `1440` when nothing
        starts within the next 24 hours. Nothing about who booked or which card leaves the instance.

        The key travels in the query because a Loxone Virtual HTTP Input sets no request headers.
        Building automation polls this every minute or so; an outage heals on the next poll.
      security: []
      parameters:
        - name: key
          in: query
          required: false
          description: The occupancy key a board created. Without one configured every poll is refused.
          schema: { type: string }
      responses:
        "200":
          description: The occupancy of every active court.
          content:
            text/plain:
              schema: { type: string }
              example: |
                court1.occupied=1
                court1.minutes=0
                court2.occupied=0
                court2.minutes=37
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          description: |
            The key is missing, wrong or revoked, or no key is configured. The answer carries no
            body, because the pollers this serves cannot parse one.
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/opening-hours:
    get:
      tags: [opening-hours]
      operationId: listOpeningHours
      summary: When the facility is open, by weekday.
      security: []
      responses:
        "200":
          description: One entry per weekday.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OpeningHours" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/booking-grid:
    get:
      tags: [opening-hours]
      operationId: getBookingGrid
      summary: The time zone, slot duration and weekly opening windows that define the booking grid.
      description: |
        Seasons, holidays and court closures come back only where they overlap the days from `from`
        to `to`, both inclusive in the club's time zone. A missing bound takes the other one, and
        without either the range is today.
      security: []
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: The booking grid configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGrid" }
        "400":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/config:
    get:
      tags: [club-config]
      operationId: getClubConfig
      summary: The club's name and branding.
      security: []
      responses:
        "200":
          description: The configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClubConfig" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/config/logo:
    get:
      tags: [club-config]
      operationId: getClubLogo
      summary: The logo stored by this Courtside instance.
      security: []
      parameters:
        - name: v
          in: query
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
          description: The content digest from the effective logo URL. Matching versions are immutable.
      responses:
        "200":
          description: The uploaded logo.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/config/icon:
    get:
      tags: [manifest]
      operationId: getAppIcon
      summary: The installed app's icon as a PNG.
      description: |
        Rasterised from the uploaded club logo, or from the Courtside mark while none is uploaded.
        A logo given only as a URL is not fetched, so such a club gets the Courtside mark here. A
        maskable icon is opaque and keeps its content inside the central 80 % a launcher may crop
        to. A matching version is immutable; any other version is answered with the current icon
        and no caching, so an icon an installed app still names never breaks.
      security: []
      parameters:
        - name: size
          in: query
          required: true
          schema: { type: integer, enum: [180, 192, 512] }
        - name: purpose
          in: query
          schema: { type: string, enum: [any, maskable], default: any }
        - name: v
          in: query
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
          description: The icon version the manifest names.
      responses:
        "200":
          description: The icon.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
        "400":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /manifest.webmanifest:
    get:
      tags: [manifest]
      operationId: getWebManifest
      summary: The installable web application's club-specific metadata.
      security: []
      responses:
        "200":
          description: The web application manifest.
          content:
            application/manifest+json:
              schema: { $ref: "#/components/schemas/WebManifest" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/booking-cards:
    get:
      tags: [cards]
      operationId: listBookableCards
      summary: The booking cards the caller may use.
      description: |
        Filtered by the caller's roles: a card gated behind a role they do not hold is absent
        rather than shown and refused. Authenticated despite the path — the answer depends on who
        is asking.
      responses:
        "200":
          description: The cards this caller may place.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicBookingCard" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/booking-card-legend:
    get:
      tags: [cards]
      operationId: listBookingCardLegend
      summary: The active booking cards shown in the court-plan legend.
      description: A public label-and-colour projection without booking permissions or rule details.
      security: []
      responses:
        "200":
          description: The cards represented by the court plan.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BookingCardLegendEntry" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/participant-cards:
    get:
      tags: [cards]
      operationId: listParticipantCards
      summary: The active participant cards.
      description: What can fill a player slot without being a person — a ball machine, or an open slot.
      responses:
        "200":
          description: The cards.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicParticipantCard" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/participant-members:
    post:
      tags: [participants]
      operationId: searchParticipantMembers
      x-courtside-state-invariant: true
      summary: Members matching a name fragment for participant selection.
      description: |
        Any authenticated account may search the member directory by a name fragment,
        matched case-insensitively anywhere in the full name and returning at most 20 rows with no
        contact details. This reach is deliberate, for the co-player picker — the way
        `Allocation.bookedByName` documents its own visibility rule rather than leaving it
        implicit. The searching person is left out, because a booking already gives its booker a
        slot. The current authorization does not verify club membership. Before authenticated
        external guest accounts are introduced, this endpoint must gain that boundary so those
        accounts do not inherit the directory reach.

        Reading the directory is a `POST` because the fragment is part of somebody's name, and a
        name in a URL outlives the request in browser history, an intermediary's log and an
        operator's diagnostics. It changes nothing, and `SafeMethodStateInvarianceTest` holds it
        to that alongside the safe methods.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParticipantMemberSearchRequest" }
      responses:
        "200":
          description: Matching members ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicParticipantMember" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/bookings:
    get:
      tags: [bookings]
      operationId: listAllocations
      summary: The occupancy grid for one day or one week.
      security: []
      description: |
        Either `date` for one day or `from` and `to` for at most seven days, both inclusive. The
        instance's own time zone decides where a day begins. The bound keeps a caller from asking
        for a year; the court plan reads its week at once instead of one request per day.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: One entry per occupied court and slot.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Allocation" }
        "400":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Book one or more courts for a slot.
      description: |
        Non-overlap is decided by the database, not by a check beforehand — time passes between
        checking and inserting. A collision is a `409`, and it is authoritative. Every booking
        attempt carries an idempotency key; retrying the same request returns the original booking.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: An opaque key unique to this booking attempt for the authenticated account.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[\x21-\x7E]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: Booked.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingCreated" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A court was taken in the meantime, or the idempotency key belongs to another request.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: One or more booking rules refused it.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/booking-eligibility:
    get:
      tags: [bookings]
      operationId: getBookingEligibility
      summary: Report standing rule violations that prevent the signed-in account from booking.
      description: |
        Returns coded violations for the caller without publishing the rule set or membership type
        behind them. Slot-specific rules remain authoritative when a booking is submitted.
      responses:
        "200":
          description: The caller's current standing booking eligibility.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingEligibility" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/bookings/{id}:
    delete:
      tags: [bookings]
      operationId: cancelBooking
      summary: Cancel a booking.
      description: |
        The creator, an administrator, or an account currently allowed by the booking card may
        cancel the booking. Cards without role restrictions do not grant management access to
        unrelated accounts.
        A configured cancellation deadline is evaluated against the booking holder's current
        rule set. Administrators override it. Cancelling exactly at the deadline is allowed.
        A booking the caller may not act on is answered `404` with
        `urn:courtside:error:booking-not-found`, the same answer an id naming no booking
        gets: whether an id is real is not something a refusal discloses.
        Somebody cancelling another holder's booking may name a `reason`, which the holder and
        the players are told. The holder cancelling their own booking may not: a `reason` then
        answers `400` with `urn:courtside:error:cancellation-reason-not-allowed` and cancels
        nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: reason
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CancellationReason" }
      responses:
        "204":
          description: Cancelled.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The booking holder's rule set no longer permits cancellation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/bookings:
    get:
      tags: [bookings]
      operationId: listPersonalBookings
      summary: The signed-in account's bookings.
      description: |
        Confirmed and cancelled bookings in three views that never share a booking. `UPCOMING`
        holds the confirmed bookings that have not ended yet, soonest first, so the first page
        always carries the account's next booking however often it cancelled. `CANCELLED` holds
        the cancelled bookings whose date is still ahead, soonest first. `HISTORY` holds every
        booking that has ended, cancelled or not, most recent first.
      parameters:
        - name: view
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PersonalBookingView"
            default: UPCOMING
        - name: cursor
          in: query
          required: false
          description: |
            The opaque `nextCursor` returned by the preceding page. A cursor this account's
            bookings do not contain yields an empty page rather than an error: a booking is
            cancelled and never removed, so an id that came from this list keeps resolving, and
            one that did not come from it belongs to somebody else.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: The bookings created by this account in the requested view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBookingPage"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/door-codes:
    get:
      tags: [door-codes]
      operationId: listMembersDoorCodes
      summary: The codes of the doors open to every member.
      description: |
        The static codes of the active access points open to members, by name. Empty for an account
        whose person holds no membership period covering today.
      responses:
        "200":
          description: The codes, possibly none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessCode" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/dependants:
    get:
      tags: [dependants]
      operationId: listDependants
      summary: The people the signed-in account acts for as a guardian today.
      description: |
        Every dependant whose relationship with the signed-in account holds on the club's today,
        with the actions it grants and the day it ends. A relationship that has ended, a dependant
        without an account and a guardian whose own account is disabled list nothing. Names are
        all this shows of a dependant; the relationship grants no other personal data.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The dependants, by last and first name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dependant" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/dependants/{personId}/bookings:
    get:
      tags: [dependant-bookings]
      operationId: listDependantBookings
      summary: A dependant's bookings, for a guardian granted to view them.
      description: |
        The bookings the dependant's account holds, in the views and shape of
        `listPersonalBookings`, those a guardian made for the dependant included.

        Somebody the caller acts for on no relationship holding today, an ended one included, is
        answered `404` with `urn:courtside:error:dependant-not-found`. A relationship that does not
        grant `VIEW_BOOKINGS` is answered `403` with `urn:courtside:error:guardian-action-not-granted`
        and the code `guardianship.actionNotGranted` naming the action.
      parameters:
        - $ref: "#/components/parameters/DependantPersonId"
        - name: view
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PersonalBookingView"
            default: UPCOMING
        - name: cursor
          in: query
          required: false
          description: The opaque `nextCursor` of the preceding page; one the dependant's bookings do not contain ends the list.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The dependant's bookings in the requested view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalBookingPage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [dependant-bookings]
      operationId: createDependantBooking
      summary: Book for a dependant, for a guardian granted to book.
      description: |
        The booking is held by the dependant's account and the dependant takes the first player
        place, as if they had booked themself. Every rule, quota, card and booking window is
        measured against the dependant and their roles; the guardian's own roles, an administrator's
        included, override nothing here. The guardian is recorded as the one who acted.

        The idempotency key is scoped to the guardian acting for this dependant, so it never meets a
        key the dependant or another guardian used.

        A disabled dependant account is answered `409` with
        `urn:courtside:error:dependant-account-disabled`. The refusals for an unknown dependant and
        an action not granted are those of `listDependantBookings`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DependantPersonId"
        - name: Idempotency-Key
          in: header
          required: true
          description: An opaque key unique to this booking attempt for the guardian acting for this dependant.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[\x21-\x7E]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: Booked for the dependant.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingCreated" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A court was taken in the meantime, the idempotency key belongs to another request, or the dependant's account is disabled.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: One or more booking rules refused it for the dependant.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/dependants/{personId}/bookings/{bookingId}:
    delete:
      tags: [dependant-bookings]
      operationId: cancelDependantBooking
      summary: Cancel a dependant's booking, for a guardian granted to cancel.
      description: |
        Only a booking the dependant's account holds, and in the dependant's name: the dependant's
        cancellation deadline applies and no reason may be given, as when the holder cancels. A
        booking the dependant does not hold is answered `404` with
        `urn:courtside:error:booking-not-found`. The refusals for an unknown dependant and an
        action not granted are those of `listDependantBookings`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DependantPersonId"
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Cancelled.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The dependant's cancellation deadline has passed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/dependants/{personId}/notifications:
    get:
      tags: [dependant-notifications]
      operationId: listDependantNotifications
      summary: A dependant's notification centre, for a guardian granted to read their messages.
      description: |
        The entries of `listOwnNotifications` as the dependant's account holds them, newest first.
        Reading here marks nothing read: what the dependant has not read stays unread for them.
        The refusals for an unknown dependant and an action not granted are those of
        `listDependantBookings`, with `READ_MESSAGES` as the action.
      parameters:
        - $ref: "#/components/parameters/DependantPersonId"
        - name: cursor
          in: query
          required: false
          description: The opaque `nextCursor` of the preceding page; one the dependant's notifications do not contain ends the list.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/PageLimit"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The dependant's notifications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/dependants/{personId}/credentials:
    post:
      tags: [dependants]
      operationId: requestDependantCredentials
      summary: Have the instance send a dependant's account new credentials, for a guardian granted account tasks.
      description: |
        The same issue as the board's `requestAccountCredentials`, under the same limits: the
        credential goes to the dependant's address, appears in no response, and whatever was issued
        before stops working. The change log records the guardian as the one who asked.

        A deactivated dependant account is answered `409` with
        `urn:courtside:error:account-deactivated`, one whose person has no address with
        `urn:courtside:error:account-address-missing`, and too many requests for the account
        `429` with `urn:courtside:error:credential-issue-rate-limited`. The refusals for an unknown
        dependant and an action not granted are those of `listDependantBookings`, with
        `ACCOUNT_TASKS` as the action. A dependant whose account holds the administrator role is
        refused the same way with the code `guardianship.administratorCredentials`, whatever the
        relationship grants.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DependantPersonId"
      responses:
        "204":
          description: Requested.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/participations:
    get:
      tags: [bookings]
      operationId: listOwnParticipations
      summary: The bookings this member is recorded in without having made them.
      description: |
        A member may name any other member as a co-player, and the named member is not asked
        first. This list is how they find out, and `DELETE /api/my/participations/{bookingId}` is
        how they object. Bookings this account made itself are not repeated here — `GET
        /api/my/bookings` carries those.

        A participation carries no name: not the booker's and not the other participants'. Which
        court, when, and under which card is what an objection needs, and `Allocation.bookedByName`
        states that member-facing responses resolve no name at all.
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            The opaque `nextCursor` returned by the preceding page. A cursor this member's
            participations do not contain yields an empty page rather than an error.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Bookings this member is named in, newest occurrence first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipationPage"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/participations/{bookingId}:
    delete:
      tags: [bookings]
      operationId: removeOwnParticipation
      summary: Take this member out of a booking somebody else made.
      description: |
        Being recorded as having played with somebody is the member's own to refuse, so this
        needs no approval from whoever made the booking. What goes is this member's place in it;
        the booking keeps its court, its card and every other participant, and a booking left
        with fewer players than its card allows is not corrected — the objection is not a
        rebooking.

        A booking this member is not recorded in answers `404`, which is also the answer to a
        second attempt. A cancelled booking keeps its participants as they were and answers
        `409` with `urn:courtside:error:participation-booking-cancelled`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: The member is no longer recorded in the booking.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/waitlist:
    get:
      tags: [waitlist]
      operationId: listOwnWaitlistEntries
      summary: This member's own waitlist entries whose slot has not ended.
      description: |
        Only the member's own entries. No response names another waiting member, how many wait or
        where this entry stands in its queue. An offer whose deadline has passed reads as
        `EXPIRED` even before the sweep has passed it on.
      responses:
        "200":
          description: The member's entries, earliest slot first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: { $ref: "#/components/schemas/WaitlistEntry" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [waitlist]
      operationId: joinWaitlist
      summary: Queue for a court and time somebody else holds.
      description: |
        Joining checks the card, the players and every booking rule as a booking of that slot
        would, and it is the member's consent to hear of an offer in the notification centre. A
        slot nobody else holds answers `409` with `urn:courtside:error:waitlist-slot-not-taken`,
        a second open entry on the same court at an overlapping time `409` with
        `urn:courtside:error:waitlist-entry-exists`, and a member holding 20 entries whose slot
        has not ended `409` with `urn:courtside:error:waitlist-limit-reached`. When the slot
        frees, the first eligible member in the queue receives an offer that reserves it for the
        club's offer window, ending at the slot's start at the latest.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinWaitlistRequest" }
      responses:
        "201":
          description: Queued. The entry is read back from the list of the member's own entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistJoined" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The slot is not held by somebody else, or the member already waits for it.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: One or more booking rules refused the slot.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/waitlist/{entryId}:
    delete:
      tags: [waitlist]
      operationId: leaveWaitlist
      summary: Leave a waitlist, or decline its offer.
      description: |
        An open offer passes to the next eligible member at once. Leaving an entry that is
        already closed changes nothing. Another member's entry answers `404` with
        `urn:courtside:error:waitlist-entry-not-found`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: The entry is closed.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/waitlist/{entryId}/acceptance:
    post:
      tags: [waitlist]
      operationId: acceptWaitlistOffer
      summary: Take the offered slot as a booking.
      description: |
        Turns the reservation into an ordinary booking with the card, players and note given on
        joining, in one transaction and under every booking rule. Accepting again answers with
        the same booking. An entry without an open offer answers `409` with
        `urn:courtside:error:waitlist-no-offer`; a refused rule answers `422` and leaves the
        offer standing until its deadline.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Booked.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingCreated" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The entry holds no open offer, or the court was taken.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: One or more booking rules refused it.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/bookings/{bookingId}/partner-invitation:
    put:
      tags: [partner-search]
      operationId: publishPartnerInvitation
      summary: Offer the place the partner marker holds to other members.
      description: |
        Only the booking's holder may offer its place, and only while the booking stands, has not
        started, is not part of a series and holds the "looking for a partner" participant card.
        Offering it again changes nothing. Another account's booking answers `404` with
        `urn:courtside:error:booking-not-found`; a booking without such a place answers `409` with
        `urn:courtside:error:partner-place-unavailable`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: The place is offered.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The booking holds no place a partner could take.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [partner-search]
      operationId: withdrawPartnerInvitation
      summary: Stop offering the booking's open place.
      description: |
        Withdrawing a place that is not offered changes nothing. Another account's booking answers
        `404` with `urn:courtside:error:booking-not-found`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: The place is no longer offered.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/bookings/{bookingId}/emergency-code:
    post:
      tags: [emergency-codes]
      operationId: requestEmergencyCode
      summary: Ask for the emergency code of one's own booking.
      description: |
        Answers the emergency codes of the booking's access points whose codes the access-control
        system issues. Only the booker and the booking's players may ask, only from the booking's
        start less the club's lead until its end plus the club's lag, and every answer is recorded
        in the audit log without the code. Anybody else, a request outside that window and a
        booking whose access points keep no emergency code answer `409` with
        `urn:courtside:error:emergency-code-refused` and a violation naming the reason. An unknown
        booking answers `404`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The emergency codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmergencyAccess" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/participations/{bookingId}/emergency-code:
    post:
      tags: [emergency-codes]
      operationId: requestParticipationEmergencyCode
      summary: Ask for the emergency code of a booking one plays in.
      description: |
        Answers the emergency codes of the booking's access points whose codes the access-control
        system issues. Only the booker and the booking's players may ask, only from the booking's
        start less the club's lead until its end plus the club's lag, and every answer is recorded
        in the audit log without the code. Anybody else, a request outside that window and a
        booking whose access points keep no emergency code answer `409` with
        `urn:courtside:error:emergency-code-refused` and a violation naming the reason. An unknown
        booking answers `404`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The emergency codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmergencyAccess" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/my/bookings/{bookingId}/check-in:
    post:
      tags: [attendance]
      operationId: checkIn
      summary: Check in for one's own booking.
      description: |
        Records the booking as attended. It opens 15 minutes before the start and closes at the
        end. A club that records no attendance answers `409` with
        `urn:courtside:error:attendance-not-tracked`; outside the window, on a cancelled booking or
        after a recorded no-show the answer is `409` with `urn:courtside:error:check-in-closed`.
        Checking in again changes nothing. A booking somebody else holds answers `404` like one
        that does not exist.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Checked in.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/attendance-policy:
    get:
      tags: [admin-attendance]
      operationId: getAttendancePolicy
      summary: Whether the club records attendance and when it releases an unattended court.
      responses:
        "200":
          description: The attendance policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendancePolicy" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [admin-attendance]
      operationId: changeAttendancePolicy
      summary: Switch attendance on or off and set the release time.
      description: |
        A release time without attendance answers `400` with
        `urn:courtside:error:attendance-policy-invalid`. Switching attendance off keeps every
        recorded attendance but lets none of it count.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendancePolicy" }
      responses:
        "200":
          description: The stored policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendancePolicy" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/bookings/{bookingId}/attendance:
    put:
      tags: [admin-attendance]
      operationId: recordAttendance
      summary: Record that the players of a started booking came, or did not.
      description: |
        Replaces what was recorded before, a lifted no-show included. A booking that has not
        started, one cancelled before its start and one nobody holds answer `409` with
        `urn:courtside:error:attendance-not-recordable`; a club that records no attendance answers
        `409` with `urn:courtside:error:attendance-not-tracked`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceRequest" }
      responses:
        "204":
          description: Recorded.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [admin-attendance]
      operationId: clearAttendance
      summary: Remove a recorded attendance, so the booking counts as unrecorded again.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Nothing is recorded for the booking any more.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/no-shows:
    get:
      tags: [admin-attendance]
      operationId: listNoShows
      summary: The no-shows that still count against a person's account, latest first.
      description: |
        A person without an account has none. An unknown person answers `404` with
        `urn:courtside:error:no-show-person-not-found`.
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The counting no-shows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NoShow" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/roster/{personId}/no-shows/lift:
    post:
      tags: [admin-attendance]
      operationId: liftNoShows
      summary: Stop every recorded no-show of a person from counting, which lifts a no-show limit.
      description: |
        The no-shows stay recorded; a no-show recorded afterwards counts again. An unknown person
        answers `404` with `urn:courtside:error:no-show-person-not-found`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: How many no-shows were lifted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoShowsLifted" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/partner-invitations:
    get:
      tags: [partner-search]
      operationId: listOpenPlaces
      summary: The open places this account may take.
      description: |
        Lists every offered place in a booking that stands and has not started, whose card this
        account may book, which it neither holds nor plays in. An account barred from booking sees
        none. An entry names no person and no booking: the slot, the courts and the card are all
        that is offered.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The open places, earliest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OpenPlace" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/partner-invitations/{invitationId}/acceptance:
    post:
      tags: [partner-search]
      operationId: acceptPartnerInvitation
      summary: Take an open place.
      description: |
        Records this account's member in the place the marker held, in one transaction with the
        booking locked, so two members taking one place leave exactly one of them in it. A place
        that is taken, withdrawn, started, cancelled or not offered to this account answers `404`
        with `urn:courtside:error:partner-invitation-not-found`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: The member plays in the booking.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/reserved-slots:
    get:
      tags: [waitlist]
      operationId: listReservedSlots
      summary: The courts held for a waiting member on one day or one week.
      security: []
      description: |
        A freed slot reserved for the member whose turn it is stays unavailable to everybody else
        until the offer is taken, declined or passed on. Nobody is named; only the holder sees
        `ownEntryId`, so the court plan can lead them to the offer. Either `date` for one day or
        `from` and `to` for at most seven days, both inclusive.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: One entry per reserved court and slot.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReservedSlot" }
        "400":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/managed/bookings:
    get:
      tags: [bookings]
      operationId: listManagedAppointments
      summary: Appointments the signed-in account is currently authorized to manage.
      description: |
        Uses each booking card's current allowed roles. Cards without role restrictions do not
        expose appointments to unrelated accounts. Administrators may manage every appointment.
      parameters:
        - name: view
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ManagedAppointmentView"
            default: UPCOMING
        - name: courtId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: cardId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          description: |
            The opaque `nextCursor` returned by the preceding page. A cursor naming an appointment
            these roles do not currently manage yields an empty page rather than an error: the
            roles that manage a card are configuration a board may change, so a cursor collected
            while the card was still in reach names an appointment that has since left it.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        "200":
          description: Appointments visible through the caller's current management roles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedAppointmentPage" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/managed/bookings/{id}:
    get:
      tags: [bookings]
      operationId: getManagedAppointment
      summary: Management details for one appointment.
      description: |
        Internal notes and participant display names are returned only after authorization.
        A booking the caller may not act on is answered `404` with
        `urn:courtside:error:booking-not-found`, the same answer an id naming no booking
        gets: whether an id is real is not something a refusal discloses.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Details required to manage the appointment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedAppointmentDetail" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/booking-series-preview:
    post:
      tags: [booking-series]
      operationId: previewSeries
      summary: What a recurrence would produce, without writing anything.
      description: |
        Mandatory before creating. Open to any authenticated caller, including one who could not
        actually place the card — the card's allowed roles are enforced when the series is
        created, exactly as it is for a single booking.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesRuleRequest" }
      responses:
        "200":
          description: Every occurrence the rule produces, with what would block it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesPreview" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/booking-series:
    post:
      tags: [booking-series]
      operationId: createSeries
      summary: Create the occurrences the caller confirmed.
      description: |
        `confirmedStarts` names exactly the occurrences to create, and each must be one the
        preview offered. What cannot be created is reported as skipped rather than failing the
        request — a single blocked date does not undo the other twenty-five.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSeriesRequest" }
      responses:
        "201":
          description: Created, with whatever was skipped.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesCreated" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/booking-series/{id}:
    delete:
      tags: [booking-series]
      operationId: cancelSeries
      summary: Cancel occurrences of a series.
      description: |
        Calendar semantics — this one, this and all following, or the whole series. The creator,
        an administrator, or an account currently allowed by the booking card may cancel them.
        A booking the caller may not act on is answered `404` with
        `urn:courtside:error:booking-not-found`, the same answer an id naming no booking
        gets: whether an id is real is not something a refusal discloses.
        The series is read only after that: a `seriesId` naming nothing and one the booking is
        not part of are both answered `400` with `booking.series.bookingNotInSeries`.
        Cancellation is atomic. If the booking holder's current rule set refuses any affected
        occurrence, none of the occurrences is cancelled. Administrators override that deadline.
        A `reason` follows the rule of a single booking's cancellation: only somebody other than
        the holder may name one, and the holder is told it with the cancelled occurrences.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fromBookingId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          required: true
          schema: { $ref: "#/components/schemas/CancelScope" }
        - name: reason
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CancellationReason" }
      responses:
        "204":
          description: Cancelled.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: At least one affected occurrence is past the cancellation deadline.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/booking-series/{id}/move/preview:
    post:
      tags: [booking-series]
      operationId: previewSeriesMove
      summary: Where a move would land, and what would block it.
      description: |
        Available to the creator, an administrator, or an account currently allowed by the
        booking card. Authorization uses the card's current configuration. Each occurrence keeps
        its original local date; the request defines its target time of day, duration and courts.
        A booking the caller may not act on is answered `404` with
        `urn:courtside:error:booking-not-found`, the same answer an id naming no booking
        gets: whether an id is real is not something a refusal discloses.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: One entry per covered occurrence, retaining its original local date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovePreview" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/booking-series/{id}/move:
    post:
      tags: [booking-series]
      operationId: moveSeries
      summary: Move occurrences of a series.
      description: |
        All or nothing — if any occurrence cannot move, none does. The creator, an administrator,
        or an account currently allowed by the booking card may move the occurrences. Each one
        keeps its original local date; the request defines its target time of day, duration and
        courts.
        A booking the caller may not act on is answered `404` with
        `urn:courtside:error:booking-not-found`, the same answer an id naming no booking
        gets: whether an id is real is not something a refusal discloses.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: Moved while retaining every occurrence's original local date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoveExecuted" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Some occurrences cannot move; none was moved.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

