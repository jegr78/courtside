          description: The category is no longer configured.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/retention/previews:
    post:
      tags: [admin-retention]
      operationId: previewRetention
      summary: Count what a retention run would change now, and who it cannot reach yet.
      description: |
        The preview changes no record. It fixes the cut-off of every configured category and the
        former members it would remove, and a run executes exactly that. A former member who is
        eligible by date but cannot be removed yet is listed with the reason, never removed.

        `BOOKINGS` pseudonymises bookings and series that ended before the cut-off: the booker, the
        canceller, the mover, notes, the players who were members and the names of guests leave
        the booking, while its card, courts, times, status and the number of guest places stay, so
        utilisation and booking counts keep their figures. `FORMER_MEMBERS` removes a person whose
        membership ended before the cut-off and whose accounts have not signed in or been opened
        since, together with those accounts and everything they hold. The change log keeps its
        entries, which then name an identifier nobody holds.

        A preview is kept for a limited time and only the account that created it can run it.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "201":
          description: What a run would change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPreview" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/retention/previews/{id}/run:
    post:
      tags: [admin-retention]
      operationId: runRetention
      summary: Apply exactly the reviewed retention preview.
      description: |
        The run uses the cut-offs the preview fixed. A former member who stopped being eligible
        since the preview, because they signed in, rejoined or were added to a booking, is skipped
        and counted, never removed. The run is one transaction, and the preview is used up by it:
        two requests for the same preview run it once, the second is answered `404`.

        This operation requires a full reauthentication within the configured window, capped at
        five minutes. Missing or stale proof is answered `403` with
        `urn:courtside:error:recent-authentication-required` and changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: What the run changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionRun" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

