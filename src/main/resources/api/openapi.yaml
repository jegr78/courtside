      summary: Add a person to the roster.
      description: |
        The person is created without an account and without a membership, which is what a child
        or an imported dormant record looks like.

        An email address is not unique across the roster: a club enrols children under a parent's
        address, so a second person carrying an address the roster already holds is accepted. It
        may also be `null`, because a club's own member list carries people it has no address for.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
