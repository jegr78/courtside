  /api/bookings:
    get:
      tags: [bookings]
      operationId: listAllocations
      summary: The occupancy grid for one day.
      description: |
        A day, not a range: the grid a member reads is one day wide, and the instance's own time
        zone decides where that day begins. A range would let a caller ask for a year.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: One entry per occupied court and slot.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Allocation" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Book one or more courts for a slot.
      description: |
        Non-overlap is decided by the database, not by a check beforehand — time passes between
        checking and inserting. A collision is a `409`, and it is authoritative.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: Booked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingCreated" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A court was taken in the meantime.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: One or more booking rules refused it.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/bookings/{id}:
    delete:
      tags: [bookings]
      operationId: cancelBooking
      summary: Cancel a booking.
      description: A member may cancel their own; an admin may cancel any.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
