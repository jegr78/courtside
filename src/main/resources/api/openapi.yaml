  /api/admin/access-grants/probe:
    post:
      tags: [admin-access-grants]
      operationId: probeAccessControl
      summary: Ask for a fresh check of the access-control system.
      description: |
        The background pass checks the system at the start of its next run; the overview shows the answer
        once it has. Without an access-control system this answers `409` with
        `urn:courtside:error:access-control-not-connected`.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "202":
          description: The check is requested.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: No access-control system is connected.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/access-grants/{id}/retry:
    post:
      tags: [admin-access-grants]
      operationId: retryAccessGrant
      summary: Send a failing access grant to the access-control system again.
      description: |
        A `FAILING` grant gets a fresh attempt count and is sent again by the next pass, which is started at
        once. An unknown grant answers `404` with `urn:courtside:error:access-grant-not-found`; a grant that
        is not failing answers `409` with `urn:courtside:error:access-grant-not-failing`. Without an
        access-control system it answers `409` with `urn:courtside:error:access-control-not-connected`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The grant as it stands once the retry is recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccessGrant" }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such access grant.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: The access grant is not failing.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"

