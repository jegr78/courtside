  /api/admin/opening-hours:
    get:
      tags: [admin-opening-hours]
      operationId: listOpeningHoursForAdmin
      summary: Opening hours for every weekday, including the closed ones.
      responses:
        "200":
          description: One entry per weekday.
          content:
            application/json:
              schema:
                type: array
