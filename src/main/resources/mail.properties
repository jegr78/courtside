account.welcome.subject={clubName}: Welcome to Courtside, {firstName}
account.welcome.body=Hello {firstName},\n\n{clubName} has created a Courtside account for you. That is where you book the club's courts.\n\nYour sign-in details follow in a separate message. Courtside never sends a link together with a password. A message that carries both does not come from {clubName}.\n\n{clubName}\n{instanceLink}
credentials.newAccount.subject={clubName}: Courtside account for {firstName}
credentials.newAccount.body=Hello {firstName},\n\n{clubName} has created a Courtside account for you.\n\nUsername: {username}\nOne-time password: {credential}\n\nSign in and replace this password with one of your own. The one-time password expires on {expiresOn}. If it has expired, request a reset code from the sign-in page.\n\nNobody at the club can view this password.\n\n{clubName}
credentials.passwordReset.subject={clubName}: new sign-in details for {firstName}
credentials.passwordReset.body=Hello {firstName},\n\n{clubName} has issued a new one-time password for your Courtside account.\n\nUsername: {username}\nOne-time password: {credential}\n\nSign in and replace this password with one of your own. The one-time password expires on {expiresOn}.\n\nIf you did not request this, reply to this message.\n\n{clubName}
account.usernameReminder.subject={clubName}: your Courtside username
account.usernameReminder.body=Hello {firstName},\n\nSomebody requested the usernames registered to this email address at {clubName}. This account uses:\n\nUsername: {username}\n\nYour account and password have not changed. If you also forgot the password, request a reset code from the sign-in page using this username.\n\nYou can ignore this message if you did not request it.\n\n{clubName}
account.passwordResetCode.subject={clubName}: your password reset code
account.passwordResetCode.body=Hello {firstName},\n\nSomebody requested a password reset code for the account below. Your password and open sessions remain unchanged until the code is used.\n\nUsername: {username}\nCode: {resetCode}\n\nOpen "Forgotten your password or username?" from the sign-in page. Enter this code and choose a new password. The code expires on {expiresAt}.\n\nYou can ignore this message if you did not request it.\n\n{clubName}
booking.court=Court {number}
booking.confirmed.subject={clubName}: booking confirmed for {day} at {from}
booking.confirmed.body=Hello {firstName},\n\nYour booking at {clubName} is confirmed.\n\n{day}\n{from} to {to}\nCourt: {courts}\nBooking type: {card}\n{accessCodes}\n\nYou can cancel the booking in Courtside.\n\n{clubName}\n{instanceLink}
booking.playerRecorded.subject={clubName}: added to a booking on {day}
booking.playerRecorded.body=Hello {firstName},\n\nSomebody added you as a player to this booking at {clubName}:\n\n{day}\n{from} to {to}\nCourt: {courts}\nBooking type: {card}\n\nIf you are not playing, open the booking in Courtside and remove yourself. You do not need approval from the person who booked.\n\n{clubName}\n{instanceLink}
booking.playerWithdrew.subject={clubName}: {player} left your booking
booking.playerWithdrew.body=Hello {firstName},\n\n{player} has removed themselves from your booking at {clubName}.\n\n{day}\n{from} to {to}\nCourt: {courts}\n\nThe booking remains in place.\n\n{clubName}\n{instanceLink}
booking.partnerFound.subject={clubName}: {player} is playing with you
booking.partnerFound.body=Hello {firstName},\n\n{player} has taken the open place in your booking at {clubName}.\n\n{day}\n{from} to {to}\nCourt: {courts}\n\nYour search for a partner is over.\n\n{clubName}\n{instanceLink}
booking.placeTaken.subject={clubName}: you are playing on {day}
booking.placeTaken.body=Hello {firstName},\n\nyou have taken an open place in this booking at {clubName}:\n\n{day}\n{from} to {to}\nCourt: {courts}\nBooking type: {card}\n\nIf you are not playing after all, open the booking in Courtside and remove yourself.\n\n{clubName}\n{instanceLink}
booking.displaced.court=A court in your booking has been deactivated
booking.displaced.card={card} is no longer available
booking.displaced.day=The club is now closed on that day
booking.displaced.subject={clubName}: change affecting your booking on {day}
booking.displaced.body=Hello {firstName},\n\n{closure}.\n\nAffected booking at {clubName}:\n{day}\n{from} to {to}\nCourt: {courts}\nBooking type: {card}\n\nCourtside has not cancelled the booking. Contact your club if you need to know what happens next.\n\n{clubName}\n{instanceLink}
booking.displaced.hours=The opening hours no longer include your booking
booking.displaced.holiday=A holiday changes the opening hours on that day, and they no longer include your booking
booking.displaced.season=The opening hours for the season no longer include your booking
booking.displaced.courtClosed=The club has closed the court on that day
booking.reminder.subject={clubName}: booking reminder for {day}
booking.reminder.body=Hello {firstName},\n\nThis is a reminder of your booking at {clubName}.\n\n{day}\n{from} to {to}\nCourt: {courts}\nBooking type: {card}\n{accessCodes}\n\nIf you cannot play, cancel the booking in Courtside so another member can use the court.\n\n{clubName}\n{instanceLink}
booking.access.heading=Access code, valid from {validFrom} to {validUntil}:
booking.access.code={accessPoint}: {code}
booking.accessCodeChanged.subject={clubName}: new access code for your booking on {day}
booking.accessCodeChanged.body=Hello {firstName},\n\nA new access code applies to your booking at {clubName}. These are all the codes you need for it now.\n\n{day}\n{from} to {to}\nCourt: {courts}\n\n{accessCodes}\n\n{clubName}\n{instanceLink}
booking.cancelled.subject={clubName}: booking on {day} cancelled
booking.cancelled.body=Hello {firstName},\n\nThe member who made this booking at {clubName} has cancelled it:\n\n{day}\n{from} to {to}\nCourt: {courts}\nBooking type: {card}\n\nYou no longer play on this court at that time.\n\n{clubName}\n{instanceLink}
booking.cancelledByClub.subject={clubName}: The club cancelled your booking on {day}
booking.cancelledByClub.body=Hello {firstName},\n\n{clubName} has cancelled this booking:\n\n{day}\n{from} to {to}\nCourt: {courts}\nBooking type: {card}\n\n{reason}\n\n{clubName}\n{instanceLink}
booking.released.subject={clubName}: Your court on {day} was freed because nobody checked in
booking.released.body=Hello {firstName},\n\nNobody checked in for this booking in time, so {clubName} has cancelled it and freed the court:\n\n{day}\n{from} to {to}\nCourt: {courts}\nBooking type: {card}\n\nThe member who booked checks in under My bookings from 15 minutes before the start.\n\n{clubName}\n{instanceLink}
booking.seriesCreated.subject={clubName}: series of bookings created from {first}
booking.seriesCreated.body=Hello {firstName},\n\nYour series of bookings at {clubName} has been created.\n\n{weekdays}, {from} to {to}\nCourt: {courts}\nBooking type: {card}\nFirst date: {first}\nLast date: {last}\nOccurrences: {count}\n\nEvery date is listed in Courtside, where you can cancel it on its own or with the rest of the series.\n\n{clubName}\n{instanceLink}
booking.cancellationReason.COURT_CONDITION=Reason: the condition of the court.
booking.cancellationReason.WEATHER=Reason: the weather.
booking.cancellationReason.CLUB_EVENT=Reason: a club event.
booking.cancellationReason.MAINTENANCE=Reason: maintenance work.
booking.cancellationReason.OTHER=Reason: something else. Contact your club if you want to know more.
booking.cancellationReason.none=Contact your club if you want to know why.
booking.seriesCancelledByClub.subject={clubName}: The club cancelled dates of your series from {first}
booking.seriesCancelledByClub.body=Hello {firstName},\n\n{clubName} has cancelled dates of your series of bookings.\n\n{weekdays}, {from} to {to}\nCourt: {courts}\nBooking type: {card}\nFirst cancelled date: {first}\nLast cancelled date: {last}\nCancelled dates: {count}\n\n{reason}\n\n{clubName}\n{instanceLink}
booking.seriesMovedByClub.subject={clubName}: The club moved dates of your series from {first}
booking.seriesMovedByClub.body=Hello {firstName},\n\n{clubName} has moved dates of your series of bookings.\n\nBefore: {previousFrom} to {previousTo}, court: {previousCourts}\nNow: {weekdays}, {from} to {to}, court: {courts}\nBooking type: {card}\nFirst moved date: {first}\nLast moved date: {last}\nMoved dates: {count}\n\nContact your club if you want to know why.\n\n{clubName}\n{instanceLink}
waitlist.offer.subject={clubName}: The court you queued for on {day} is free
waitlist.offer.body=Hello {firstName},\n\nThe slot you queued for at {clubName} is free, and it is reserved for you until {until} on {untilDay}.\n\n{day}\n{from} to {to}\nCourt: {courts}\nBooking type: {card}\n\nOpen Messages or My bookings in Courtside to take it. If you leave it, it passes to the next member waiting.\n\n{clubName}\n{instanceLink}
account.securityChanged.subject={clubName}: your account security changed
account.securityChanged.body=Hello {firstName},\n\nYour Courtside account security changed. Review your account security. Contact your club immediately if you did not make this change.\n\n{clubName}\n{instanceLink}
account.addressChanged.subject={clubName}: your account email address changed
account.addressChanged.body=Hello {firstName},\n\nThe email address of your Courtside account changed. Messages from your club no longer reach this address. Contact your club immediately if you did not ask for this change.\n\n{clubName}\n{instanceLink}

account.factorGuessingBlocked.subject={clubName}: repeated failed sign-in codes
account.factorGuessingBlocked.body=Hello {firstName},\n\nSomeone entered your password correctly and then failed your second factor several times. Courtside paused sign-in for your account for a while. If this was not you, someone knows your password: set a new one through account recovery on the sign-in page and contact your club.\n\n{clubName}\n{instanceLink}

account.mfaRecoveryCode.subject=Account recovery at {clubName}
account.mfaRecoveryCode.body=Hello {firstName},\n\nAn identity check started account recovery for {username}. Your previous sign-in is blocked.\n\nOpen the account recovery page on your club's Courtside instance and enter this code with a new permanent password:\n\n{resetCode}\n\nThe code expires at {expiresAt}. Redeeming it removes your previous second factors and recovery codes. You may then enroll new methods.\n\nIf you did not request recovery, contact your club immediately.
