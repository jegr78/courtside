credentials.newAccount.subject={clubName}: access for {firstName}
credentials.newAccount.body=Hello {firstName},\n\n{clubName} has set up an account for you.\n\nUser name: {username}\nPassword: {credential}\n\nYou will be asked to choose your own password when you first sign in. This password stops working on {expiresOn}; if that has passed, ask for a new one on the sign-in page.\n\nNobody at the club can see this password.\n\n{clubName}
credentials.passwordReset.subject={clubName}: a new password for {firstName}
credentials.passwordReset.body=Hello {firstName},\n\na new password has been issued for your account at {clubName}.\n\nUser name: {username}\nPassword: {credential}\n\nYou will be asked to choose your own password when you next sign in. This password stops working on {expiresOn}.\n\nIf you did not ask for this, reply to this message.\n\n{clubName}
account.usernameReminder.subject={clubName}: the user name for {firstName}
account.usernameReminder.body=Hello {firstName},\n\nsomebody asked {clubName} which accounts belong to this email address. This one signs in as:\n\nUser name: {username}\n\nNothing has changed and your password still works. If you have forgotten it, ask for a new one on the sign-in page with this user name.\n\nIf you did not ask for this, there is nothing you need to do.\n\n{clubName}
account.passwordResetCode.subject={clubName}: your reset code
account.passwordResetCode.body=Hello {firstName},\n\nsomebody asked {clubName} to let the account below set a new password. Nothing has changed yet, and nothing will unless this code is used.\n\nUser name: {username}\nCode: {code}\n\nEnter it on the sign-in page under "Forgotten your password or username?" together with the password you want. The code stops working on {expiresAt}.\n\nIf you did not ask for this, ignore this message: your password and your open sessions are untouched.\n\n{clubName}
booking.court=Court {number}
booking.confirmed.subject={clubName}: {day}, {from}
booking.confirmed.body=Hello {firstName},\n\nyour booking at {clubName} is confirmed.\n\n{day}\n{from} to {to}\nCourt: {courts}\nKind of booking: {card}\n\nYou can cancel it in the application.\n\n{clubName}
booking.playerRecorded.subject={clubName}: you are in a booking on {day}
booking.playerRecorded.body=Hello {firstName},\n\nsomebody recorded you as a player in a booking at {clubName}.\n\n{day}\n{from} to {to}\nCourt: {courts}\nKind of booking: {card}\n\nIf you are not playing, you can take yourself out of this booking in the application. Nobody's agreement is needed for that.\n\n{clubName}
booking.playerWithdrew.subject={clubName}: {player} is not playing
booking.playerWithdrew.body=Hello {firstName},\n\n{player} has taken themselves out of your booking at {clubName}.\n\n{day}\n{from} to {to}\nCourt: {courts}\n\nThe booking stands as it is.\n\n{clubName}
booking.displaced.court=A court your booking is on has been taken out of service
booking.displaced.card={card} is no longer offered
booking.displaced.day=The club is closed on that day from now on
booking.displaced.subject={clubName}: your booking on {day}
booking.displaced.body=Hello {firstName},\n\n{closure}.\n\nYour booking at {clubName}:\n{day}\n{from} to {to}\nCourt: {courts}\nKind of booking: {card}\n\nThe booking has not been cancelled by this. What happens with it is your club's decision.\n\n{clubName}
booking.displaced.hours=The opening hours on that day no longer cover your booking
booking.reminder.subject={clubName}: your court on {day}
booking.reminder.body=Hello {firstName},\n\na reminder of your booking at {clubName}.\n\n{day}\n{from} to {to}\nCourt: {courts}\nKind of booking: {card}\n\nIf you cannot play, cancelling in the application frees the court for somebody else.\n\n{clubName}
