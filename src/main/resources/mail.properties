credentials.newAccount.subject={clubName}: your access
credentials.newAccount.body=Hello {firstName},\n\n{clubName} has set up an account for you.\n\nUser name: {username}\nPassword: {credential}\n\nYou will be asked to choose your own password when you first sign in. This password stops working on {expiresOn}; if that has passed, ask your board for a new one.\n\nNobody at the club can see this password.\n\n{clubName}
credentials.passwordReset.subject={clubName}: your new password
credentials.passwordReset.body=Hello {firstName},\n\na new password has been issued for your account at {clubName}.\n\nUser name: {username}\nPassword: {credential}\n\nYou will be asked to choose your own password when you next sign in. This password stops working on {expiresOn}.\n\nIf you did not ask for this, reply to this message.\n\n{clubName}
