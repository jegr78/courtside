credentials.newAccount.subject={clubName}: Zugang für {firstName}
credentials.newAccount.body=Hallo {firstName},\n\n{clubName} hat ein Konto für dich eingerichtet.\n\nBenutzername: {username}\nPasswort: {credential}\n\nBeim ersten Anmelden wirst du gebeten, ein eigenes Passwort zu wählen. Dieses Passwort gilt bis zum {expiresOn}; ist der Termin vorbei, bitte den Vorstand um ein neues.\n\nNiemand im Verein kann dieses Passwort sehen.\n\n{clubName}
credentials.passwordReset.subject={clubName}: ein neues Passwort für {firstName}
credentials.passwordReset.body=Hallo {firstName},\n\nfür dein Konto bei {clubName} wurde ein neues Passwort ausgestellt.\n\nBenutzername: {username}\nPasswort: {credential}\n\nBeim nächsten Anmelden wirst du gebeten, ein eigenes Passwort zu wählen. Dieses Passwort gilt bis zum {expiresOn}.\n\nWenn du das nicht angefordert hast, antworte auf diese Nachricht.\n\n{clubName}
booking.court=Platz {number}
booking.confirmed.subject={clubName}: {day}, {from}
booking.confirmed.body=Hallo {firstName},\n\ndeine Buchung bei {clubName} steht.\n\n{day}\n{from} bis {to}\nPlatz: {courts}\nArt der Buchung: {card}\n\nAbsagen kannst du sie in der Anwendung.\n\n{clubName}
booking.playerRecorded.subject={clubName}: du bist in einer Buchung am {day}
booking.playerRecorded.body=Hallo {firstName},\n\njemand hat dich in eine Buchung bei {clubName} eingetragen.\n\n{day}\n{from} bis {to}\nPlatz: {courts}\nArt der Buchung: {card}\n\nWenn du nicht mitspielst, kannst du dich in der Anwendung selbst wieder austragen. Dafür braucht es niemandes Zustimmung.\n\n{clubName}
booking.playerWithdrew.subject={clubName}: {player} spielt nicht mit
booking.playerWithdrew.body=Hallo {firstName},\n\n{player} hat sich aus deiner Buchung bei {clubName} ausgetragen.\n\n{day}\n{from} bis {to}\nPlatz: {courts}\n\nDie Buchung bleibt bestehen.\n\n{clubName}
booking.displaced.court=Ein Platz deiner Buchung ist außer Betrieb genommen worden
booking.displaced.card={card} wird nicht mehr angeboten
booking.displaced.day=Der Verein hat an diesem Tag von nun an geschlossen
booking.displaced.subject={clubName}: deine Buchung am {day}
booking.displaced.body=Hallo {firstName},\n\n{closure}.\n\nDeine Buchung bei {clubName}:\n{day}\n{from} bis {to}\nPlatz: {courts}\nArt der Buchung: {card}\n\nAbgesagt ist die Buchung damit nicht. Was mit ihr geschieht, entscheidet dein Verein.\n\n{clubName}
booking.displaced.hours=Die Öffnungszeiten an diesem Tag decken deine Buchung nicht mehr ab
