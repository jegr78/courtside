account.welcome.subject={clubName}: Willkommen bei Courtside, {firstName}
account.welcome.body=Hallo {firstName},\n\n{clubName} hat dir ein Konto in Courtside angelegt. Dort buchst du die Plätze des Vereins.\n\nDeine Anmeldedaten bekommst du in einer eigenen Nachricht. Courtside schickt nie einen Link zusammen mit einem Passwort. Enthält eine Nachricht beides, stammt sie nicht von {clubName}.\n\n{clubName}\n{instanceLink}
credentials.newAccount.subject={clubName}: Courtside-Konto für {firstName}
credentials.newAccount.body=Hallo {firstName},\n\n{clubName} hat ein Courtside-Konto für dich angelegt.\n\nBenutzername: {username}\nEinmalpasswort: {credential}\n\nMelde dich an und ersetze dieses Passwort durch ein eigenes. Das Einmalpasswort gilt bis {expiresOn}. Ist es abgelaufen, fordere auf der Anmeldeseite einen Code zum Zurücksetzen an.\n\nNiemand im Verein kann dieses Passwort sehen.\n\n{clubName}
credentials.passwordReset.subject={clubName}: neue Zugangsdaten für {firstName}
credentials.passwordReset.body=Hallo {firstName},\n\n{clubName} hat ein neues Einmalpasswort für dein Courtside-Konto ausgestellt.\n\nBenutzername: {username}\nEinmalpasswort: {credential}\n\nMelde dich an und ersetze dieses Passwort durch ein eigenes. Das Einmalpasswort gilt bis {expiresOn}.\n\nAntworte auf diese Nachricht, wenn du das nicht angefordert hast.\n\n{clubName}
account.usernameReminder.subject={clubName}: dein Courtside-Benutzername
account.usernameReminder.body=Hallo {firstName},\n\nJemand hat die Benutzernamen angefordert, die bei {clubName} zu dieser E-Mail-Adresse gehören. Dieses Konto verwendet:\n\nBenutzername: {username}\n\nDein Konto und dein Passwort sind unverändert. Wenn du auch das Passwort vergessen hast, fordere auf der Anmeldeseite mit diesem Benutzernamen einen Code zum Zurücksetzen an.\n\nDu kannst diese Nachricht ignorieren, wenn du sie nicht angefordert hast.\n\n{clubName}
account.passwordResetCode.subject={clubName}: dein Code zum Zurücksetzen
account.passwordResetCode.body=Hallo {firstName},\n\nJemand hat für das unten genannte Konto einen Code zum Zurücksetzen des Passworts angefordert. Dein Passwort und deine offenen Sitzungen bleiben unverändert, solange niemand den Code verwendet.\n\nBenutzername: {username}\nCode: {resetCode}\n\nÖffne auf der Anmeldeseite "Passwort oder Benutzername vergessen?". Gib dort den Code ein und wähle ein neues Passwort. Der Code gilt bis {expiresAt}.\n\nDu kannst diese Nachricht ignorieren, wenn du sie nicht angefordert hast.\n\n{clubName}
booking.court=Platz {number}
booking.confirmed.subject={clubName}: Buchung am {day} um {from} bestätigt
booking.confirmed.body=Hallo {firstName},\n\nDeine Buchung bei {clubName} ist bestätigt.\n\n{day}\n{from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\n{accessCodes}\n\nDu kannst die Buchung in Courtside stornieren.\n\n{clubName}\n{instanceLink}
booking.playerRecorded.subject={clubName}: zu einer Buchung am {day} hinzugefügt
booking.playerRecorded.body=Hallo {firstName},\n\nJemand hat dich als Mitspieler zu dieser Buchung bei {clubName} hinzugefügt:\n\n{day}\n{from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\n\nWenn du nicht mitspielst, öffne die Buchung in Courtside und trage dich aus. Du brauchst dafür keine Zustimmung der buchenden Person.\n\n{clubName}\n{instanceLink}
booking.playerWithdrew.subject={clubName}: {player} hat deine Buchung verlassen
booking.playerWithdrew.body=Hallo {firstName},\n\n{player} hat sich aus deiner Buchung bei {clubName} ausgetragen.\n\n{day}\n{from} bis {to}\nPlatz: {courts}\n\nDie Buchung bleibt bestehen.\n\n{clubName}\n{instanceLink}
booking.partnerFound.subject={clubName}: {player} spielt mit
booking.partnerFound.body=Hallo {firstName},\n\n{player} hat den offenen Platz in deiner Buchung bei {clubName} übernommen.\n\n{day}\n{from} bis {to}\nPlatz: {courts}\n\nDie Suche nach einem Mitspieler ist damit beendet.\n\n{clubName}\n{instanceLink}
booking.placeTaken.subject={clubName}: du spielst am {day} mit
booking.placeTaken.body=Hallo {firstName},\n\ndu hast einen offenen Platz in dieser Buchung bei {clubName} übernommen:\n\n{day}\n{from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\n\nWenn du doch nicht spielst, öffne die Buchung in Courtside und trage dich aus.\n\n{clubName}\n{instanceLink}
booking.displaced.court=Ein Platz deiner Buchung wurde deaktiviert
booking.displaced.card={card} wird nicht mehr angeboten
booking.displaced.day=Der Verein hat an diesem Tag künftig geschlossen
booking.displaced.subject={clubName}: Änderung an deiner Buchung am {day}
booking.displaced.body=Hallo {firstName},\n\n{closure}.\n\nBetroffene Buchung bei {clubName}:\n{day}\n{from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\n\nCourtside hat die Buchung nicht storniert. Frage deinen Verein, wenn du wissen möchtest, wie es weitergeht.\n\n{clubName}\n{instanceLink}
booking.displaced.hours=Die Öffnungszeiten umfassen deine Buchung nicht mehr
booking.displaced.holiday=Ein Feiertag ändert die Öffnungszeiten an diesem Tag, und sie umfassen deine Buchung nicht mehr
booking.displaced.season=Die Öffnungszeiten der Saison umfassen deine Buchung nicht mehr
booking.displaced.courtClosed=Der Verein hat den Platz an diesem Tag gesperrt
booking.reminder.subject={clubName}: Erinnerung an deine Buchung am {day}
booking.reminder.body=Hallo {firstName},\n\nDies ist eine Erinnerung an deine Buchung bei {clubName}.\n\n{day}\n{from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\n{accessCodes}\n\nWenn du nicht spielen kannst, storniere die Buchung in Courtside. Dann kann ein anderes Mitglied den Platz nutzen.\n\n{clubName}\n{instanceLink}
booking.access.heading=Zugangscode, gültig von {validFrom} bis {validUntil}:
booking.access.code={accessPoint}: {accessCode}
booking.accessCodeChanged.subject={clubName}: neuer Zugangscode für deine Buchung am {day}
booking.accessCodeChanged.body=Hallo {firstName},\n\nFür deine Buchung bei {clubName} gilt ein neuer Zugangscode. Hier stehen alle Codes, die du jetzt für sie brauchst.\n\n{day}\n{from} bis {to}\nPlatz: {courts}\n\n{accessCodes}\n\n{clubName}\n{instanceLink}
members.doorCodeChanged.subject={clubName}: neuer Türcode für Mitglieder
members.doorCodeChanged.body=Hallo {firstName},\n\nDieser Code öffnet bei {clubName} jetzt eine Tür für alle Mitglieder, mit oder ohne Buchung.\n\n{accessCodes}\n\n{clubName}\n{instanceLink}
booking.cancelled.subject={clubName}: Buchung am {day} storniert
booking.cancelled.body=Hallo {firstName},\n\nDie Person, die diese Buchung bei {clubName} angelegt hat, hat sie storniert:\n\n{day}\n{from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\n\nDu spielst zu dieser Zeit nicht mehr auf diesem Platz.\n\n{clubName}\n{instanceLink}
booking.cancelledByClub.subject={clubName}: Deine Buchung am {day} wurde vom Verein storniert
booking.cancelledByClub.body=Hallo {firstName},\n\n{clubName} hat diese Buchung storniert:\n\n{day}\n{from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\n\n{reason}\n\n{clubName}\n{instanceLink}
booking.released.subject={clubName}: Dein Platz am {day} wurde freigegeben, weil niemand eingecheckt hat
booking.released.body=Hallo {firstName},\n\nFür diese Buchung hat niemand rechtzeitig eingecheckt. {clubName} hat sie deshalb storniert und den Platz freigegeben:\n\n{day}\n{from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\n\nWer gebucht hat, checkt unter Meine Buchungen ab 15 Minuten vor Beginn ein.\n\n{clubName}\n{instanceLink}
booking.seriesCreated.subject={clubName}: Buchungsserie ab {first} angelegt
booking.seriesCreated.body=Hallo {firstName},\n\nDeine Buchungsserie bei {clubName} ist angelegt.\n\n{weekdays}, {from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\nErster Termin: {first}\nLetzter Termin: {last}\nTermine: {count}\n\nCourtside listet jeden Termin. Dort kannst du ihn einzeln oder mit dem Rest der Serie stornieren.\n\n{clubName}\n{instanceLink}
booking.cancellationReason.COURT_CONDITION=Grund: der Zustand des Platzes.
booking.cancellationReason.WEATHER=Grund: das Wetter.
booking.cancellationReason.CLUB_EVENT=Grund: eine Veranstaltung des Vereins.
booking.cancellationReason.MAINTENANCE=Grund: Wartungsarbeiten.
booking.cancellationReason.OTHER=Grund: ein anderer Anlass. Frage deinen Verein, wenn du mehr wissen möchtest.
booking.cancellationReason.none=Frage deinen Verein, wenn du den Grund wissen möchtest.
booking.seriesCancelledByClub.subject={clubName}: Der Verein hat Termine deiner Serie ab {first} storniert
booking.seriesCancelledByClub.body=Hallo {firstName},\n\n{clubName} hat Termine deiner Buchungsserie storniert.\n\n{weekdays}, {from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\nErster stornierter Termin: {first}\nLetzter stornierter Termin: {last}\nStornierte Termine: {count}\n\n{reason}\n\n{clubName}\n{instanceLink}
booking.seriesMovedByClub.subject={clubName}: Der Verein hat Termine deiner Serie ab {first} verlegt
booking.seriesMovedByClub.body=Hallo {firstName},\n\n{clubName} hat Termine deiner Buchungsserie verlegt.\n\nBisher: {previousFrom} bis {previousTo}, Platz: {previousCourts}\nJetzt: {weekdays}, {from} bis {to}, Platz: {courts}\nBuchungsart: {card}\nErster verlegter Termin: {first}\nLetzter verlegter Termin: {last}\nVerlegte Termine: {count}\n\nFrage deinen Verein, wenn du den Grund wissen möchtest.\n\n{clubName}\n{instanceLink}
waitlist.offer.subject={clubName}: Der Platz, auf den du am {day} wartest, ist frei
waitlist.offer.body=Hallo {firstName},\n\nder Platz, auf den du bei {clubName} wartest, ist frei geworden. Er ist bis {until} Uhr am {untilDay} für dich reserviert.\n\n{day}\n{from} bis {to}\nPlatz: {courts}\nBuchungsart: {card}\n\nÖffne Nachrichten oder Meine Buchungen in Courtside, um ihn zu buchen. Lässt du das Angebot verstreichen, geht es an das nächste wartende Mitglied.\n\n{clubName}\n{instanceLink}
account.securityChanged.subject={clubName}: deine Kontosicherheit wurde geändert
account.securityChanged.body=Hallo {firstName},\n\nDeine Courtside-Kontosicherheit wurde geändert. Prüfe deine Sicherheitseinstellungen. Wende dich sofort an deinen Verein, wenn du diese Änderung nicht veranlasst hast.\n\n{clubName}\n{instanceLink}
account.addressChanged.subject={clubName}: die E-Mail-Adresse deines Kontos wurde geändert
account.addressChanged.body=Hallo {firstName},\n\nDie E-Mail-Adresse deines Courtside-Kontos wurde geändert. Nachrichten deines Vereins erreichen diese Adresse nicht mehr. Wende dich sofort an deinen Verein, wenn du diese Änderung nicht veranlasst hast.\n\n{clubName}\n{instanceLink}

account.factorGuessingBlocked.subject={clubName}: wiederholt falsche Anmeldecodes
account.factorGuessingBlocked.body=Hallo {firstName},\n\njemand hat dein Passwort richtig eingegeben und danach mehrmals einen falschen zweiten Faktor. Courtside hat die Anmeldung für dein Konto vorübergehend pausiert. Warst du das nicht, kennt jemand dein Passwort: Setze über die Kontowiederherstellung auf der Anmeldeseite ein neues und wende dich an deinen Verein.\n\n{clubName}\n{instanceLink}

account.mfaRecoveryCode.subject=Kontowiederherstellung bei {clubName}
account.mfaRecoveryCode.body=Hallo {firstName},\n\nnach einer Identitätsprüfung wurde die Kontowiederherstellung für {username} gestartet. Deine bisherige Anmeldung ist gesperrt.\n\nÖffne die Kontowiederherstellung in der Courtside-Instanz deines Vereins und gib diesen Code zusammen mit einem neuen dauerhaften Passwort ein:\n\n{resetCode}\n\nDer Code gilt bis {expiresAt}. Beim Einlösen werden deine bisherigen zweiten Faktoren und Wiederherstellungscodes entfernt. Danach kannst du neue Methoden einrichten.\n\nFalls du die Wiederherstellung nicht angefragt hast, kontaktiere sofort deinen Verein.
