courtside:
  environment: DEVELOPMENT
  mail:
    host: localhost
    port: 2525
    from: no-reply@courtside.test
    reply-to: board@courtside.test
  admission:
    account: { burst: 1000000, per-second: 1000000 }
    address: { burst: 1000000, per-second: 1000000 }
  bootstrap-admin:
    username: bootstrap-admin
    password: temporary-password
    display-name: Bootstrap Administrator
  warm-up:
    enabled: false

server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  modulith:
    moments:
      enabled: false
  datasource:
    hikari:
      # A closure cancelling a paid booking holds four connections on one thread; two more keep a background pass from starving it.
      maximum-pool-size: 6
      minimum-idle: 0

logging:
  level:
    org.hibernate.orm.jdbc.error: ERROR
